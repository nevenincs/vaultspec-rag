    <g class="terminal-3723885169-matrix">
    <text class="terminal-3723885169-r1" x="0" y="20" textLength="719.8" clip-path="url(#terminal-3723885169-line-0)">1.&#160;.vault/adr/2026-06-02-rag-index-performance-adr.md:23-28</text><text class="terminal-3723885169-r2" x="1366.4" y="20" textLength="12.2" clip-path="url(#terminal-3723885169-line-0)">
</text><text class="terminal-3723885169-r3" x="36.6" y="44.4" textLength="1329.8" clip-path="url(#terminal-3723885169-line-1)">adr&#160;|&#160;feature:&#160;rag-index-performance&#160;|&#160;status:&#160;accepted&#160;|&#160;2026-06-02&#160;|&#160;related:&#160;[[2026-06-02-rag-index-perfo…</text><text class="terminal-3723885169-r2" x="1366.4" y="44.4" textLength="12.2" clip-path="url(#terminal-3723885169-line-1)">
</text><text class="terminal-3723885169-r2" x="0" y="68.8" textLength="1049.2" clip-path="url(#terminal-3723885169-line-2)">&#160;&#160;&#160;tree-sitter&#160;holds&#160;the&#160;GIL&#160;for&#160;parse&#160;and&#160;traverse,&#160;so&#160;multi-core&#160;chunking&#160;requires&#160;a</text><text class="terminal-3723885169-r2" x="1366.4" y="68.8" textLength="12.2" clip-path="url(#terminal-3723885169-line-2)">
</text><text class="terminal-3723885169-r2" x="0" y="93.2" textLength="1110.2" clip-path="url(#terminal-3723885169-line-3)">&#160;&#160;&#160;`ProcessPoolExecutor`&#160;(free-threading&#160;is&#160;not&#160;viable).&#160;The&#160;GPU&#160;stage&#160;is&#160;single-writer&#160;and</text><text class="terminal-3723885169-r2" x="1366.4" y="93.2" textLength="12.2" clip-path="url(#terminal-3723885169-line-3)">
</text><text class="terminal-3723885169-r2" x="0" y="117.6" textLength="1122.4" clip-path="url(#terminal-3723885169-line-4)">&#160;&#160;&#160;shares&#160;the&#160;device&#160;with&#160;the&#160;resident&#160;search&#160;service&#160;via&#160;a&#160;GPU&#160;lock.&#160;torch&#160;releases&#160;the&#160;GIL</text><text class="terminal-3723885169-r2" x="1366.4" y="117.6" textLength="12.2" clip-path="url(#terminal-3723885169-line-4)">
</text><text class="terminal-3723885169-r2" x="0" y="142" textLength="1134.6" clip-path="url(#terminal-3723885169-line-5)">&#160;&#160;&#160;during&#160;async&#160;CUDA,&#160;so&#160;one&#160;dedicated&#160;consumer&#160;thread,&#160;fed&#160;by&#160;a&#160;separate&#160;producer,&#160;saturates</text><text class="terminal-3723885169-r2" x="1366.4" y="142" textLength="12.2" clip-path="url(#terminal-3723885169-line-5)">
</text><text class="terminal-3723885169-r2" x="0" y="166.4" textLength="1146.8" clip-path="url(#terminal-3723885169-line-6)">&#160;&#160;&#160;the&#160;GPU&#160;(the&#160;DataLoader&#160;pattern);&#160;more&#160;consumer&#160;threads&#160;or&#160;CUDA&#160;streams&#160;do&#160;not&#160;help&#160;because</text><text class="terminal-3723885169-r2" x="1366.4" y="166.4" textLength="12.2" clip-path="url(#terminal-3723885169-line-6)">
</text><text class="terminal-3723885169-r2" x="0" y="190.8" textLength="597.8" clip-path="url(#terminal-3723885169-line-7)">&#160;&#160;&#160;compute-bound&#160;kernels&#160;serialise&#160;on&#160;one&#160;device.</text><text class="terminal-3723885169-r2" x="1366.4" y="190.8" textLength="12.2" clip-path="url(#terminal-3723885169-line-7)">
</text><text class="terminal-3723885169-r1" x="0" y="215.2" textLength="683.2" clip-path="url(#terminal-3723885169-line-8)">2.&#160;.vault/adr/2026-06-02-index-gpu-pipeline-adr.md:27-33</text><text class="terminal-3723885169-r2" x="1366.4" y="215.2" textLength="12.2" clip-path="url(#terminal-3723885169-line-8)">
</text><text class="terminal-3723885169-r3" x="36.6" y="239.6" textLength="1329.8" clip-path="url(#terminal-3723885169-line-9)">adr&#160;|&#160;feature:&#160;index-gpu-pipeline&#160;|&#160;status:&#160;accepted&#160;|&#160;2026-06-02&#160;|&#160;related:&#160;[[2026-06-02-index-gpu-pipeline…</text><text class="terminal-3723885169-r2" x="1366.4" y="239.6" textLength="12.2" clip-path="url(#terminal-3723885169-line-9)">
</text><text class="terminal-3723885169-r2" x="0" y="264" textLength="1085.8" clip-path="url(#terminal-3723885169-line-10)">&#160;&#160;&#160;The&#160;research&#160;establishes&#160;the&#160;governing&#160;physics:&#160;on&#160;one&#160;GPU&#160;there&#160;is&#160;no&#160;compute/compute</text><text class="terminal-3723885169-r2" x="1366.4" y="264" textLength="12.2" clip-path="url(#terminal-3723885169-line-10)">
</text><text class="terminal-3723885169-r2" x="0" y="288.4" textLength="1122.4" clip-path="url(#terminal-3723885169-line-11)">&#160;&#160;&#160;overlap&#160;to&#160;exploit&#160;—&#160;two&#160;compute-bound&#160;kernels&#160;serialise&#160;regardless&#160;of&#160;CUDA&#160;streams&#160;(A3).</text><text class="terminal-3723885169-r2" x="1366.4" y="288.4" textLength="12.2" clip-path="url(#terminal-3723885169-line-11)">
</text><text class="terminal-3723885169-r2" x="0" y="312.8" textLength="1146.8" clip-path="url(#terminal-3723885169-line-12)">&#160;&#160;&#160;The&#160;only&#160;real&#160;parallelism&#160;is&#160;CPU-produce&#160;versus&#160;GPU-consume.&#160;PyTorch&#160;releases&#160;the&#160;GIL&#160;while</text><text class="terminal-3723885169-r2" x="1366.4" y="312.8" textLength="12.2" clip-path="url(#terminal-3723885169-line-12)">
</text><text class="terminal-3723885169-r2" x="0" y="337.2" textLength="1146.8" clip-path="url(#terminal-3723885169-line-13)">&#160;&#160;&#160;an&#160;async&#160;CUDA&#160;kernel&#160;runs&#160;(A2),&#160;so&#160;a&#160;single&#160;dedicated&#160;consumer&#160;thread&#160;is&#160;sufficient&#160;to&#160;keep</text><text class="terminal-3723885169-r2" x="1366.4" y="337.2" textLength="12.2" clip-path="url(#terminal-3723885169-line-13)">
</text><text class="terminal-3723885169-r2" x="0" y="361.6" textLength="1159" clip-path="url(#terminal-3723885169-line-14)">&#160;&#160;&#160;the&#160;GPU&#160;busy&#160;provided&#160;a&#160;separate&#160;producer&#160;keeps&#160;its&#160;input&#160;queue&#160;non-empty&#160;—&#160;which&#160;is&#160;exactly</text><text class="terminal-3723885169-r2" x="1366.4" y="361.6" textLength="12.2" clip-path="url(#terminal-3723885169-line-14)">
</text><text class="terminal-3723885169-r2" x="0" y="386" textLength="1110.2" clip-path="url(#terminal-3723885169-line-15)">&#160;&#160;&#160;how&#160;`torch.utils.data.DataLoader`&#160;is&#160;built&#160;(worker&#160;processes&#160;produce,&#160;a&#160;thread&#160;consumes,</text><text class="terminal-3723885169-r2" x="1366.4" y="386" textLength="12.2" clip-path="url(#terminal-3723885169-line-15)">
</text><text class="terminal-3723885169-r2" x="0" y="410.4" textLength="1098" clip-path="url(#terminal-3723885169-line-16)">&#160;&#160;&#160;A1).&#160;Multiple&#160;consumer&#160;threads&#160;would&#160;only&#160;serialise&#160;on&#160;GIL&#160;launch&#160;overhead&#160;and&#160;the&#160;SMs.</text><text class="terminal-3723885169-r2" x="1366.4" y="410.4" textLength="12.2" clip-path="url(#terminal-3723885169-line-16)">
</text><text class="terminal-3723885169-r4" x="0" y="434.8" textLength="36.6" clip-path="url(#terminal-3723885169-line-17)">&#160;&#160;…</text><text class="terminal-3723885169-r2" x="1366.4" y="434.8" textLength="12.2" clip-path="url(#terminal-3723885169-line-17)">
