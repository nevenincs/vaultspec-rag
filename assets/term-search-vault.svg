</text><text class="terminal-3620910294-r1" x="0" y="44.4" textLength="610" clip-path="url(#terminal-3620910294-line-1)">&#160;&#160;&#160;adr&#160;|&#160;feature:&#160;service-concurrency&#160;|&#160;2026-06-12</text><text class="terminal-3620910294-r1" x="1220" y="44.4" textLength="12.2" clip-path="url(#terminal-3620910294-line-1)">
</text><text class="terminal-3620910294-r1" x="1220" y="68.8" textLength="12.2" clip-path="url(#terminal-3620910294-line-2)">
</text><text class="terminal-3620910294-r1" x="0" y="93.2" textLength="183" clip-path="url(#terminal-3620910294-line-3)">&#160;&#160;&#160;##&#160;Rationale</text><text class="terminal-3620910294-r1" x="1220" y="93.2" textLength="12.2" clip-path="url(#terminal-3620910294-line-3)">
</text><text class="terminal-3620910294-r1" x="1220" y="117.6" textLength="12.2" clip-path="url(#terminal-3620910294-line-4)">
</text><text class="terminal-3620910294-r1" x="0" y="142" textLength="1024.8" clip-path="url(#terminal-3620910294-line-5)">&#160;&#160;&#160;The&#160;research&#x27;s&#160;F1&#160;finding&#160;explains&#160;the&#160;observed&#160;idle&#160;hardware:&#160;strict&#160;alternation</text><text class="terminal-3620910294-r1" x="1220" y="142" textLength="12.2" clip-path="url(#terminal-3620910294-line-5)">
</text><text class="terminal-3620910294-r1" x="0" y="166.4" textLength="988.2" clip-path="url(#terminal-3620910294-line-6)">&#160;&#160;&#160;between&#160;two&#160;exclusive&#160;locks&#160;with&#160;no&#160;pipelining.&#160;D2&#160;and&#160;D3&#160;attack&#160;the&#160;two&#160;locks</text><text class="terminal-3620910294-r1" x="1220" y="166.4" textLength="12.2" clip-path="url(#terminal-3620910294-line-6)">
</text><text class="terminal-3620910294-r1" x="0" y="190.8" textLength="1061.4" clip-path="url(#terminal-3620910294-line-7)">&#160;&#160;&#160;directly&#160;along&#160;the&#160;only&#160;legal&#160;axis&#160;(narrowing&#160;holds&#160;and&#160;removing&#160;false&#160;sharing&#160;—&#160;the</text><text class="terminal-3620910294-r1" x="1220" y="190.8" textLength="12.2" clip-path="url(#terminal-3620910294-line-7)">
</text><text class="terminal-3620910294-r1" x="0" y="215.2" textLength="976" clip-path="url(#terminal-3620910294-line-8)">&#160;&#160;&#160;single-GPU&#160;and&#160;single-writer-local&#160;constraints&#160;stay&#160;intact).&#160;D4–D6&#160;remove&#160;the</text><text class="terminal-3620910294-r1" x="1220" y="215.2" textLength="12.2" clip-path="url(#terminal-3620910294-line-8)">
</text><text class="terminal-3620910294-r1" x="0" y="239.6" textLength="976" clip-path="url(#terminal-3620910294-line-9)">&#160;&#160;&#160;event-loop&#160;and&#160;thread-pool&#160;failure&#160;modes&#160;that&#160;can&#160;serialize&#160;the&#160;whole&#160;service</text><text class="terminal-3620910294-r1" x="1220" y="239.6" textLength="12.2" clip-path="url(#terminal-3620910294-line-9)">
</text><text class="terminal-3620910294-r1" x="0" y="264" textLength="1085.8" clip-path="url(#terminal-3620910294-line-10)">&#160;&#160;&#160;regardless&#160;of&#160;lock&#160;behavior.&#160;D7–D9&#160;fix&#160;the&#160;quality&#160;defects&#160;that&#160;would&#160;otherwise&#160;make&#160;a</text><text class="terminal-3620910294-r1" x="1220" y="264" textLength="12.2" clip-path="url(#terminal-3620910294-line-10)">
</text><text class="terminal-3620910294-r1" x="0" y="288.4" textLength="976" clip-path="url(#terminal-3620910294-line-11)">&#160;&#160;&#160;faster&#160;service&#160;merely&#160;return&#160;bad&#160;results&#160;faster&#160;—&#160;and&#160;D3/D7&#160;interact&#160;(content</text><text class="terminal-3620910294-r1" x="1220" y="288.4" textLength="12.2" clip-path="url(#terminal-3620910294-line-11)">
</text><text class="terminal-3620910294-r1" x="0" y="312.8" textLength="1012.6" clip-path="url(#terminal-3620910294-line-12)">&#160;&#160;&#160;reranking&#160;needs&#160;chunk-granular&#160;content&#160;to&#160;rerank),&#160;which&#160;is&#160;why&#160;they&#160;ship&#160;in&#160;one</text><text class="terminal-3620910294-r1" x="1220" y="312.8" textLength="12.2" clip-path="url(#terminal-3620910294-line-12)">
</text><text class="terminal-3620910294-r1" x="0" y="337.2" textLength="1024.8" clip-path="url(#terminal-3620910294-line-13)">&#160;&#160;&#160;architecture&#160;revision&#160;rather&#160;than&#160;as&#160;independent&#160;patches.&#160;D1&#160;brackets&#160;everything:</text><text class="terminal-3620910294-r1" x="1220" y="337.2" textLength="12.2" clip-path="url(#terminal-3620910294-line-13)">
</text><text class="terminal-3620910294-r1" x="0" y="361.6" textLength="1073.6" clip-path="url(#terminal-3620910294-line-14)">&#160;&#160;&#160;since&#160;utilization&#160;claims&#160;started&#160;this&#160;work,&#160;every&#160;change&#160;must&#160;be&#160;measured&#160;against&#160;the</text><text class="terminal-3620910294-r1" x="1220" y="361.6" textLength="12.2" clip-path="url(#terminal-3620910294-line-14)">
</text><text class="terminal-3620910294-r1" x="0" y="386" textLength="573.4" clip-path="url(#terminal-3620910294-line-15)">&#160;&#160;&#160;same&#160;adversarial&#160;harness&#160;on&#160;the&#160;same&#160;corpus.</text><text class="terminal-3620910294-r1" x="1220" y="386" textLength="12.2" clip-path="url(#terminal-3620910294-line-15)">
</text><text class="terminal-3620910294-r1" x="1220" y="410.4" textLength="12.2" clip-path="url(#terminal-3620910294-line-16)">
</text><text class="terminal-3620910294-r1" x="0" y="434.8" textLength="219.6" clip-path="url(#terminal-3620910294-line-17)">&#160;&#160;&#160;##&#160;Consequences</text><text class="terminal-3620910294-r1" x="1220" y="434.8" textLength="12.2" clip-path="url(#terminal-3620910294-line-17)">
</text><text class="terminal-3620910294-r1" x="1220" y="459.2" textLength="12.2" clip-path="url(#terminal-3620910294-line-18)">
</text><text class="terminal-3620910294-r1" x="0" y="483.6" textLength="988.2" clip-path="url(#terminal-3620910294-line-19)">&#160;&#160;&#160;-&#160;Search&#160;concurrency&#160;improves&#160;on&#160;every&#160;axis&#160;that&#160;is&#160;legally&#160;improvable:&#160;cross-</text><text class="terminal-3620910294-r1" x="1220" y="483.6" textLength="12.2" clip-path="url(#terminal-3620910294-line-19)">
