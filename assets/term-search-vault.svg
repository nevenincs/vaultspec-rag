</text><text class="terminal-3620910294-r2" x="0" y="556.8" textLength="36.6" clip-path="url(#terminal-3620910294-line-22)">&#160;&#160;…</text><text class="terminal-3620910294-r1" x="1220" y="556.8" textLength="12.2" clip-path="url(#terminal-3620910294-line-22)">
