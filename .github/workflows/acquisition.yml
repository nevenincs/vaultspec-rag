name: RAG Acquisition

run-name: RAG Acquisition ${{ inputs.tag || 'latest' }} @ ${{ inputs.target_sha || 'scheduled' }}

# Committed main supplies the catalog and driver. Only downloaded monitor
# bytes run with an empty PATH/home and no checkout or backend sibling.
# Live checksums add coverage; reviewed committed pins authorize launch.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to the public latest release)"
        required: false
        type: string
      target_sha:
        description: "Expected immutable producer commit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: acquisition-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  acquire:
    name: "Test: Monitor acquisition (${{ matrix.name }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: [self-hosted, Linux, X64, build]
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: [self-hosted, Linux, ARM64]
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            runner: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
    timeout-minutes: 150
    runs-on: ${{ matrix.runner }}
    env:
      CI_EXEC_BUDGET_MINUTES: 30
    steps:
      - name: Checkout the reviewed catalog and acquisition driver
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: main
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Set up Node for installed-browser verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Verify public delivery against committed pins and render native bytes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 -- python -m tools.monitor.acquire \
            --tag "$TAG" --source-revision "$TARGET_SHA" --target "$TARGET" \
            --report "dist-release-evidence/acquisition-$TARGET.json"
      - name: Upload native acquisition evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monitor-acquisition-${{ matrix.target }}-${{ github.run_id }}
          path: dist-release-evidence/acquisition-*.json
          if-no-files-found: error
          retention-days: 30
