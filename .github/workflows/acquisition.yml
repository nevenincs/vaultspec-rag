name: RAG Acquisition

run-name: RAG Acquisition ${{ inputs.tag || github.event.release.tag_name || 'latest' }} @ ${{ inputs.target_sha || 'scheduled' }}

# Everything else in this repository tests what is IN the tree. This tests what
# a user actually receives: it downloads the published target bundle onto a machine
# with no checkout, no warm cache and no toolchain, and asks the one question
# the build cannot answer about itself - does the dynamic loader accept it.
#
# vaultspec-rag#409 is why. A Linux binary built on a host with newer glibc than
# the floor it claims loads fine everywhere it is built and tested, and fails on
# a user's machine with a missing symbol version. That gap was found by reading
# ELF sections by hand, at v0.4.14, three releases after it appeared. Running
# the artifact on a distribution older than the build host closes it.
#
# WHAT THIS ASSERTS, AND WHAT IT DELIBERATELY DOES NOT
#
# It asserts the loader accepts the binary. It does NOT assert the product
# works, and that is not laziness: the binary is a PyApp bootstrapper whose
# explicit GPU runtime download is both multi-gigabyte and unusable on these
# no-GPU hosts. `ldd` answers the loader question without triggering that
# download, which is the only claim this workflow can exercise honestly.
#
# It cannot run before publication, so it runs after. Note that
# `release: published` is INERT for releases this repository cuts: GitHub raises
# no workflow events for refs created with the default GITHUB_TOKEN, and
# release-please publishes with exactly that token. It is declared anyway for a
# human-published release, but the path that actually reaches this workflow is
# the explicit dispatch from `binaries.yml`, plus the weekly schedule. The
# schedule matters on its own: acquisition rots for reasons no commit causes -
# a yanked release, a renamed asset, a base image whose glibc moves.

on:
  release:
    types: [published]
  schedule:
    # Weekly, off the hour: nothing here is urgent and the fleet is shared.
    - cron: '41 6 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to acquire (defaults to the latest release)'
        required: false
        type: string
      target_sha:
        description: 'Immutable producer commit expected by the release gate'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: acquisition-${{ inputs.tag || github.event.release.tag_name || 'latest' }}
  cancel-in-progress: false

jobs:
  acquire:
    name: "Test: Binary acquisition (Linux, ${{ matrix.arch }}, ${{ matrix.distro }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          # AT the declared floor, on both architectures. Nothing else here
          # tests 2.28 itself - the Debian and Ubuntu images below sit
          # comfortably above it, so they would keep passing if the floor
          # slipped a version or two. RHEL 8's glibc is 2.28 exactly, which
          # makes these the two legs that can actually fail when a container
          # pin in binaries.yml stops doing its job.
          - image: docker.io/library/almalinux@sha256:9f355ae942d6a6c0561f0771dc053a2cfae9580fc45fa4252756db7c7e80c09f
            distro: almalinux-8
            setup: dnf install -y -q curl ca-certificates unzip jq
            arch: x86_64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - image: docker.io/library/almalinux@sha256:9f355ae942d6a6c0561f0771dc053a2cfae9580fc45fa4252756db7c7e80c09f
            distro: almalinux-8
            setup: dnf install -y -q curl ca-certificates unzip jq
            arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          # Above the floor and below the build host, which is the band a user
          # is most likely to be in. bookworm is 2.36, jammy is 2.35.
          - image: docker.io/library/debian@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
            distro: debian-12
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates unzip jq
            arch: x86_64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - image: docker.io/library/debian@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
            distro: debian-12
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates unzip jq
            arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - image: docker.io/library/ubuntu@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
            distro: ubuntu-22.04
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates unzip jq
            arch: x86_64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - image: docker.io/library/ubuntu@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
            distro: ubuntu-22.04
            setup: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates unzip jq
            arch: aarch64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    # A matrix job names its runner through `${ matrix.runner }`, which is
    # invisible to any check grepping for `self-hosted` - and these are the
    # longest-running jobs in the fleet, so the six-hour default ceiling was
    # in force exactly where it costs the most. `dev/guards/
    # test_ci_jobs_reach_a_verdict.py` resolves the matrix and holds this.
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install what acquisition itself needs
        env:
          SETUP: ${{ matrix.setup }}
        run: |
          set -eux
          sh -c "${SETUP}"

      - name: Acquire the published binaries
        env:
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TRIPLE: ${{ matrix.triple }}
          ARCHIVE_SUFFIX: ${{ endsWith(matrix.triple, '-windows-msvc') && '.zip' || '.tar.gz' }}
          EXECUTABLE_SUFFIX: ${{ endsWith(matrix.triple, '-windows-msvc') && '.exe' || '' }}
        run: |
          set -eux
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "${tag}" ]; then
            tag=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" \
                  | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
          fi
          [ -n "${tag}" ] || { echo "::error::could not resolve a release tag"; exit 1; }
          printf '%s\n' "${tag}" \
            | grep -Eqx 'vaultspec-rag-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?' \
            || { echo "::error::refusing unexpected release tag: ${tag}"; exit 1; }
          echo "TAG=${tag}" >> "$GITHUB_ENV"

          mkdir -p /opt/acq
          release_url="https://github.com/${REPO}/releases/download/${tag}"
          archive="${tag}-${TRIPLE}${ARCHIVE_SUFFIX}"
          checksum_manifest=/opt/acq/SHA256SUMS
          archive_path="/opt/acq/${archive}"

          # The archive and its checksum manifest are the public release
          # contract. A raw target-qualified executable is a private build
          # intermediate and must never be accepted by acquisition.
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            -o "${checksum_manifest}" "${release_url}/SHA256SUMS"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            -o "${archive_path}" "${release_url}/${archive}"

          # SHA256SUMS also covers the wheel and sdist, so select exactly this
          # target archive before invoking sha256sum. Missing or duplicate
          # entries fail closed; extraction is never reached on a mismatch.
          checksum_line=$(awk -v archive="${archive}" \
            '($2 == archive || $2 == "*" archive) { print; count++ }
             END { if (count != 1) exit 1 }' "${checksum_manifest}")
          [ -n "${checksum_line}" ] || {
            echo "::error::SHA256SUMS has no unique entry for ${archive}"; exit 1;
          }
          printf '%s\n' "${checksum_line}" > "${archive_path}.sha256"
          (cd /opt/acq && sha256sum -c "${archive}.sha256")

          # A matching archive checksum proves integrity, but not which source
          # commit produced the bytes. Release-gated dispatches name the exact
          # producer SHA; bind that request to the manifest inside the archive.
          if [ -n "${TARGET_SHA:-}" ]; then
            case "${TARGET_SHA}" in
              *[!0-9a-f]*|'')
                echo "::error::target_sha is not a lowercase full commit ID"; exit 1 ;;
            esac
            [ "${#TARGET_SHA}" -eq 40 ] || {
              echo "::error::target_sha is not a 40-character commit ID"; exit 1;
            }
            case "${ARCHIVE_SUFFIX}" in
              .tar.gz) tar -xOzf "${archive_path}" manifest.json > /opt/acq/manifest.json ;;
              .zip) unzip -p "${archive_path}" manifest.json > /opt/acq/manifest.json ;;
            esac
            producer_sha=$(jq -er '.source_revision | select(type == "string")' /opt/acq/manifest.json)
            [ "${producer_sha}" = "${TARGET_SHA}" ] || {
              echo "::error::bundle producer ${producer_sha} does not match requested ${TARGET_SHA}"; exit 1;
            }
          fi

      - name: Extract the stable executables
        env:
          TRIPLE: ${{ matrix.triple }}
          ARCHIVE_SUFFIX: ${{ endsWith(matrix.triple, '-windows-msvc') && '.zip' || '.tar.gz' }}
          EXECUTABLE_SUFFIX: ${{ endsWith(matrix.triple, '-windows-msvc') && '.exe' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          archive="/opt/acq/${TAG}-${TRIPLE}${ARCHIVE_SUFFIX}"
          destination=/opt/acq/extracted
          mkdir -p "${destination}"

          case "${ARCHIVE_SUFFIX}" in
            .tar.gz)
              members=$(tar -tzf "${archive}")
              for name in vaultspec-rag vaultspec-search-mcp; do
                member="${name}${EXECUTABLE_SUFFIX}"
                count=$(printf '%s\n' "${members}" | grep -Fxc -- "${member}" || true)
                [ "${count}" -eq 1 ] || {
                  echo "::error::bundle is missing exactly one ${member}"; exit 1;
                }
                tar -xOzf "${archive}" "${member}" > "${destination}/${member}"
                chmod +x "${destination}/${member}"
              done
              ;;
            .zip)
              members=$(unzip -Z1 "${archive}")
              for name in vaultspec-rag vaultspec-search-mcp; do
                member="${name}${EXECUTABLE_SUFFIX}"
                count=$(printf '%s\n' "${members}" | grep -Fxc -- "${member}" || true)
                [ "${count}" -eq 1 ] || {
                  echo "::error::bundle is missing exactly one ${member}"; exit 1;
                }
                unzip -p "${archive}" "${member}" > "${destination}/${member}"
                chmod +x "${destination}/${member}"
              done
              ;;
            *)
              echo "::error::unsupported bundle format: ${ARCHIVE_SUFFIX}"
              exit 1
              ;;
          esac

      - name: The loader must accept the extracted executables
        env:
          ARCHIVE_SUFFIX: ${{ endsWith(matrix.triple, '-windows-msvc') && '.zip' || '.tar.gz' }}
          EXECUTABLE_SUFFIX: ${{ endsWith(matrix.triple, '-windows-msvc') && '.exe' || '' }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -eu
          if [ "${ARCHIVE_SUFFIX}" = ".zip" ]; then
            echo "extracted Windows executables are present and executable"
            exit 0
          fi
          echo "distribution glibc: $(ldd --version | head -1)"

          failed=0
          for name in vaultspec-rag vaultspec-search-mcp; do
            binary="/opt/acq/extracted/${name}${EXECUTABLE_SUFFIX}"
            [ -x "${binary}" ] || {
              echo "::error::extracted executable is not runnable: ${binary}"; failed=1; continue;
            }

            # `ldd` resolves every symbol version the binary requires against
            # this distribution's libc and reports what it cannot satisfy. It
            # answers the loader question directly and in milliseconds, without
            # launching anything - which matters here, because launching would
            # start a multi-gigabyte bootstrap that has nothing to do with what
            # is being tested.
            if ! out=$(ldd "${binary}" 2>&1); then
              printf '::error::%s: ldd failed on %s\n%s\n' "${name}" "${IMAGE}" "${out}"
              failed=1
              continue
            fi
            if printf '%s' "${out}" | grep -q 'not found'; then
              printf '::error::%s does not load on %s. Unsatisfied by this distribution:\n%s\n' \
                "${name}" "${IMAGE}" "$(printf '%s' "${out}" | grep 'not found')"
              printf '::error::This is vaultspec-rag#409 recurring: the artifact was built against a newer libc than the floor it claims. Check the container pin for this target in binaries.yml.\n'
              failed=1
              continue
            fi
            echo "ok: ${name} resolves every required symbol version here"
          done
          [ "${failed}" -eq 0 ] || exit 1

      - name: Return the workspace to the runner's user
        if: always()
        run: chown -R --reference=/__w "$GITHUB_WORKSPACE" || true
