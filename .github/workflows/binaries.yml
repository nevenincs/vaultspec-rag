name: Binaries

# BUILDS ON A TAG, not only on dispatch.
#
# This is the fault that cost THIS repo its release matrix tonight.
# vaultspec-rag-v0.4.12 was cut and became `latest` carrying the wheel, the
# sdist and SHA256SUMS - and not one platform binary. rag went from 3/3 to 0/3.
# Cutting a release simply did not build them, and nobody was going to remember
# to dispatch it.
#
# The artifact-less-release guard did not catch it and could not: that guard
# lives in THIS workflow, and a workflow that never runs cannot demote anything.
# The guard had already merged. It was unreachable, not broken.
#
# vaultspec-dashboard has never had this problem because its release workflow
# runs on tag push. This brings rag to the same shape. Dispatch is kept for
# repairing a tag whose build failed - which is exactly how v0.4.12 was
# recovered.
on:
  push:
    tags:
      - "vaultspec-rag-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build binaries for (e.g. vaultspec-rag-v0.4.6)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: binaries-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Refuse a build whose runners cannot serve it.
  #
  # A selector with no ONLINE runner does not fail - it QUEUES, unbounded by
  # timeout-minutes, and this workflow sets no timeouts at all. v0.4.9 hung
  # exactly that way: two legs green, the third queued, cancelled by hand.
  #
  # Both selectors this matrix requires are served from the workstation today,
  # so on main this is a cheap assertion rather than a live catch. It earns its
  # place at the moment the linux-aarch64 leg returns - that runner lives on the
  # power-gated MacBook, and re-enabling the leg without this reconstructs the
  # v0.4.9 hang precisely, behind a release job that needs the whole matrix.
  #
  # The gate is not the problem and this does not fight it. Stopping runners on
  # battery is correct; spending a day discovering it is not.
  #
  # Hosted, deliberately - a preflight that needs the fleet cannot report that
  # the fleet is down.
  preflight:
    name: Preflight runners
    runs-on: ubuntu-latest
    steps:
      - name: Every matrix selector has an online runner
        shell: bash
        env:
          # A PAT with `administration: read` if configured; the default token
          # otherwise. The default GITHUB_TOKEN CANNOT read `actions/runners` -
          # that endpoint needs admin - so without the PAT this check is blind
          # and says so rather than guessing.
          GH_TOKEN: ${{ secrets.FLEET_PREFLIGHT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # NOT `set -e`. An unobservable preflight must not refuse a build: the
          # `gh api` below returns 403 under the default GITHUB_TOKEN, and under
          # `set -e` that aborts the step and skips everything downstream. It
          # blocked vaultspec-dashboard v0.1.6 exactly that way. A check that
          # cannot tell "no runner" from "cannot see runners" must not speak for
          # the first.
          set -uo pipefail
          if ! runners=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" --jq '.runners[] | [.status, ([.labels[].name] | map(ascii_downcase) | join(","))] | @tsv' 2>&1); then
            echo "::warning::preflight cannot read the runner list: ${runners}"
            echo "::warning::The default GITHUB_TOKEN cannot read actions/runners. Set FLEET_PREFLIGHT_TOKEN to a PAT with administration:read to enable this check."
            echo "::warning::SKIPPING - unobservable is not the same as unserviceable."
            exit 0
          fi
          [ -n "${runners}" ] || { echo "::error::no self-hosted runners are registered"; exit 1; }

          # Kept in step with binaries.yml's matrix. Add the aarch64 selector
          # here in the same change that re-enables that leg.
          selectors=(
            "self-hosted,linux,x64,build"
            "self-hosted,windows,x64"
          )

          failed=0
          for want in "${selectors[@]}"; do
            online=0; registered=0
            while IFS=$'	' read -r status labels; do
              missing=0
              IFS=',' read -ra parts <<< "${want}"
              for part in "${parts[@]}"; do
                case ",${labels}," in *",${part},"*) ;; *) missing=1; break ;; esac
              done
              [ "${missing}" -eq 0 ] || continue
              registered=$((registered + 1))
              [ "${status}" = "online" ] && online=$((online + 1))
            done <<< "${runners}"

            if [ "${online}" -gt 0 ]; then
              echo "ok        [${want}] -> ${online} online"
            elif [ "${registered}" -eq 0 ]; then
              echo "::error::[${want}] is carried by no registered runner." >&2
              failed=1
            else
              echo "::error::[${want}] matches ${registered} runner(s), none online - usually the power-gated host on battery. Dispatch again on AC." >&2
              failed=1
            fi
          done

          [ "${failed}" -eq 0 ] || { echo "::error::preflight refused a build that would queue rather than run" >&2; exit 1; }

  build:
    needs: preflight
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # BUILT IN A PINNED IMAGE, not on the runner. A Linux binary's
          # minimum glibc is whatever its build machine happens to offer, and
          # this leg inherited the runner's - vaultspec-rag#409 measured the
          # published v0.4.11 artifacts at GLIBC_2.39, which is Ubuntu 24.04 and
          # newer. They do not start on Debian 12, Ubuntu 22.04, RHEL 9 or
          # Amazon Linux 2023, while the docs promise "Linux".
          #
          # Pinned by DIGEST: this image is downloaded and executed, so a
          # mutable tag is not an acceptable input. Same image and digest
          # vaultspec-core uses, so the two products share one baseline rather
          # than each discovering their own.
          - name: linux-x86_64
            runner: [self-hosted, Linux, X64, build]
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
          - name: windows-x86_64
            runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
            container: ""
          # Restored. It was dropped because no leg could be scheduled while
          # the host stood its runners down on battery, on the explicit
          # condition that it return once that stopped being true. The host is
          # on AC, `macbook-neo-linux-arm-rag` is online, and its container is
          # enrolled in both of the host's fleet scripts - runner-powergate.sh
          # and runner-deploy-hooks.sh - so the condition is met.
          #
          # The accelerated torch pin already covers this target: the cu130
          # index publishes a manylinux_2_28_aarch64 wheel, which
          # tools/binaries/torch_channel.py resolves like any other.
          # NO CONTAINER HERE, and the reason is the host, not the image.
          #
          # `macbook-neo-linux-arm-rag` IS ITSELF a colima container on the
          # MacBook. It has no reachable docker daemon, so a nested container
          # cannot start - the leg dies in `Initialize containers` with
          # `Value cannot be null. (Parameter 'network')`. vaultspec-core hit
          # exactly this and excluded its own linux-aarch64 leg over it; I added
          # the pin here without checking whether this runner could host one,
          # and v0.4.15 proved it cannot.
          #
          # So this target builds natively and inherits the colima guest's
          # glibc, which is 2.39. That is DECLARED in GLIBC_FLOOR below rather
          # than promised as plain "Linux" - an accurately stated narrow target
          # is conformant; a silently narrow one is what vaultspec-rag#409 is
          # about.
          #
          # The honest fix is an ARM64 Linux host that can run containers, at
          # which point this gets the same pinned manylinux_2_28_aarch64 image
          # as x86_64 and the floor below drops to 2.28 with it. Until then,
          # dropping the target entirely would remove a platform this product
          # currently ships to, which is the worse trade.
          - name: linux-aarch64
            runner: [self-hosted, Linux, ARM64]
            target: aarch64-unknown-linux-gnu
            container: ""
          # NO macOS LEGS, deliberately. vaultspec-rag is CUDA-only:
          # embeddings.py, search/_searcher.py and server/_lifespan.py each
          # raise RuntimeError when torch.cuda.is_available() is false, and
          # there is no CUDA build for macOS at any version. Building macOS
          # binaries would publish assets that install cleanly and raise on
          # first use, which reads as a product defect rather than as an
          # unsupported platform. tools/packaging refuses to offer them too:
          # the product's supported_targets excludes darwin, so the Homebrew
          # formula covers Linux only.
          # DELIVERY GAP for Linux ARM64, deliberately unschedulable rather
          # than silently absent. Homebrew supports the platform, so the
          # missing aarch64-unknown-linux-gnu build is one the formula cannot
          # offer an install on at all. The generator prints a `::warning::`
          # naming the gap on every release, and omits the platform from the
          # formula rather than pinning an asset that was never built.
          #
          # It was enabled once, on `macbook-neo-linux-arm-rag`, and the build
          # itself is fine - it produced working aarch64 binaries for v0.4.8.
          # What is not fine is what carries it: that runner is a container on
          # a laptop, and the host's powergate stops it on battery. It went
          # offline between one release and the next, and because `release`
          # needs the whole matrix and a label no ONLINE runner carries QUEUES
          # rather than fails, v0.4.9 hung with the other two legs green and
          # had to be cancelled by hand. A job that is queued rather than
          # running is not bounded by `timeout-minutes`, so nothing in the
          # workflow rescues it.
          #
          # Re-enable by uncommenting the three lines below - but only once
          # this label is served by a runner that does not sleep. A release
          # gated on a laptop is a release that stops whenever the lid closes,
          # which is worse than the gap this closes.
          # - name: linux-aarch64
          #   runner: [self-hosted, Linux, ARM64]
          #   target: aarch64-unknown-linux-gnu
    # Artifact builds run on the shared self-hosted fleet (hosted multiplatform
    # runners are cost-prohibitive); see publish.yml for the same constraint.
    runs-on: ${{ matrix.runner }}
    # Empty for the Windows leg, which GitHub reads as "no container".
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Build binaries
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          uv run --no-project --python 3.13 -- \
            python -m tools.binaries.build_pyapp --tag "${TAG}" --target "${TARGET}" --outdir dist-bin

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error
          retention-days: 5

      # A containerised leg runs as root, and its workspace is the SAME
      # directory this runner reuses for every other job on the machine. Left
      # alone it hands the next job a tree it has no permission to clean, and
      # that job dies in `Checkout` on `failed to remove
      # dist-bin/vaultspec-rag-x86_64-unknown-linux-gnu: Permission denied` -
      # which is how every job on this runner went red after the Linux leg was
      # first put in a pinned image.
      #
      # `/__w` is created by the runner and keeps the runner's ownership, so it
      # is the reference for what the tree should look like on the way out.
      # Runs on failure too: a leg that dies mid-build poisons the tree just as
      # thoroughly as one that succeeds.
      - name: Return the workspace to the runner's user
        if: ${{ always() && matrix.container != '' }}
        run: chown -R --reference=/__w "$GITHUB_WORKSPACE"

  release:
    name: Attach to release
    needs: build
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: write
    steps:
      # This repo, for the generator itself. No deploy key and no push: the
      # channel pointers no longer live here.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      # The ORG-WIDE distribution repository. Scoop manifests and Homebrew
      # formulae belong to the account rather than to each product, so a user
      # taps or bucket-adds ONCE, ever - not once per product. Publishing into
      # this repo instead multiplied that one-time step by the number of
      # products and committed to a public product repo's default branch on
      # every release.
      #
      # vaultspec-core retargets identically; the two products now share this
      # branch, which is what makes the per-product staging below load-bearing
      # rather than tidy.
      - name: Checkout the distribution repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ref: main
          path: channels
          ssh-key: ${{ secrets.CHANNEL_ROOT_DEPLOY_KEY }}

      # The channel generator runs in this job, so it needs an interpreter
      # here too; previously only the build matrix installed one.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist-bin/
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        env:
          # Needed by the merge below. Without them `gh release download` fails
          # and the merge silently no-ops - which looks exactly like success and
          # leaves the manifest incomplete again.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd dist-bin
          # Per-asset .sha256 files are produced by build_pyapp.py; fold them
          # into one sha256sum-compatible manifest and drop the fragments.
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          # MERGE into whatever the release already carries rather than
          # replacing it. binaries.yml and publish.yml both publish a file named
          # SHA256SUMS to the same release with --clobber, and neither knows
          # which ran first. On v0.4.11 the binaries run landed last and the
          # published manifest ended up describing only the six binaries - the
          # wheel and the sdist were attached with no digest anyone could check
          # them against, which is precisely the verifiability the manifest
          # exists to provide.
          #
          # Entries for the files THIS run is publishing are dropped from the
          # inherited copy before appending, so a re-run replaces its own lines
          # instead of duplicating them.
          if gh release download "${TAG}" --repo "$GITHUB_REPOSITORY"                --pattern SHA256SUMS --output inherited.txt 2>/dev/null; then
            while read -r _digest name; do
              [ -n "${name}" ] || continue
              grep -v -- "  ${name}$" inherited.txt > inherited.tmp || true
              mv inherited.tmp inherited.txt
            done < SHA256SUMS
            cat inherited.txt >> SHA256SUMS
            rm -f inherited.txt
            LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          fi
          {
            echo "### Binary checksums"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "${TAG}" dist-bin/* --clobber

      # Regenerate BOTH release-channel pointers from the SHA256SUMS just
      # built, then commit them. A Scoop manifest and a Homebrew formula are
      # pointers a user's package manager acts on, so they are generated whole
      # by dev/packaging rather than edited in place here.
      #
      # This replaced an inline jq rewrite, and the reason is worth keeping:
      # that version looked digests up with awk and guarded the result with
      # `test -n "$A" && test -n "$B" && test -n "$C"`, which is INERT under
      # `set -e` - bash exempts every command in an && list except the one
      # after the final &&. When the Windows build leg emitted CRLF checksum
      # sidecars, the awk lookup matched nothing, the guard did not fire, and
      # vaultspec-core-v0.1.60 published a manifest with empty hashes out of
      # a green run - this repository adopts the fix rather than repeating it. The generator raises on a missing digest, refuses a
      # backward bump, and omits an unbuilt platform instead of inventing one.
      - name: Generate release channel pointers
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 --             python -m tools.packaging.generate               --tag "${TAG}"               --checksums dist-bin/SHA256SUMS               --root channels

      # Between generating the pointers and committing them, which is the
      # only point where a bad pointer can still be STOPPED rather than
      # reported after it has shipped. vaultspec-core published a manifest
      # with the right version, the right URLs and empty hashes out of a run
      # that was green end to end; this repository had no equivalent check.
      - name: Refuse an uninstallable channel pointer
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 -- python -m tools.packaging.validate --root channels

      - name: Commit the Scoop manifest and Homebrew formula
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd channels
          # Stage BEFORE asking whether anything changed. `git diff` reports
          # only tracked paths, so on the first release for a channel - when
          # the generator has just created bucket/*.json and Formula/*.rb and
          # nothing tracks them yet - it reports no change, and the step
          # announces "nothing to commit" and exits zero having published no
          # pointer at all. That is exactly what happened on v0.4.8: both
          # files were written, neither was committed, and the job went green.
          # Comparing the index against HEAD sees an added path as a change.
          # Only THIS product's two files. The distribution repo serves every
          # product under the account, so a repo-wide `git add` would sweep up a
          # sibling's pointer if two releases raced and publish it under this
          # tag's message.
          git add -- bucket/vaultspec-rag.json Formula/vaultspec-rag.rb
          if git diff --cached --quiet -- bucket Formula; then
            echo "channels already at ${TAG}; nothing to commit"
            exit 0
          fi
          # The identity is passed to this one commit rather than written
          # with `git config`. This runner is self-hosted and its checkout is
          # reused by every later job on the box, so a persisted user.email
          # outlives the run: the citation gate derives its machine-identity
          # tokens from `git config user.email`, so the bot address became a
          # token and then matched its own literal in these workflow files,
          # failing the unit lane on main for work that never touched it.
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(release): point scoop and homebrew at ${TAG}"
          # This job runs after a long matrix build, so main may have advanced
          # meanwhile. Rebase-and-retry (bounded) so an unrelated commit does not
          # fail the push non-fast-forward; the backward-bump guard in the
          # generator still protects against clobbering a newer pointer.
          attempt=1
          max_attempts=3
          until git push origin main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::channel pointer push failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "push rejected (attempt ${attempt}/${max_attempts}); rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
          done

  # A release with no artifacts must not serve as `latest`.
  #
  # vaultspec-rag-v0.4.11 was published by release-please, Binaries had not been
  # dispatched for it, and the empty release immediately became `latest` - which
  # is where the README badges, docs/installation.md and the channel manifests
  # all point. Nothing went red, because nothing was watching.
  # vaultspec-core-v0.1.61 did the same an hour earlier.
  #
  # vaultspec-dashboard has carried this guard since its v0.1.4 spent six weeks
  # answering as `latest` with zero assets. vaultspec-core adopts it in #355;
  # this is the same job, so all three repos fail the same way for the same
  # reason instead of each discovering it separately.
  #
  # Demotion is reversible and lossless: a prerelease keeps the tag, the notes
  # and the URL reachable, and only stops that release answering as `latest`.
  verify-release-assets:
    name: Verify the release carries artifacts
    needs: release
    if: ${{ always() }}
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_RESULT: ${{ needs.release.result }}
    steps:
      - name: Require artifacts on the published release
        shell: bash
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          assets=$(printf '%s' "${names}" | grep -c . || true)
          echo "release ${TAG} carries ${assets} asset(s); release job=${RELEASE_RESULT}"

          # EVERY DECLARED TARGET, not "any asset at all". v0.4.15 is why.
          #
          # Its aarch64 leg failed, so `Attach to release` was skipped and no
          # binary reached the release - but `Publish` had already attached the
          # wheel, the sdist and SHA256SUMS on the tag. The old check asked only
          # whether the asset count was above zero, saw three, and passed. A
          # release carrying no binaries at all served as `latest`, and the guard
          # that exists to prevent exactly that reported success.
          #
          # The per-target assert cannot cover this: it lives in the `release`
          # job, which is the job that does not run when a build leg fails.
          #
          # Targets are DERIVED from the matrix in this same file rather than
          # listed again - a second list drifts, and this repo has paid for that.
          workflow=".github/workflows/binaries.yml"
          mapfile -t expected < <(awk '/^[[:space:]]+target:[[:space:]]/ {print $2}' "${workflow}" | sort -u)
          if [ ${#expected[@]} -eq 0 ]; then
            echo "::error::could not derive any target from ${workflow}; refusing to pass vacuously"
            exit 1
          fi

          missing=()
          for triple in "${expected[@]}"; do
            printf '%s' "${names}" | grep -q -- "${triple}" || missing+=("${triple}")
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "all ${#expected[@]} declared target(s) present on ${TAG}"
            exit 0
          fi

          echo "::warning::${TAG} is missing: ${missing[*]}"

          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --json isPrerelease --jq '.isPrerelease')" != "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            echo "::notice::demoted ${TAG} to a prerelease so latest skips it"
          fi

          echo "::error::${TAG} is INCOMPLETE - missing ${missing[*]} (release job=${RELEASE_RESULT}). It has been demoted to a prerelease so it cannot serve as latest. Fix the build and re-dispatch this workflow for this tag; the next step promotes it back once every declared target attaches."
          exit 1

      # Undo an earlier demotion once a re-dispatch actually attaches something,
      # or a repaired release stays invisible to `latest` forever. The tag name
      # decides: release-please publishes full releases here, so anything
      # carrying a prerelease marker was meant to be one and must not be
      # promoted by a guard that only knows about assets.
      - name: Promote a repaired release back to latest
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          case "${TAG}" in
            *-rc*|*-alpha*|*-beta*|*-dev*)
              echo "${TAG} names a prerelease; leaving its flag alone"
              exit 0
              ;;
          esac
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --json isPrerelease --jq '.isPrerelease')" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false
            echo "::notice::promoted ${TAG} back to a full release"
          fi
