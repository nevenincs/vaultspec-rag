name: RAG Binaries

# WHAT STARTS THIS WORKFLOW: Publish dispatches it only after the GitHub
# wheel/sdist publication has succeeded. Keeping this workflow dispatch-only
# makes that ordering enforceable: independent tag triggers can be serialized,
# but serialization alone cannot say which workflow runs first. A maintainer
# may still dispatch it explicitly to repair a release; the final gate below
# independently proves the package and bundle set before promotion.
#
# WHAT THIS WORKFLOW STARTS: PyPI publication. Only a release this workflow has
# promoted is handed to Publish's package-index stage, because an upload to
# the index cannot be withdrawn and a promotion can.
#
# The failure worth remembering: vaultspec-rag-v0.4.12 was cut and became
# `latest` carrying the wheel, the sdist and SHA256SUMS - and not one platform
# binary. rag went from 3/3 to 0/3. The artifact-less-release guard did not
# catch it and could not: that guard lives in THIS workflow, and a workflow
# that never runs cannot demote anything. It was unreachable, not broken.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build binaries for (e.g. vaultspec-rag-v0.4.6)"
        required: true
        type: string
      target_sha:
        description: "Immutable release commit to build and publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Shared with publish.yml. Both workflows merge and rewrite the same
  # SHA256SUMS release asset, so a per-workflow lock would still permit a lost
  # update when they run for one tag at the same time.
  group: release-artifacts-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Both inputs are free text from anyone who can dispatch, and every later job
  # but one runs on the self-hosted fleet. So they are proven HERE, on a hosted
  # runner, before anything is checked out: the tag must be a release tag, and
  # it must resolve on the public remote to exactly the commit requested.
  validate:
    name: "Check: Release request (Linux)"
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Require a release tag that resolves to the requested commit
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^vaultspec-rag-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: ${TAG}"
            exit 1
          fi
          if ! [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha is not a full lowercase commit ID"
            exit 1
          fi
          refs=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "${TAG}")
          sha=$(awk -v ref="refs/tags/${TAG}" '$2 == ref "^{}" { print $1; exit }' <<<"${refs}")
          [ -n "${sha}" ] || sha=$(awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1; exit }' <<<"${refs}")
          if [ -z "${sha}" ]; then
            echo "::error::release tag ${TAG} does not exist"
            exit 1
          fi
          if [ "${sha}" != "${TARGET_SHA}" ]; then
            echo "::error::${TAG} resolves to ${sha}, not the requested ${TARGET_SHA}"
            exit 1
          fi
          echo "${TAG} resolves to ${TARGET_SHA}"

  # Build the project wheel once from the release tag. The binary matrix consumes
  # this artifact rather than resolving the version from PyPI, so a release tag
  # can be built and validated before either publication workflow wins a race to
  # the package index.
  # The selectors are DERIVED from the build matrix below, never listed again.
  # A second list drifts, and this repository has already paid for that: the
  # release-asset check carries the same note for the same reason. Reading the
  # workflow at the release commit also means the check describes the matrix
  # that run will actually schedule, not the one on the default branch.
  derive-selectors:
    name: "Check: Runner selectors (Linux)"
    needs: validate
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64, build]
    outputs:
      selectors: ${{ steps.derive.outputs.selectors }}
    steps:
      # Its OWN directory. A sparse checkout at the workspace root leaves
      # core.sparseCheckout set in the shared clone every later job on this
      # runner then reads, which took a sibling project's Linux runner down for
      # fifteen hours.
      - name: Checkout the workflow this run will schedule
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}
          path: .sparse-derive-selectors
          sparse-checkout: .github/workflows
          sparse-checkout-cone-mode: false

      - name: Derive every selector the build matrix names
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          workflow=".sparse-derive-selectors/.github/workflows/binaries.yml"
          [ -f "${workflow}" ] || { echo "::error::${workflow} not checked out; cannot derive selectors"; exit 1; }
          selectors=$(awk '
            /^[[:space:]]+runner:[[:space:]]/ {
              sub(/^[[:space:]]+runner:[[:space:]]*/, "")
              gsub(/[][]/, "")
              gsub(/[[:space:]]+/, "")
              print
            }' "${workflow}" | sort -u)
          if [ -z "${selectors}" ]; then
            echo "::error::derived no selector from ${workflow}; refusing to pass vacuously"
            exit 1
          fi
          {
            echo "selectors<<SELECTORS_EOF"
            echo "${selectors}"
            echo "SELECTORS_EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "deriving from ${workflow}:"
          echo "${selectors}"

  # The job around the generated block is this repository's to shape: the fleet
  # parity check compares only the BEGIN/END body, so the name follows the
  # convention here and the ceiling is stated rather than defaulting to six
  # hours on a shared runner.
  preflight:
    name: "Check: Runner availability (Linux)"
    needs: derive-selectors
    timeout-minutes: 15
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Every required selector has an online runner
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FLEET_PREFLIGHT_TOKEN }}
          TARGET_REPO: ${{ github.event.repository.name }}
          SELECTORS: ${{ needs.derive-selectors.outputs.selectors }}
          ALLOW_GATED: false
        run: |
          # BEGIN generated runner preflight - do not edit here
          # THE canonical runner preflight. One implementation for the whole fleet.
          #
          # WHY THIS IS A SCRIPT AND NOT A REUSABLE WORKFLOW. It was one, and every
          # consumer's call was rejected before a single job started: its source
          # repository is PRIVATE and all six consuming repos are PUBLIC, and a public repository
          # cannot call a reusable workflow from a private one. GitHub reports that as a
          # run with zero jobs and "this run likely failed because of a workflow file
          # issue", which is why it survived actionlint, survived review, and would have
          # surfaced first on a release.
          #
          # So the sharing model is DEPLOYMENT, not runtime resolution: this file is the
          # source, it is rendered into each consumer's workflow, and a parity check
          # fails when a rendered copy drifts from it.
          #
          # Contract - the caller sets these, all required:
          #   GH_TOKEN     PAT with Administration:read. NEVER the default GITHUB_TOKEN:
          #                it cannot read actions/runners at any `permissions:` value.
          #   TARGET_REPO  repository name, without the owner
          #   SELECTORS    newline-separated, each a comma-joined label set
          #   ALLOW_GATED  "true" tolerates registered-but-offline runners

          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::fleet_token is empty. This check needs a PAT with Administration:read; GITHUB_TOKEN cannot read actions/runners." >&2
            exit 1
          fi

          # GitHub-HOSTED runners are not in `actions/runners`, which lists only
          # self-hosted ones. A hosted label is therefore indistinguishable from
          # a self-hosted label nobody registered, so checking one would fail
          # every run for a runner that is always available. Two legs on this
          # fleet are hosted BY DECISION - the aarch64 Linux builds, because the
          # ARM machine cannot host a `container:` job - and this check must not
          # contradict that decision.
          #
          # The prefixes are GitHub's hosted-image vocabulary, not ours, and a
          # hosted image label always carries a version or channel suffix
          # (`ubuntu-latest`, `ubuntu-24.04-arm`, `windows-2022`, `macos-15`).
          # Fleet labels carry no such suffix and are checked normally. Never
          # name a fleet label `windows-<something>`: it would be skipped here
          # and go unchecked.
          checkable=""
          while IFS= read -r selector; do
            [ -n "${selector}" ] || continue
            case "${selector}" in
              ubuntu-*|windows-*|macos-*)
                echo "hosted    [${selector}] -> GitHub-hosted, not in the self-hosted list; not checked"
                ;;
              *) checkable+="${selector}"$'\n' ;;
            esac
          done <<< "${SELECTORS}"

          if [ -z "${checkable}" ]; then
            echo "every selector is GitHub-hosted; nothing to check against the fleet."
            exit 0
          fi

          runners=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${TARGET_REPO}/actions/runners" \
            --jq '.runners[] | [.status, ([.labels[].name] | map(ascii_downcase) | join(","))] | @tsv')

          if [ -z "${runners}" ]; then
            echo "::error::${TARGET_REPO} has no registered self-hosted runners at all" >&2
            exit 1
          fi

          failed=0
          while IFS= read -r selector; do
            [ -n "${selector}" ] || continue
            # Normalise: lowercase, strip spaces. GitHub matches labels
            # case-insensitively, and a selector written `Linux` must match a
            # runner advertising `linux`.
            want=$(printf '%s' "${selector}" | tr '[:upper:]' '[:lower:]' | tr -d ' ')

            online=0; registered=0
            while IFS=$'\t' read -r status labels; do
              missing=0
              IFS=',' read -ra parts <<< "${want}"
              for part in "${parts[@]}"; do
                case ",${labels}," in
                  *",${part},"*) ;;
                  *) missing=1; break ;;
                esac
              done
              [ "${missing}" -eq 0 ] || continue
              registered=$((registered + 1))
              [ "${status}" = "online" ] && online=$((online + 1))
            done <<< "${runners}"

            if [ "${online}" -gt 0 ]; then
              echo "ok        [${want}] -> ${online} online"
            elif [ "${registered}" -eq 0 ]; then
              echo "::error::[${want}] is carried by NO registered runner. A job dispatched to it queues until GitHub cancels it." >&2
              failed=1
            elif [ "${ALLOW_GATED}" = "true" ]; then
              echo "::warning::[${want}] matches ${registered} runner(s), all offline. Continuing because allow_gated is set."
            else
              echo "::error::[${want}] matches ${registered} registered runner(s) but NONE are online. On this fleet that usually means the power-gated host is on battery; a job dispatched now would queue rather than fail." >&2
              failed=1
            fi
          done <<< "${checkable}"

          if [ "${failed}" -ne 0 ]; then
            echo "::error::preflight refused to start work that cannot be scheduled" >&2
            exit 1
          fi
          echo "preflight passed: every required selector has an online runner"
          # END generated runner preflight

  wheel:
    needs: [validate, preflight]
    timeout-minutes: 30
    name: "Build: Binary wheel (Linux)"
    runs-on: [self-hosted, Linux, X64, build]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install 3.13

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Validate the wheel matches the release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 -- python -c \
            "import os; from pathlib import Path; from tools.binaries.build_pyapp import sole_wheel, validate_project_wheel, version_from_tag; wheel = validate_project_wheel(sole_wheel(Path('dist')), version_from_tag(os.environ['TAG'])); print(f'validated {wheel}')"

      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-wheel-${{ inputs.target_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 5

  build:
    needs: wheel
    name: "Build: Standalone binaries (${{ matrix.name }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          # BUILT IN A PINNED IMAGE, not on the runner. A Linux binary's
          # minimum glibc is whatever its build machine happens to offer, and
          # this leg inherited the runner's - vaultspec-rag#409 measured the
          # published v0.4.11 artifacts at GLIBC_2.39, which is Ubuntu 24.04 and
          # newer. They do not start on Debian 12, Ubuntu 22.04, RHEL 9 or
          # Amazon Linux 2023, while the docs promise "Linux".
          #
          # Pinned by DIGEST: this image is downloaded and executed, so a
          # mutable tag is not an acceptable input. Same image and digest
          # vaultspec-core uses, so the two products share one baseline rather
          # than each discovering their own.
          #
          # ON THE FLEET, AND WITHOUT A JOB CONTAINER. Every leg builds
          # natively on a runner this project owns. No fleet host exposes a
          # container runtime - the x86_64 Linux host has neither docker nor
          # podman, and the ARM64 runner is itself a container with no socket
          # mounted - so a `container:` here would die in `Initialize
          # containers` before checkout, which is how v0.4.15 published no
          # Linux binary at all.
          #
          # The consequence is that a Linux binary's floor is its build host's
          # libc rather than a pinned image's, and GLIBC_FLOOR in
          # `tools/binaries/build_pyapp.py` records what that is. Raising the
          # floor is a support decision, not a build detail: it is asserted
          # against the produced artifact and checked again by the acquisition
          # lane's oldest distro image.
          - name: linux-x86_64
            runner: [self-hosted, Linux, X64, build]
            target: x86_64-unknown-linux-gnu
            container: ""
          - name: windows-x86_64
            runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
            container: ""
          - name: linux-aarch64
            runner: [self-hosted, Linux, ARM64]
            target: aarch64-unknown-linux-gnu
            container: ""
          # Apple silicon is a supported accelerator, not an absent one: the
          # MPS backend carries the dense, sparse and reranker models, and the
          # hardware tiers gate every release on an MPS acceptance guard that
          # fails if any operation falls back to CPU. This leg needs no
          # container - a macOS binary's floor is its SDK, not glibc - and no
          # torch pin either, because the wheel default PyPI publishes for
          # darwin is the one carrying MPS.
          - name: macos-arm64
            runner: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            container: ""
    # Artifact builds run only for release events and explicit release repair.
    # A matrix job names its runner through `${ matrix.runner }`, which is
    # invisible to any check grepping for `self-hosted` - and these are the
    # longest-running jobs in the fleet, so the six-hour default ceiling was
    # in force exactly where it costs the most. `dev/guards/
    # test_ci_jobs_reach_a_verdict.py` resolves the matrix and holds this.
    timeout-minutes: 90
    runs-on: ${{ matrix.runner }}
    # Empty for the Windows leg, which GitHub reads as "no container".
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-10
        with:
          targets: ${{ matrix.target }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install 3.13

      - name: Download the wheel the binaries carry
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-wheel-${{ inputs.target_sha }}
          path: dist

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      # The recipe, not a second copy of its body. `just release-binaries`
      # already ran exactly this command under exactly this bare `--no-project`
      # interpreter so a maintainer reproducing a release build runs what CI
      # runs; this file was the reason that property was worth having, and the
      # one place that did not use it.
      - name: Build binaries
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: just release-binaries "${TAG}" "${TARGET}" dist-bin dist

      - name: Package and verify the release bundle
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: just release-bundle "${TAG}" "${TARGET}" dist-bin dist-bundles

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ inputs.target_sha }}-${{ matrix.name }}
          path: dist-bundles/
          if-no-files-found: error
          retention-days: 5

      # A containerised leg runs as root, and its workspace is the SAME
      # directory this runner reuses for every other job on the machine. Left
      # alone it hands the next job a tree it has no permission to clean, and
      # that job dies in `Checkout` on `failed to remove
      # dist-bin/vaultspec-rag-x86_64-unknown-linux-gnu: Permission denied` -
      # which is how every job on this runner went red after the Linux leg was
      # first put in a pinned image.
      #
      # `/__w` is created by the runner and keeps the runner's ownership, so it
      # is the reference for what the tree should look like on the way out.
      # Runs on failure too: a leg that dies mid-build poisons the tree just as
      # thoroughly as one that succeeds.
      - name: Return the workspace to the runner's user
        if: ${{ always() && matrix.container != '' }}
        run: chown -R --reference=/__w "$GITHUB_WORKSPACE"

  release:
    timeout-minutes: 30
    name: "Build: Release attachment (Linux)"
    needs: build
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: write
    steps:
      # This repo, for the generator itself. No deploy key and no push: the
      # channel pointers no longer live here.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      # The ORG-WIDE distribution repository. Scoop manifests and Homebrew
      # formulae belong to the account rather than to each product, so a user
      # taps or bucket-adds ONCE, ever - not once per product. Publishing into
      # this repo instead multiplied that one-time step by the number of
      # products and committed to a public product repo's default branch on
      # every release.
      #
      # vaultspec-core retargets identically; the two products now share this
      # branch, which is what makes the per-product staging below load-bearing
      # rather than tidy.
      - name: Checkout the distribution repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2  # zizmor: ignore[artipacked] -- this job pushes the channel pointers with it
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ref: main
          path: channels
          ssh-key: ${{ secrets.CHANNEL_ROOT_DEPLOY_KEY }}

      # The channel generator runs in this job, so it needs an interpreter
      # here too; previously only the build matrix installed one.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install 3.13

      # `just release-channels` below runs in this job, and a job only has the
      # tools it installs itself: the build legs' installs live on other hosts.
      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-${{ inputs.target_sha }}-*
          path: dist-bundles/
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        env:
          # Needed by the merge below. Without them `gh release download` fails
          # and the merge silently no-ops - which looks exactly like success and
          # leaves the manifest incomplete again.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd dist-bundles
          # Per-bundle .sha256 files are produced by tools.packaging.bundles;
          # fold them into one sha256sum-compatible manifest and drop the
          # fragments. The bundle command already validated each archive before
          # this artifact was uploaded.
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          # Only public archives and the aggregate may cross the release edge.
          # Raw target-qualified executables remain private build intermediates.
          for asset in *; do
            [ "${asset}" = "SHA256SUMS" ] && continue
            case "${asset}" in
              *.zip|*.tar.gz) ;;
              *)
                echo "::error::unexpected non-archive release artifact: ${asset}"
                exit 1
                ;;
            esac
          done
          sha256sum -c SHA256SUMS
          # MERGE into whatever the release already carries rather than
          # replacing it. binaries.yml and publish.yml both publish a file named
          # SHA256SUMS to the same release with --clobber, and neither knows
          # which ran first. On v0.4.11 the binaries run landed last and the
          # published manifest ended up describing only the six binaries - the
          # wheel and the sdist were attached with no digest anyone could check
          # them against, which is precisely the verifiability the manifest
          # exists to provide.
          #
          # Entries for the files THIS run is publishing are dropped from the
          # inherited copy before appending, so a re-run replaces its own lines
          # instead of duplicating them.
          if gh release download "${TAG}" --repo "$GITHUB_REPOSITORY"                --pattern SHA256SUMS --output inherited.txt 2>/dev/null; then
            # A manifest written before names were bare lists `./name`. Read
            # every inherited name bare, or a re-run keeps the stale spelling
            # and the exact-coverage gate refuses an otherwise complete release.
            sed -i -E 's#^([0-9a-f]{64})  \./#\1  #' inherited.txt
            while read -r _digest name; do
              [ -n "${name}" ] || continue
              grep -v -- "  ${name}$" inherited.txt > inherited.tmp || true
              mv inherited.tmp inherited.txt
            done < SHA256SUMS
            cat inherited.txt >> SHA256SUMS
            rm -f inherited.txt
            LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          fi
          {
            echo "### Binary checksums"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The release mutation is last. Every declared target must have exactly
      # one correctly named public archive before this job can attach anything;
      # a successful matrix is not enough when an artifact upload is stale,
      # renamed, or accidentally points at the private raw directory.
      - name: Assert every declared target archive ready
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/binaries.yml
          [ -f "${workflow}" ] || { echo "::error::${workflow} not found; cannot derive targets"; exit 1; }
          mapfile -t expected < <(awk '/^[[:space:]]+target:[[:space:]]/ {print $2}' "${workflow}" | sort -u)
          if [ ${#expected[@]} -eq 0 ]; then
            echo "::error::could not derive any target from ${workflow}; refusing to pass vacuously"
            exit 1
          fi

          missing=()
          duplicates=()
          expected_names=()
          for triple in "${expected[@]}"; do
            suffix=.tar.gz
            [[ "${triple}" == *-windows-msvc ]] && suffix=.zip
            expected_name="${TAG}-${triple}${suffix}"
            expected_names+=("${expected_name}")
            [ -f "dist-bundles/${expected_name}" ] || missing+=("${expected_name}")
            matches=()
            for asset in "dist-bundles/${TAG}-${triple}.zip" "dist-bundles/${TAG}-${triple}.tar.gz"; do
              [ -f "${asset}" ] && matches+=("${asset}")
            done
            [ ${#matches[@]} -le 1 ] || duplicates+=("${triple} (${#matches[@]})")
          done

          raw=()
          unexpected=()
          for asset in dist-bundles/*; do
            [ -f "${asset}" ] || continue
            asset_name="${asset#dist-bundles/}"
            case "${asset_name}" in
              SHA256SUMS) ;;
              *.zip|*.tar.gz)
                allowed=0
                for expected_name in "${expected_names[@]}"; do
                  [ "${asset_name}" = "${expected_name}" ] && allowed=1 && break
                done
                [ "${allowed}" -eq 1 ] || unexpected+=("${asset_name}")
                ;;
              *) raw+=("${asset_name}") ;;
            esac
          done

          if [ ${#missing[@]} -ne 0 ] || [ ${#duplicates[@]} -ne 0 ] || [ ${#raw[@]} -ne 0 ] || [ ${#unexpected[@]} -ne 0 ]; then
            [ ${#missing[@]} -eq 0 ] || echo "::error::${TAG} is missing target archives: ${missing[*]}"
            [ ${#duplicates[@]} -eq 0 ] || echo "::error::${TAG} has duplicate target archives: ${duplicates[*]}"
            [ ${#raw[@]} -eq 0 ] || echo "::error::raw or unexpected files cannot be published: ${raw[*]}"
            [ ${#unexpected[@]} -eq 0 ] || echo "::error::unexpected public archives cannot be published: ${unexpected[*]}"
            echo "### Incomplete binary archive set" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "all ${#expected[@]} declared target archives are ready for ${TAG}"

      - name: Upload bundles to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "${TAG}" dist-bundles/* --clobber

      # Regenerate BOTH release-channel pointers from the SHA256SUMS just
      # built, then commit them. A Scoop manifest and a Homebrew formula are
      # pointers a user's package manager acts on, so they are generated whole
      # by dev/packaging rather than edited in place here.
      #
      # This replaced an inline jq rewrite, and the reason is worth keeping:
      # that version looked digests up with awk and guarded the result with
      # `test -n "$A" && test -n "$B" && test -n "$C"`, which is INERT under
      # `set -e` - bash exempts every command in an && list except the one
      # after the final &&. When the Windows build leg emitted CRLF checksum
      # sidecars, the awk lookup matched nothing, the guard did not fire, and
      # vaultspec-core-v0.1.60 published a manifest with empty hashes out of
      # a green run - this repository adopts the fix rather than repeating it. The generator raises on a missing digest, refuses a
      # backward bump, and omits an unbuilt platform instead of inventing one.
      # Generate AND validate, in one call, because they are one act: a
      # pointer that is generated but not validated is an uninstallable
      # release nobody has looked at. These were two steps here, so the first
      # could run without the second. `just release-channels` runs both, and
      # is what a maintainer reproducing a release runs too.
      #
      # Between generating the pointers and committing them is the only point
      # where a bad pointer can still be STOPPED rather than reported after it
      # has shipped. vaultspec-core published a manifest with the right
      # version, the right URLs and empty hashes out of a run that was green
      # end to end; this repository had no equivalent check.
      - name: Generate and validate the release channel pointers
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: just release-channels "${TAG}" channels dist-bundles/SHA256SUMS

      - name: Commit the Scoop manifest and Homebrew formula
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd channels
          # Stage BEFORE asking whether anything changed. `git diff` reports
          # only tracked paths, so on the first release for a channel - when
          # the generator has just created bucket/*.json and Formula/*.rb and
          # nothing tracks them yet - it reports no change, and the step
          # announces "nothing to commit" and exits zero having published no
          # pointer at all. That is exactly what happened on v0.4.8: both
          # files were written, neither was committed, and the job went green.
          # Comparing the index against HEAD sees an added path as a change.
          # Only THIS product's two files. The distribution repo serves every
          # product under the account, so a repo-wide `git add` would sweep up a
          # sibling's pointer if two releases raced and publish it under this
          # tag's message.
          git add -- bucket/vaultspec-rag.json Formula/vaultspec-rag.rb
          if git diff --cached --quiet -- bucket Formula; then
            echo "channels already at ${TAG}; nothing to commit"
            exit 0
          fi
          # The identity is passed to this one commit rather than written
          # with `git config`. This runner is self-hosted and its checkout is
          # reused by every later job on the box, so a persisted user.email
          # outlives the run: the citation gate derives its machine-identity
          # tokens from `git config user.email`, so the bot address became a
          # token and then matched its own literal in these workflow files,
          # failing the unit lane on main for work that never touched it.
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(release): point scoop and homebrew at ${TAG}"
          # This job runs after a long matrix build, so main may have advanced
          # meanwhile. Rebase-and-retry (bounded) so an unrelated commit does not
          # fail the push non-fast-forward; the backward-bump guard in the
          # generator still protects against clobbering a newer pointer.
          attempt=1
          max_attempts=3
          until git push origin main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::channel pointer push failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "push rejected (attempt ${attempt}/${max_attempts}); rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
          done

  # A release with no artifacts must not serve as `latest`.
  #
  # vaultspec-rag-v0.4.11 was published by release-please, Binaries had not been
  # dispatched for it, and the empty release immediately became `latest` - which
  # is where the README badges, docs/installation.md and the channel manifests
  # all point. Nothing went red, because nothing was watching.
  # vaultspec-core-v0.1.61 did the same an hour earlier.
  #
  # vaultspec-dashboard has carried this guard since its v0.1.4 spent six weeks
  # answering as `latest` with zero assets. vaultspec-core adopts it in #355;
  # this is the same job, so all three repos fail the same way for the same
  # reason instead of each discovering it separately.
  #
  # Demotion is reversible and lossless: a prerelease keeps the tag, the notes
  # and the URL reachable, and only stops that release answering as `latest`.
  verify-release-assets:
    timeout-minutes: 30
    name: "Check: Release proven (Linux)"
    needs: release
    if: ${{ always() }}
    # ON THE FLEET, and it shares the build's Linux/X64 runners, so it is only
    # scheduled once they are free. That cost is real and worth naming:
    # vaultspec-dashboard's v0.1.7 guard sat QUEUED for over an hour behind the
    # one Linux/X64 runner it shared with the build, while the empty release
    # went on serving as `latest`, and had to be demoted by hand. A congested
    # or down fleet delays this demotion rather than performing it.
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: write
      # Dispatching the acquisition check is a write to the Actions API.
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      TARGET_SHA: ${{ inputs.target_sha }}
      RELEASE_RESULT: ${{ needs.release.result }}
    steps:
      # #422 taught this job to read the matrix out of this file, but never
      # gave it the file. It has been finding one only because a self-hosted
      # job inherits the workspace the `release` job checked out on the same
      # runner - incidental, and due to stop working the moment the job lands
      # elsewhere or the runner's job-completion hygiene prunes that tree.
      #
      # The empty-derivation branch below meant the symptom would have been a
      # loud refusal rather than a vacuous pass, which is the right failure to
      # have - but it is still a failure, and inheriting a workspace is not a
      # thing to rely on. So the file is now checked out explicitly.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ inputs.target_sha }}
          path: .sparse-verify-release-assets
          sparse-checkout: .github/workflows
          sparse-checkout-cone-mode: false

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git -C .sparse-verify-release-assets rev-parse HEAD)" = "$TARGET_SHA"

      - name: Require artifacts on the published release
        shell: bash
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          assets=$(printf '%s' "${names}" | grep -c . || true)
          echo "release ${TAG} carries ${assets} asset(s); release job=${RELEASE_RESULT}"

          version="${TAG#vaultspec-rag-v}"
          wheel="vaultspec_rag-${version}-py3-none-any.whl"
          sdist="vaultspec_rag-${version}.tar.gz"
          package_missing=()
          [ "$(printf '%s\n' "${names}" | grep -Fxc "${wheel}" || true)" -eq 1 ] || package_missing+=("${wheel}")
          [ "$(printf '%s\n' "${names}" | grep -Fxc "${sdist}" || true)" -eq 1 ] || package_missing+=("${sdist}")
          [ "$(printf '%s\n' "${names}" | grep -Fxc SHA256SUMS || true)" -eq 1 ] || package_missing+=("SHA256SUMS")

          checksum_problems=()
          verify_dir=$(mktemp -d)
          trap 'rm -rf -- "${verify_dir}"' EXIT
          if [ ${#package_missing[@]} -eq 0 ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "${verify_dir}"
            if ! (cd "${verify_dir}" && sha256sum -c SHA256SUMS); then
              checksum_problems+=("SHA256SUMS verification failed")
            else
              release_names=$(printf '%s\n' "${names}" | grep -vFx SHA256SUMS | LC_ALL=C sort)
              manifest_names=$(awk '{sub(/^\*/, "", $2); print $2}' "${verify_dir}/SHA256SUMS" | LC_ALL=C sort)
              [ "${release_names}" = "${manifest_names}" ] || checksum_problems+=("SHA256SUMS does not cover exactly the published assets")
            fi
          fi

          # EVERY DECLARED TARGET, not "any asset at all". v0.4.15 is why.
          #
          # Its aarch64 leg failed, so the release attachment was skipped and no
          # binary reached the release - but `Publish` had already attached the
          # wheel, the sdist and SHA256SUMS on the tag. The old check asked only
          # whether the asset count was above zero, saw three, and passed. A
          # release carrying no binaries at all served as `latest`, and the guard
          # that exists to prevent exactly that reported success.
          #
          # The per-target assert cannot cover this: it lives in the `release`
          # job, which is the job that does not run when a build leg fails.
          #
          # Targets are DERIVED from the matrix in this same file rather than
          # listed again - a second list drifts, and this repo has paid for that.
          workflow=".sparse-verify-release-assets/.github/workflows/binaries.yml"
          [ -f "${workflow}" ] || { echo "::error::${workflow} not checked out; cannot derive targets"; exit 1; }
          mapfile -t expected < <(awk '/^[[:space:]]+target:[[:space:]]/ {print $2}' "${workflow}" | sort -u)
          if [ ${#expected[@]} -eq 0 ]; then
            echo "::error::could not derive any target from ${workflow}; refusing to pass vacuously"
            exit 1
          fi

          missing=()
          duplicates=()
          expected_names=()
          for triple in "${expected[@]}"; do
            suffix=.tar.gz
            [[ "${triple}" == *-windows-msvc ]] && suffix=.zip
            expected_name="${TAG}-${triple}${suffix}"
            expected_names+=("${expected_name}")
            matches=()
            while IFS= read -r asset; do
              [ -n "${asset}" ] || continue
              case "${asset}" in
                "${TAG}-${triple}".zip|"${TAG}-${triple}".tar.gz)
                  matches+=("${asset}")
                  ;;
              esac
            done <<< "${names}"
            [ ${#matches[@]} -le 1 ] || duplicates+=("${triple} (${#matches[@]})")
            found=0
            for asset in "${matches[@]}"; do
              [ "${asset}" = "${expected_name}" ] && found=1
            done
            [ "${found}" -eq 1 ] || missing+=("${expected_name}")
          done

          bundle_archives=()
          raw=()
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            case "${asset}" in
              vaultspec-rag-v*.zip|vaultspec-rag-v*.tar.gz)
                bundle_archives+=("${asset}")
                ;;
              vaultspec-rag-*|vaultspec-search-mcp-*)
                raw+=("${asset}")
                ;;
            esac
          done <<< "${names}"
          [ ${#bundle_archives[@]} -eq ${#expected[@]} ] || missing+=("expected ${#expected[@]} bundle archives, found ${#bundle_archives[@]}")

          problems=()
          [ "${RELEASE_RESULT}" = "success" ] || problems+=("release job=${RELEASE_RESULT}")
          [ ${#package_missing[@]} -eq 0 ] || problems+=("missing or duplicate package assets: ${package_missing[*]}")
          [ ${#checksum_problems[@]} -eq 0 ] || problems+=("checksum integrity: ${checksum_problems[*]}")
          [ ${#missing[@]} -eq 0 ] || problems+=("missing or unexpected target archives: ${missing[*]}")
          [ ${#duplicates[@]} -eq 0 ] || problems+=("duplicate target archives: ${duplicates[*]}")
          [ ${#raw[@]} -eq 0 ] || problems+=("raw executables: ${raw[*]}")

          if [ ${#problems[@]} -eq 0 ]; then
            echo "all ${#expected[@]} declared target archives present on ${TAG}"
            exit 0
          fi

          echo "::warning::${TAG} failed the complete archive gate: ${problems[*]}"

          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --json isPrerelease --jq '.isPrerelease')" != "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            echo "::notice::demoted ${TAG} to a prerelease so latest skips it"
          fi

          echo "::error::${TAG} is INCOMPLETE - ${problems[*]}. It has been demoted to a prerelease so it cannot serve as latest. Fix the build and re-dispatch this workflow for this tag; the next step promotes it back only after every declared target archive is attached and the release job succeeds."
          exit 1

      # Undo an earlier demotion once a re-dispatch actually attaches something,
      # or a repaired release stays invisible to `latest` forever. The tag name
      # decides: release-please publishes full releases here, so anything
      # carrying a prerelease marker was meant to be one and must not be
      # promoted by a guard that only knows about assets.
      # The acquisition check cannot see this release by itself. A release
      # published with the default token raises no workflow events, so its
      # `release: published` trigger never fires for anything this lane
      # produces - only its weekly schedule does, which is days of blindness
      # after every release. An explicit dispatch is exempt from that rule,
      # which is why the binaries build is dispatched rather than waiting on a
      # tag push, and this is the same move for the same reason.
      #
      # Promotion waits for the public acquisition path. The build cannot
      # prove that a checksum-verified bundle loads inside each supported
      # hosted x64/ARM container; treating dispatch as best-effort promoted the
      # release before that distinct guarantee existed.
      - name: Require the acquisition check for this release
        if: ${{ success() }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          title="RAG Acquisition ${TAG} @ ${TARGET_SHA}"
          before_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow acquisition.yml --event workflow_dispatch --limit 1 \
            --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run acquisition.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="$TAG" -f target_sha="$TARGET_SHA"

          deadline=$((SECONDS + 180))
          run_id=""
          while [ -z "$run_id" ] && [ "$SECONDS" -lt "$deadline" ]; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow acquisition.yml --event workflow_dispatch --limit 20 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.databaseId > ${before_id} and .displayTitle == \"${title}\") | .databaseId" \
              | head -n 1)
            [ -n "$run_id" ] || sleep 5
          done
          [ -n "$run_id" ] || {
            echo "::error::acquisition run did not appear for ${TAG} at ${TARGET_SHA}"
            exit 1
          }
          echo "waiting for acquisition run ${run_id} for ${TAG} at ${TARGET_SHA}"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      # PyPI is dispatched only here, after promotion, so the index never
      # carries a version whose release this gate refused. The Publish run
      # queues behind this one on the shared per-tag lock and re-checks that
      # the release is a full one before it uploads anything. A tag that names
      # a prerelease is never promoted, so it never reaches the index.
      - name: Promote the release, then publish it to the package index
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          case "${TAG}" in
            *-rc*|*-alpha*|*-beta*|*-dev*)
              echo "${TAG} names a prerelease; leaving its flag alone and it off the package index"
              exit 0
              ;;
          esac
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                  --json isPrerelease --jq '.isPrerelease')" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false
            echo "::notice::promoted ${TAG} to a full release"
          fi
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="$TAG" -f stage=package-index
          echo "::notice::dispatched package-index publication for ${TAG}"
