name: Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build binaries for (e.g. vaultspec-rag-v0.4.6)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: binaries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Refuse a build whose runners cannot serve it.
  #
  # A selector with no ONLINE runner does not fail - it QUEUES, unbounded by
  # timeout-minutes, and this workflow sets no timeouts at all. v0.4.9 hung
  # exactly that way: two legs green, the third queued, cancelled by hand.
  #
  # Both selectors this matrix requires are served from the workstation today,
  # so on main this is a cheap assertion rather than a live catch. It earns its
  # place at the moment the linux-aarch64 leg returns - that runner lives on the
  # power-gated MacBook, and re-enabling the leg without this reconstructs the
  # v0.4.9 hang precisely, behind a release job that needs the whole matrix.
  #
  # The gate is not the problem and this does not fight it. Stopping runners on
  # battery is correct; spending a day discovering it is not.
  #
  # Hosted, deliberately - a preflight that needs the fleet cannot report that
  # the fleet is down.
  preflight:
    name: Preflight runners
    runs-on: ubuntu-latest
    steps:
      - name: Every matrix selector has an online runner
        shell: bash
        env:
          # A PAT with `administration: read` if configured; the default token
          # otherwise. The default GITHUB_TOKEN CANNOT read `actions/runners` -
          # that endpoint needs admin - so without the PAT this check is blind
          # and says so rather than guessing.
          GH_TOKEN: ${{ secrets.FLEET_PREFLIGHT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # NOT `set -e`. An unobservable preflight must not refuse a build: the
          # `gh api` below returns 403 under the default GITHUB_TOKEN, and under
          # `set -e` that aborts the step and skips everything downstream. It
          # blocked vaultspec-dashboard v0.1.6 exactly that way. A check that
          # cannot tell "no runner" from "cannot see runners" must not speak for
          # the first.
          set -uo pipefail
          if ! runners=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" --jq '.runners[] | [.status, ([.labels[].name] | map(ascii_downcase) | join(","))] | @tsv' 2>&1); then
            echo "::warning::preflight cannot read the runner list: ${runners}"
            echo "::warning::The default GITHUB_TOKEN cannot read actions/runners. Set FLEET_PREFLIGHT_TOKEN to a PAT with administration:read to enable this check."
            echo "::warning::SKIPPING - unobservable is not the same as unserviceable."
            exit 0
          fi
          [ -n "${runners}" ] || { echo "::error::no self-hosted runners are registered"; exit 1; }

          # Kept in step with binaries.yml's matrix. Add the aarch64 selector
          # here in the same change that re-enables that leg.
          selectors=(
            "self-hosted,linux,x64,build"
            "self-hosted,windows,x64"
          )

          failed=0
          for want in "${selectors[@]}"; do
            online=0; registered=0
            while IFS=$'	' read -r status labels; do
              missing=0
              IFS=',' read -ra parts <<< "${want}"
              for part in "${parts[@]}"; do
                case ",${labels}," in *",${part},"*) ;; *) missing=1; break ;; esac
              done
              [ "${missing}" -eq 0 ] || continue
              registered=$((registered + 1))
              [ "${status}" = "online" ] && online=$((online + 1))
            done <<< "${runners}"

            if [ "${online}" -gt 0 ]; then
              echo "ok        [${want}] -> ${online} online"
            elif [ "${registered}" -eq 0 ]; then
              echo "::error::[${want}] is carried by no registered runner." >&2
              failed=1
            else
              echo "::error::[${want}] matches ${registered} runner(s), none online - usually the power-gated host on battery. Dispatch again on AC." >&2
              failed=1
            fi
          done

          [ "${failed}" -eq 0 ] || { echo "::error::preflight refused a build that would queue rather than run" >&2; exit 1; }

  build:
    needs: preflight
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: [self-hosted, Linux, X64, build]
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
          # Restored. It was dropped because no leg could be scheduled while
          # the host stood its runners down on battery, on the explicit
          # condition that it return once that stopped being true. The host is
          # on AC, `macbook-neo-linux-arm-rag` is online, and its container is
          # enrolled in both of the host's fleet scripts - runner-powergate.sh
          # and runner-deploy-hooks.sh - so the condition is met.
          #
          # The accelerated torch pin already covers this target: the cu130
          # index publishes a manylinux_2_28_aarch64 wheel, which
          # tools/binaries/torch_channel.py resolves like any other.
          - name: linux-aarch64
            runner: [self-hosted, Linux, ARM64]
            target: aarch64-unknown-linux-gnu
          # NO macOS LEGS, deliberately. vaultspec-rag is CUDA-only:
          # embeddings.py, search/_searcher.py and server/_lifespan.py each
          # raise RuntimeError when torch.cuda.is_available() is false, and
          # there is no CUDA build for macOS at any version. Building macOS
          # binaries would publish assets that install cleanly and raise on
          # first use, which reads as a product defect rather than as an
          # unsupported platform. tools/packaging refuses to offer them too:
          # the product's supported_targets excludes darwin, so the Homebrew
          # formula covers Linux only.
          # DELIVERY GAP for Linux ARM64, deliberately unschedulable rather
          # than silently absent. Homebrew supports the platform, so the
          # missing aarch64-unknown-linux-gnu build is one the formula cannot
          # offer an install on at all. The generator prints a `::warning::`
          # naming the gap on every release, and omits the platform from the
          # formula rather than pinning an asset that was never built.
          #
          # It was enabled once, on `macbook-neo-linux-arm-rag`, and the build
          # itself is fine - it produced working aarch64 binaries for v0.4.8.
          # What is not fine is what carries it: that runner is a container on
          # a laptop, and the host's powergate stops it on battery. It went
          # offline between one release and the next, and because `release`
          # needs the whole matrix and a label no ONLINE runner carries QUEUES
          # rather than fails, v0.4.9 hung with the other two legs green and
          # had to be cancelled by hand. A job that is queued rather than
          # running is not bounded by `timeout-minutes`, so nothing in the
          # workflow rescues it.
          #
          # Re-enable by uncommenting the three lines below - but only once
          # this label is served by a runner that does not sleep. A release
          # gated on a laptop is a release that stops whenever the lid closes,
          # which is worse than the gap this closes.
          # - name: linux-aarch64
          #   runner: [self-hosted, Linux, ARM64]
          #   target: aarch64-unknown-linux-gnu
    # Artifact builds run on the shared self-hosted fleet (hosted multiplatform
    # runners are cost-prohibitive); see publish.yml for the same constraint.
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Build binaries
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          uv run --no-project --python 3.13 -- \
            python -m tools.binaries.build_pyapp --tag "${TAG}" --target "${TARGET}" --outdir dist-bin

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error
          retention-days: 5

  release:
    name: Attach to release
    needs: build
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: write
    steps:
      # This repo, for the generator itself. No deploy key and no push: the
      # channel pointers no longer live here.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      # The ORG-WIDE distribution repository. Scoop manifests and Homebrew
      # formulae belong to the account rather than to each product, so a user
      # taps or bucket-adds ONCE, ever - not once per product. Publishing into
      # this repo instead multiplied that one-time step by the number of
      # products and committed to a public product repo's default branch on
      # every release.
      #
      # vaultspec-core retargets identically; the two products now share this
      # branch, which is what makes the per-product staging below load-bearing
      # rather than tidy.
      - name: Checkout the distribution repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ref: main
          path: channels
          ssh-key: ${{ secrets.CHANNEL_ROOT_DEPLOY_KEY }}

      # The channel generator runs in this job, so it needs an interpreter
      # here too; previously only the build matrix installed one.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist-bin/
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        run: |
          cd dist-bin
          # Per-asset .sha256 files are produced by build_pyapp.py; fold them
          # into one sha256sum-compatible manifest and drop the fragments.
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          {
            echo "### Binary checksums"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "${TAG}" dist-bin/* --clobber

      # Regenerate BOTH release-channel pointers from the SHA256SUMS just
      # built, then commit them. A Scoop manifest and a Homebrew formula are
      # pointers a user's package manager acts on, so they are generated whole
      # by dev/packaging rather than edited in place here.
      #
      # This replaced an inline jq rewrite, and the reason is worth keeping:
      # that version looked digests up with awk and guarded the result with
      # `test -n "$A" && test -n "$B" && test -n "$C"`, which is INERT under
      # `set -e` - bash exempts every command in an && list except the one
      # after the final &&. When the Windows build leg emitted CRLF checksum
      # sidecars, the awk lookup matched nothing, the guard did not fire, and
      # vaultspec-core-v0.1.60 published a manifest with empty hashes out of
      # a green run - this repository adopts the fix rather than repeating it. The generator raises on a missing digest, refuses a
      # backward bump, and omits an unbuilt platform instead of inventing one.
      - name: Generate release channel pointers
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 --             python -m tools.packaging.generate               --tag "${TAG}"               --checksums dist-bin/SHA256SUMS               --root channels

      - name: Commit the Scoop manifest and Homebrew formula
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd channels
          # Stage BEFORE asking whether anything changed. `git diff` reports
          # only tracked paths, so on the first release for a channel - when
          # the generator has just created bucket/*.json and Formula/*.rb and
          # nothing tracks them yet - it reports no change, and the step
          # announces "nothing to commit" and exits zero having published no
          # pointer at all. That is exactly what happened on v0.4.8: both
          # files were written, neither was committed, and the job went green.
          # Comparing the index against HEAD sees an added path as a change.
          # Only THIS product's two files. The distribution repo serves every
          # product under the account, so a repo-wide `git add` would sweep up a
          # sibling's pointer if two releases raced and publish it under this
          # tag's message.
          git add -- bucket/vaultspec-rag.json Formula/vaultspec-rag.rb
          if git diff --cached --quiet -- bucket Formula; then
            echo "channels already at ${TAG}; nothing to commit"
            exit 0
          fi
          # The identity is passed to this one commit rather than written
          # with `git config`. This runner is self-hosted and its checkout is
          # reused by every later job on the box, so a persisted user.email
          # outlives the run: the citation gate derives its machine-identity
          # tokens from `git config user.email`, so the bot address became a
          # token and then matched its own literal in these workflow files,
          # failing the unit lane on main for work that never touched it.
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(release): point scoop and homebrew at ${TAG}"
          # This job runs after a long matrix build, so main may have advanced
          # meanwhile. Rebase-and-retry (bounded) so an unrelated commit does not
          # fail the push non-fast-forward; the backward-bump guard in the
          # generator still protects against clobbering a newer pointer.
          attempt=1
          max_attempts=3
          until git push origin main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::channel pointer push failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "push rejected (attempt ${attempt}/${max_attempts}); rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
          done
