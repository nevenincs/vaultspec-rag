name: RAG Binaries

# WHAT STARTS THIS WORKFLOW: Publish dispatches it only after the GitHub
# wheel/sdist publication has succeeded. Keeping this workflow dispatch-only
# makes that ordering enforceable: independent tag triggers can be serialized,
# but serialization alone cannot say which workflow runs first. A maintainer
# may still dispatch it explicitly to repair a release; the final gate below
# independently proves the package and bundle set on the draft.
#
# WHAT THIS WORKFLOW STARTS: the publication lane, and only from the gate that
# found the draft complete. That lane uploads to PyPI and then takes the
# release out of draft, so an upload that cannot be withdrawn never races a
# build that could still fail, and an incomplete release is simply never
# published.
#
# The failure worth remembering: vaultspec-rag-v0.4.12 was cut and became
# `latest` carrying the wheel, the sdist and SHA256SUMS - and not one platform
# binary. rag went from 3/3 to 0/3. The artifact-less-release guard did not
# catch it and could not: that guard lives in THIS workflow, and a workflow
# that never runs cannot demote anything. It was unreachable, not broken. A
# draft closes that gap by construction: an unreachable lane leaves a release
# nobody was ever sent to.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build binaries for (e.g. vaultspec-rag-v0.4.6)"
        required: true
        type: string
      target_sha:
        description: "Immutable release commit to build and publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Shared with publish.yml. Both workflows merge and rewrite the same
  # SHA256SUMS release asset, so a per-workflow lock would still permit a lost
  # update when they run for one tag at the same time.
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Both inputs are free text from anyone who can dispatch. So they are proven
  # HERE, before anything is checked out: the tag must be a release tag, and
  # it must resolve on the public remote to exactly the commit requested.
  validate:
    name: "Check: Release request (Linux)"
    timeout-minutes: 130
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 10
    steps:
      - name: Require a release tag that resolves to the requested commit
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^vaultspec-rag-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: ${TAG}"
            exit 1
          fi
          if ! [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha is not a full lowercase commit ID"
            exit 1
          fi
          refs=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "${TAG}")
          sha=$(awk -v ref="refs/tags/${TAG}" '$2 == ref "^{}" { print $1; exit }' <<<"${refs}")
          [ -n "${sha}" ] || sha=$(awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1; exit }' <<<"${refs}")
          if [ -z "${sha}" ]; then
            echo "::error::release tag ${TAG} does not exist"
            exit 1
          fi
          if [ "${sha}" != "${TARGET_SHA}" ]; then
            echo "::error::${TAG} resolves to ${sha}, not the requested ${TARGET_SHA}"
            exit 1
          fi
          echo "${TAG} resolves to ${TARGET_SHA}"

  # The binaries carry the release's own wheel, never a second build of it.
  # Publish built the wheel once, smoke-tested it, attached it to the release
  # and recorded its digest in SHA256SUMS; PyPI later uploads exactly those
  # bytes, checked against the same manifest. Taking the attached wheel here,
  # checked the same way, makes the wheel inside every binary byte-identical
  # to the one on the release and on PyPI. A rebuild would match only as far
  # as the build is reproducible, and nothing asserts that it is.
  wheel:
    needs: validate
    timeout-minutes: 150
    name: "Check: Release wheel (Linux)"
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      # Exactly one manifest line for exactly this wheel, then the digest: a
      # manifest missing the wheel would otherwise pass by checking nothing,
      # and a mismatch stops here, before any binary is built around it.
      - name: Fetch the wheel Publish attached, checked against SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          wheel="vaultspec_rag-${TAG#vaultspec-rag-v}-py3-none-any.whl"
          work="${RUNNER_TEMP}/release-wheel"
          rm -rf "${work}"
          mkdir -p "${work}" dist
          if ! gh release download "${TAG}" --repo "$GITHUB_REPOSITORY" \
               --dir "${work}" --pattern SHA256SUMS --pattern "${wheel}"; then
            echo "::error::${TAG} carries no ${wheel} or SHA256SUMS; Publish attaches both before it dispatches this workflow"
            exit 1
          fi
          awk -v wheel="${wheel}" '$2 == wheel' "${work}/SHA256SUMS" > "${work}/wheel.sha256"
          if [ "$(wc -l < "${work}/wheel.sha256")" -ne 1 ]; then
            echo "::error::SHA256SUMS on ${TAG} does not list ${wheel} exactly once"
            exit 1
          fi
          (cd "${work}" && sha256sum -c wheel.sha256)
          mv "${work}/${wheel}" dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install 3.13

      - name: Validate the wheel matches the release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 -- python -c \
            "import os; from pathlib import Path; from tools.binaries.build_pyapp import sole_wheel, validate_project_wheel, version_from_tag; wheel = validate_project_wheel(sole_wheel(Path('dist')), version_from_tag(os.environ['TAG'])); print(f'validated {wheel}')"

      - name: Require the canonical installed monitor owners in the release wheel
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: uv run --no-project --python 3.13 -- python -m tools.monitor.release wheel --tag "$TAG" --directory dist

      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-wheel-${{ inputs.target_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 5

  frontend:
    needs: wheel
    name: "Build: Common monitor frontend (Linux)"
    timeout-minutes: 140
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 20
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
      frontend_sha256: ${{ steps.identity.outputs.frontend_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Restore the committed npm dependency graph
        run: npm ci
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Install Python
        run: uv python install 3.13
      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0
      - name: Build the frontend once from the exact producer
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: just release-monitor-frontend "$TAG" "$TARGET_SHA"
      - name: Bind the common artifact to source, version and lock
        id: identity
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          lock=$(sha256sum package-lock.json | cut -d' ' -f1)
          echo "artifact=monitor-frontend-${TAG}-${TARGET_SHA}-${lock}" >> "$GITHUB_OUTPUT"
          echo "frontend_sha256=$(sha256sum dist-monitor-frontend/frontend.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload the exact Vite handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: dist-monitor-frontend/
          if-no-files-found: error
          retention-days: 5

  build:
    needs: [wheel, frontend]
    name: "Build: Standalone binaries (${{ matrix.name }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          # A Linux binary's minimum glibc is the one it is built against.
          # GLIBC_FLOOR in `tools/binaries/build_pyapp.py` records the
          # supported floor. Raising it is a support decision, not a build
          # detail: it is asserted against the produced artifact and checked
          # again against the published binary by the acquisition lane.
          - name: linux-x86_64
            runner: [self-hosted, Linux, X64, build]
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            runner: [self-hosted, Windows, X64]
            target: x86_64-pc-windows-msvc
          - name: linux-aarch64
            runner: [self-hosted, Linux, ARM64]
            target: aarch64-unknown-linux-gnu
          # Apple silicon is a supported accelerator, not an absent one: the
          # MPS backend carries the dense, sparse and reranker models, and the
          # hardware tiers gate every release on an MPS acceptance guard that
          # fails if any operation falls back to CPU. This leg needs no
          # container - a macOS binary's floor is its SDK, not glibc - and no
          # torch pin either, because the wheel default PyPI publishes for
          # darwin is the one carrying MPS.
          - name: macos-arm64
            runner: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
    # Artifact builds run only for release events and explicit release repair.
    timeout-minutes: 210
    runs-on: ${{ matrix.runner }}
    env:
      CI_EXEC_BUDGET_MINUTES: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-10
        with:
          targets: ${{ matrix.target }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install 3.13

      - name: Download the wheel the binaries carry
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-wheel-${{ inputs.target_sha }}
          path: dist

      - name: Download the common frontend handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.frontend.outputs.artifact }}
          path: dist-monitor-frontend

      - name: Set up Node for the installed-browser verification driver
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      # The recipe, not a second copy of its body. `just release-binaries`
      # already ran exactly this command under exactly this bare `--no-project`
      # interpreter so a maintainer reproducing a release build runs what CI
      # runs; this file was the reason that property was worth having, and the
      # one place that did not use it.
      - name: Build binaries
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: just release-binaries "${TAG}" "${TARGET}" dist-bin dist

      - name: Compile the embedded native monitor
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          FRONTEND_SHA256: ${{ needs.frontend.outputs.frontend_sha256 }}
        run: just release-monitor "$TAG" "$TARGET_SHA" "$FRONTEND_SHA256"

      - name: Verify finalized monitor bytes and render in an installed browser
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET: ${{ matrix.target }}
        run: uv run --no-project --python 3.13 -- python -m tools.monitor.release native-smoke --tag "$TAG" --source-revision "$TARGET_SHA" --target "$TARGET" --directory dist-bin

      - name: Package and verify the release bundle
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: just release-bundle "${TAG}" "${TARGET}" dist-bin dist-bundles

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ inputs.target_sha }}-${{ matrix.name }}
          path: dist-bundles/
          if-no-files-found: error
          retention-days: 5

  release:
    timeout-minutes: 150
    name: "Build: Release attachment (Linux)"
    needs: [build, frontend]
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 30
    permissions:
      contents: write
    steps:
      # This repo, for the target matrix the completeness gate below derives
      # its expectations from. No deploy key and no push: the channel pointers
      # are published by their own lane, after the release exists.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-${{ inputs.target_sha }}-*
          path: dist-bundles/
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Verify all four native monitor proofs before release attachment
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          FRONTEND_SHA256: ${{ needs.frontend.outputs.frontend_sha256 }}
        run: uv run --no-project --python 3.13 -- python -m tools.monitor.release verify-set --tag "$TAG" --source-revision "$TARGET_SHA" --frontend-sha256 "$FRONTEND_SHA256" --directory dist-bundles

      - name: Aggregate checksums
        shell: bash
        env:
          # Needed by the merge below. Without them `gh release download` fails
          # and the merge silently no-ops - which looks exactly like success and
          # leaves the manifest incomplete again.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd dist-bundles
          # Per-bundle .sha256 files are produced by tools.packaging.bundles;
          # fold them into one sha256sum-compatible manifest and drop the
          # fragments. The bundle command already validated each archive before
          # this artifact was uploaded.
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          # Only public archives and the aggregate may cross the release edge.
          # Raw target-qualified executables remain private build intermediates.
          for asset in *; do
            [ "${asset}" = "SHA256SUMS" ] && continue
            case "${asset}" in
              *.zip|*.tar.gz) ;;
              *)
                echo "::error::unexpected non-archive release artifact: ${asset}"
                exit 1
                ;;
            esac
          done
          sha256sum -c SHA256SUMS
          # MERGE into whatever the release already carries rather than
          # replacing it. binaries.yml and publish.yml both publish a file named
          # SHA256SUMS to the same release with --clobber, and neither knows
          # which ran first. On v0.4.11 the binaries run landed last and the
          # published manifest ended up describing only the six binaries - the
          # wheel and the sdist were attached with no digest anyone could check
          # them against, which is precisely the verifiability the manifest
          # exists to provide.
          #
          # Entries for the files THIS run is publishing are dropped from the
          # inherited copy before appending, so a re-run replaces its own lines
          # instead of duplicating them.
          if gh release download "${TAG}" --repo "$GITHUB_REPOSITORY"                --pattern SHA256SUMS --output inherited.txt 2>/dev/null; then
            # A manifest written before names were bare lists `./name`. Read
            # every inherited name bare, or a re-run keeps the stale spelling
            # and the exact-coverage gate refuses an otherwise complete release.
            sed -i -E 's#^([0-9a-f]{64})  \./#\1  #' inherited.txt
            while read -r _digest name; do
              [ -n "${name}" ] || continue
              grep -v -- "  ${name}$" inherited.txt > inherited.tmp || true
              mv inherited.tmp inherited.txt
            done < SHA256SUMS
            cat inherited.txt >> SHA256SUMS
            rm -f inherited.txt
            LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          fi
          {
            echo "### Binary checksums"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The release mutation is last. Every declared target must have exactly
      # one correctly named public archive before this job can attach anything;
      # a successful matrix is not enough when an artifact upload is stale,
      # renamed, or accidentally points at the private raw directory.
      - name: Assert every declared target archive ready
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/binaries.yml
          [ -f "${workflow}" ] || { echo "::error::${workflow} not found; cannot derive targets"; exit 1; }
          mapfile -t expected < <(awk '/^[[:space:]]+target:[[:space:]]/ {print $2}' "${workflow}" | sort -u)
          if [ ${#expected[@]} -eq 0 ]; then
            echo "::error::could not derive any target from ${workflow}; refusing to pass vacuously"
            exit 1
          fi

          missing=()
          duplicates=()
          expected_names=()
          for triple in "${expected[@]}"; do
            suffix=.tar.gz
            [[ "${triple}" == *-windows-msvc ]] && suffix=.zip
            expected_name="${TAG}-${triple}${suffix}"
            expected_names+=("${expected_name}")
            [ -f "dist-bundles/${expected_name}" ] || missing+=("${expected_name}")
            matches=()
            for asset in "dist-bundles/${TAG}-${triple}.zip" "dist-bundles/${TAG}-${triple}.tar.gz"; do
              [ -f "${asset}" ] && matches+=("${asset}")
            done
            [ ${#matches[@]} -le 1 ] || duplicates+=("${triple} (${#matches[@]})")
          done

          raw=()
          unexpected=()
          for asset in dist-bundles/*; do
            [ -f "${asset}" ] || continue
            asset_name="${asset#dist-bundles/}"
            case "${asset_name}" in
              SHA256SUMS) ;;
              *.zip|*.tar.gz)
                allowed=0
                for expected_name in "${expected_names[@]}"; do
                  [ "${asset_name}" = "${expected_name}" ] && allowed=1 && break
                done
                [ "${allowed}" -eq 1 ] || unexpected+=("${asset_name}")
                ;;
              *) raw+=("${asset_name}") ;;
            esac
          done

          if [ ${#missing[@]} -ne 0 ] || [ ${#duplicates[@]} -ne 0 ] || [ ${#raw[@]} -ne 0 ] || [ ${#unexpected[@]} -ne 0 ]; then
            [ ${#missing[@]} -eq 0 ] || echo "::error::${TAG} is missing target archives: ${missing[*]}"
            [ ${#duplicates[@]} -eq 0 ] || echo "::error::${TAG} has duplicate target archives: ${duplicates[*]}"
            [ ${#raw[@]} -eq 0 ] || echo "::error::raw or unexpected files cannot be published: ${raw[*]}"
            [ ${#unexpected[@]} -eq 0 ] || echo "::error::unexpected public archives cannot be published: ${unexpected[*]}"
            echo "### Incomplete binary archive set" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "all ${#expected[@]} declared target archives are ready for ${TAG}"

      - name: Upload bundles to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "${TAG}" dist-bundles/* --clobber

  # A release with no artifacts must not exist.
  #
  # vaultspec-rag-v0.4.11 was published by release-please, Binaries had not been
  # dispatched for it, and the empty release immediately became `latest` - which
  # is where the README badges, docs/installation.md and the channel manifests
  # all point. Nothing went red, because nothing was watching.
  # vaultspec-core-v0.1.61 did the same an hour earlier.
  #
  # vaultspec-dashboard has carried this guard since its v0.1.4 spent six weeks
  # answering as `latest` with zero assets. vaultspec-core adopts it in #355;
  # this is the same job, so all three repos fail the same way for the same
  # reason instead of each discovering it separately.
  #
  # The release is created as a draft now, so this job judges something nobody
  # can see yet and its verdict is simply whether the lane may go on to publish
  # it. What used to demote an incomplete release and promote a repaired one is
  # gone with the state it managed: a draft is already invisible to `latest`,
  # and an incomplete one stays a draft.
  verify-release-assets:
    timeout-minutes: 150
    name: "Check: Release proven (Linux)"
    needs: [release, frontend]
    if: ${{ always() }}
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      # Reads the release and downloads its assets; it edits nothing. The
      # handoff below is a write to the Actions API.
      contents: read
      actions: write
    env:
      CI_EXEC_BUDGET_MINUTES: 30
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      TARGET_SHA: ${{ inputs.target_sha }}
      RELEASE_RESULT: ${{ needs.release.result }}
      FRONTEND_SHA256: ${{ needs.frontend.outputs.frontend_sha256 }}
    steps:
      # This job reads the build matrix out of this file, so the file is
      # checked out explicitly.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ inputs.target_sha }}
          path: .sparse-verify-release-assets

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git -C .sparse-verify-release-assets rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Require every declared target on the draft release
        shell: bash
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          assets=$(printf '%s' "${names}" | grep -c . || true)
          echo "release ${TAG} carries ${assets} asset(s); release job=${RELEASE_RESULT}"

          version="${TAG#vaultspec-rag-v}"
          wheel="vaultspec_rag-${version}-py3-none-any.whl"
          sdist="vaultspec_rag-${version}.tar.gz"
          package_missing=()
          [ "$(printf '%s\n' "${names}" | grep -Fxc "${wheel}" || true)" -eq 1 ] || package_missing+=("${wheel}")
          [ "$(printf '%s\n' "${names}" | grep -Fxc "${sdist}" || true)" -eq 1 ] || package_missing+=("${sdist}")
          [ "$(printf '%s\n' "${names}" | grep -Fxc SHA256SUMS || true)" -eq 1 ] || package_missing+=("SHA256SUMS")

          checksum_problems=()
          verify_dir=$(mktemp -d)
          trap 'rm -rf -- "${verify_dir}"' EXIT
          if [ ${#package_missing[@]} -eq 0 ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "${verify_dir}"
            if ! (cd "${verify_dir}" && sha256sum -c SHA256SUMS); then
              checksum_problems+=("SHA256SUMS verification failed")
            else
              release_names=$(printf '%s\n' "${names}" | grep -vFx SHA256SUMS | LC_ALL=C sort)
              manifest_names=$(awk '{sub(/^\*/, "", $2); print $2}' "${verify_dir}/SHA256SUMS" | LC_ALL=C sort)
              [ "${release_names}" = "${manifest_names}" ] || checksum_problems+=("SHA256SUMS does not cover exactly the published assets")
            fi
          fi

          # EVERY DECLARED TARGET, not "any asset at all". v0.4.15 is why.
          #
          # THIS JUDGES A DRAFT. The release is unpublished until the
          # publication lane flips it, so an incomplete one is not a live
          # defect to be demoted and later promoted - it is a draft nobody can
          # see, and this job simply refuses to let it go further. That is why
          # nothing here edits the release's flags any more.
          #
          # Its aarch64 leg failed, so the release attachment was skipped and no
          # binary reached the release - but `Publish` had already attached the
          # wheel, the sdist and SHA256SUMS on the tag. The old check asked only
          # whether the asset count was above zero, saw three, and passed. A
          # release carrying no binaries at all served as `latest`, and the guard
          # that exists to prevent exactly that reported success.
          #
          # The per-target assert cannot cover this: it lives in the `release`
          # job, which is the job that does not run when a build leg fails.
          #
          # Targets are DERIVED from the matrix in this same file rather than
          # listed again - a second list drifts, and this repo has paid for that.
          workflow=".sparse-verify-release-assets/.github/workflows/binaries.yml"
          [ -f "${workflow}" ] || { echo "::error::${workflow} not checked out; cannot derive targets"; exit 1; }
          mapfile -t expected < <(awk '/^[[:space:]]+target:[[:space:]]/ {print $2}' "${workflow}" | sort -u)
          if [ ${#expected[@]} -eq 0 ]; then
            echo "::error::could not derive any target from ${workflow}; refusing to pass vacuously"
            exit 1
          fi

          missing=()
          duplicates=()
          expected_names=()
          for triple in "${expected[@]}"; do
            suffix=.tar.gz
            [[ "${triple}" == *-windows-msvc ]] && suffix=.zip
            expected_name="${TAG}-${triple}${suffix}"
            expected_names+=("${expected_name}")
            matches=()
            while IFS= read -r asset; do
              [ -n "${asset}" ] || continue
              case "${asset}" in
                "${TAG}-${triple}".zip|"${TAG}-${triple}".tar.gz)
                  matches+=("${asset}")
                  ;;
              esac
            done <<< "${names}"
            [ ${#matches[@]} -le 1 ] || duplicates+=("${triple} (${#matches[@]})")
            found=0
            for asset in "${matches[@]}"; do
              [ "${asset}" = "${expected_name}" ] && found=1
            done
            [ "${found}" -eq 1 ] || missing+=("${expected_name}")
          done

          bundle_archives=()
          raw=()
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            case "${asset}" in
              vaultspec-rag-v*.zip|vaultspec-rag-v*.tar.gz)
                bundle_archives+=("${asset}")
                ;;
              vaultspec-rag-*|vaultspec-search-mcp-*)
                raw+=("${asset}")
                ;;
            esac
          done <<< "${names}"
          [ ${#bundle_archives[@]} -eq ${#expected[@]} ] || missing+=("expected ${#expected[@]} bundle archives, found ${#bundle_archives[@]}")

          problems=()
          [ "${RELEASE_RESULT}" = "success" ] || problems+=("release job=${RELEASE_RESULT}")
          [ ${#package_missing[@]} -eq 0 ] || problems+=("missing or duplicate package assets: ${package_missing[*]}")
          [ ${#checksum_problems[@]} -eq 0 ] || problems+=("checksum integrity: ${checksum_problems[*]}")
          [ ${#missing[@]} -eq 0 ] || problems+=("missing or unexpected target archives: ${missing[*]}")
          [ ${#duplicates[@]} -eq 0 ] || problems+=("duplicate target archives: ${duplicates[*]}")
          [ ${#raw[@]} -eq 0 ] || problems+=("raw executables: ${raw[*]}")

          if [ ${#problems[@]} -eq 0 ]; then
            (cd .sparse-verify-release-assets && uv run --no-project --python 3.13 -- python -m tools.monitor.release verify-set --tag "$TAG" --source-revision "$TARGET_SHA" --frontend-sha256 "$FRONTEND_SHA256" --directory "${verify_dir}")
            echo "all ${#expected[@]} declared target archives present on ${TAG}"
            exit 0
          fi

          echo "::warning::${TAG} failed the complete archive gate: ${problems[*]}"
          echo "::error::Re-dispatch repairs a fix to THIS FILE (use --ref main), not a fix to tracked source. A source-level build fix needs a new release."
          echo "::error::${TAG} is INCOMPLETE - ${problems[*]}. It stays a draft, so nothing has been advertised. Fix the build and re-dispatch this workflow for this tag."
          exit 1

      # THE HANDOFF. The publication lane is dispatched from here, never beside
      # this workflow, because PyPI - the one act no re-dispatch can take back -
      # must not race a build that could still fail. This step is reached only
      # when the gate above found every declared target on the draft and the
      # release job that attached them succeeded.
      #
      # That lane finishes the release: it uploads the draft's own
      # checksum-verified wheel and sdist to the index, then takes the release
      # out of draft as its last act, then points the channels at it and asks
      # the acquisition check to try it. That is why nothing here publishes the
      # release, pushes a pointer or acquires anything: at this point the
      # release is still a draft, whose download URLs serve nothing.
      #
      # Safe to re-dispatch. `uv publish --check-url` skips a file the index
      # already carries, so repairing the binaries of an already-published
      # version re-runs this without a duplicate-upload failure.
      - name: Hand the proven draft to the publication lane
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f tag="$TAG" -f stage=package-index
          echo "::notice::dispatched the package-index publication for ${TAG}"
