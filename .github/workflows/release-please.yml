name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # These three steps together refresh uv.lock on the release branch: the
      # version bump release-please writes to pyproject.toml leaves the lock
      # stale, and a stale lock fails `uv sync --locked` for anyone who checks
      # the release branch out. Each step is named for what it DOES.
      - name: Check out the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Set up uv
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        uses: astral-sh/setup-uv@v7

      - name: Regenerate and push uv.lock
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock is already up to date"
          else
            git add uv.lock
            # Scoped to the commit, never written to the checkout's config:
            # see the note in binaries.yml - a persisted identity outlives the
            # run on a reused self-hosted checkout and poisons the citation
            # gate's machine-identity detection.
            git \
              -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: update uv.lock for release"
            git push
          fi

      - name: Trigger Publish workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run Publish \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field tag="${{ steps.release.outputs.tag_name }}"

      # AND the binaries. This step did not exist, and its absence is what cost
      # this repo its release matrix: vaultspec-rag-v0.4.12 was cut, Publish was
      # dispatched, and the platform binaries were never built - so `latest`
      # carried the wheel, the sdist and SHA256SUMS and nothing else, and rag
      # went from 3/3 to 0/3.
      #
      # binaries.yml's `on: push: tags:` does NOT cover this. A tag pushed with
      # the default GITHUB_TOKEN does not trigger workflows - GitHub's
      # anti-recursion rule - and release-please pushes with exactly that token.
      # An explicit dispatch is not a tag push, so the rule does not apply.
      #
      # vaultspec-core has dispatched its binaries here since the binary lane
      # was added. rag dispatched only Publish. That one missing step is the
      # whole difference between a release with nine assets and one with three.
      - name: Trigger Binaries workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::release_created is true but tag_name is empty; refusing to dispatch a build with no tag"
            exit 1
          fi
          gh workflow run Binaries --repo "$GITHUB_REPOSITORY" --ref main --field tag="${TAG}"
          echo "Dispatched Binaries for ${TAG}" >> "$GITHUB_STEP_SUMMARY"
