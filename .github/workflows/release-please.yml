name: RAG Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  # The commit is in the group, and only on main. `cancel-in-progress: false`
  # governs runs that have STARTED; GitHub separately cancels a previously
  # PENDING run in the same group with no switch to stop it, and on a
  # saturated serial fleet a main run sits pending long enough for the next
  # push to reach it. Without the commit here, a burst of merges leaves only
  # the last one with a release proposal - and the ones it cancelled report
  # `cancelled`, not `failed`, so nothing raises an alarm.
  group: release-please-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-please:
    name: "Build: Release proposal (Linux)"
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64, build]
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # These three steps together refresh uv.lock on the release branch: the
      # version bump release-please writes to pyproject.toml leaves the lock
      # stale, and a stale lock fails `uv sync --locked` for anyone who checks
      # the release branch out. Each step is named for what it DOES.
      - name: Check out the release branch
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Set up uv
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Regenerate and push uv.lock
        if: steps.release.outputs.pr && !steps.release.outputs.release_created
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock is already up to date"
          else
            git add uv.lock
            # Scoped to the commit, never written to the checkout's config:
            # see the note in binaries.yml - a persisted identity outlives the
            # run on a reused self-hosted checkout and poisons the citation
            # gate's machine-identity detection.
            git \
              -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: update uv.lock for release"
            git push
          fi

      # Release Please creates the GitHub Release before either artifact
      # workflow finishes. Hold that release out of `latest` until the binary
      # workflow's complete-target gate has a chance to verify the public set.
      # Publish dispatches Binaries only after its own two publication jobs
      # succeed, so any failure in that chain leaves the tag reachable as a
      # prerelease instead of becoming a partial stable release.
      - name: Hold the release out of latest until artifacts are complete
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::release_created is true but tag_name output is empty; refusing to release an untagged build"
            exit 1
          fi
          gh release edit "${TAG}" --repo "$GITHUB_REPOSITORY" --prerelease

      - name: Trigger Publish workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::release_created is true but tag_name output is empty; refusing to dispatch publication with no tag"
            exit 1
          fi
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field tag="${TAG}"
