name: RAG Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # The commit is in the group, and only on main. `cancel-in-progress: false`
  # governs runs that have STARTED; GitHub separately cancels a previously
  # PENDING run in the same group with no switch to stop it, so a queued main
  # run can be cancelled by the next push. Without the commit here, a burst of
  # merges leaves only
  # the last one with a release proposal - and the ones it cancelled report
  # `cancelled`, not `failed`, so nothing raises an alarm.
  group: release-please-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-please:
    name: "Build: Release proposal (Linux)"
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64, build]
    # Tags and edits the release, dispatches Publish and opens the release PR:
    # the only job here, and the only one that writes.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # TWO IDENTITIES, ONE PER KIND OF WRITE. Releases come first, as
      # release-please itself orders them: it refuses to propose a new version
      # while a merged proposal is still untagged.
      #
      # The tag and the release are created with the default token on purpose.
      # GitHub raises no workflow event for a ref or release that token
      # creates, so Publish starts only from the explicit dispatch below and
      # never a second time from its tag trigger.
      - name: Create releases for merged release pull requests
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # Release Please creates the GitHub Release before either artifact
      # workflow finishes. Hold that release out of `latest` until the binary
      # workflow's complete-target gate has a chance to verify the public set.
      # Publish dispatches Binaries only after its GitHub package publication
      # succeeds, and PyPI follows Binaries' promotion, so any failure in that
      # chain leaves the tag reachable as a prerelease instead of becoming a
      # partial stable release.
      - name: Hold the release out of latest until artifacts are complete
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::release_created is true but tag_name output is empty; refusing to release an untagged build"
            exit 1
          fi
          gh release edit "${TAG}" --repo "$GITHUB_REPOSITORY" --prerelease

      - name: Trigger Publish workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::release_created is true but tag_name output is empty; refusing to dispatch publication with no tag"
            exit 1
          fi
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field tag="${TAG}"

      # The release pull request is written by the release App, never the
      # default token. A pull request that token opens or pushes to starts its
      # workflows only once a maintainer approves them in the Actions tab, and
      # the pull request's own checks never show that pending approval, so the
      # merge gate silently never runs. The App's writes start the gate like any
      # other push. There is no fallback to the default token: it would restore
      # exactly that silent stall. Minted after publication so a broken App can
      # hold up the next proposal but never a release already merged.
      - name: Mint the release pull request token
        id: proposal-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The version bump in pyproject.toml would leave uv.lock stale. The
      # `uv.lock` entry in release-please-config.json bumps the lock in the
      # same commit, so every proposal head is one commit the gate measures
      # once, rather than a second push that restarts it.
      - name: Open or update the release pull request
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.proposal-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
