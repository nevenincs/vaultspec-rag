name: RAG Hardware Tiers

# THE ONE DEFINITION OF THE ACCELERATOR TIERS: Apple silicon (MPS) and CUDA.
#
# Two callers, one job each, so the jobs cannot drift apart:
# - The release cut in `release-please.yml` requires both tiers to pass on
#   the exact head it merges, before the release commit is tagged.
# - `ci.yml` runs them on schedule and on dispatch against the commit it was
#   started for, and adds the advisory macOS full suite.
#
# Every precondition the tiers read is provisioned here, inside the job that
# reads it: the public model cache, the pinned Qdrant
# binary and the resident service the CUDA tier borrows. A tier that finds a
# precondition missing refuses to run and fails, so a caller that skipped a
# step would block every release without measuring anything.
#
# Neither tier is reachable from a pull request: both callers start it only
# from a schedule or a dispatch, both of which require write access.
on:
  workflow_call:
    inputs:
      target_sha:
        description: Immutable commit to validate
        required: true
        type: string
      tier:
        description: "Which tiers to run: macos, gpu or macos-and-gpu"
        required: false
        type: string
        default: macos-and-gpu
      macos_full_suite:
        description: Also run the advisory accelerator-free suite on macOS
        required: false
        type: boolean
        default: false
    secrets:
      VAULTSPEC_RAG_TYPESAFE_API_KEY:
        description: Funded Typesafe key for live classification integration tests
        required: true

permissions:
  contents: read

concurrency:
  group: hardware-${{ inputs.target_sha }}-${{ inputs.tier }}
  cancel-in-progress: false

env:
  # NO_COLOR alone disables colour. A non-empty FORCE_COLOR (even "0") forces
  # the terminal ON under the force-color spec Rich implements, making
  # console.clear() emit escape codes into the piped CI log; without it
  # is_terminal falls through to isatty()->False as intended.
  NO_COLOR: "1"

jobs:
  mps:
    name: "Test: Accelerator backend (macOS)"
    # A release waits for this tier before it may advertise MPS support for
    # the selected commit.
    if: inputs.tier == 'macos' || inputs.tier == 'macos-and-gpu'
    timeout-minutes: 60
    runs-on: [self-hosted, macOS, ARM64]
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}

      - name: Require the exact commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: false
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      # ADVISORY, through `continue-on-error`. The macOS suite has never been
      # fully triaged; it flips to gating by deleting that flag once its
      # failure count reaches zero. Ratchet down, never up. Releases do not run
      # it: the MPS guard below is the release's Apple silicon claim.
      - name: Run tests
        if: inputs.macos_full_suite
        continue-on-error: true
        run: just test-python

      # The guard below reads the model cache with the Hub switched off,
      # deliberately, so that a missing snapshot fails loudly instead of
      # quietly downloading gigabytes mid-gate. That contract needs the cache
      # to exist, so it is warmed here.
      # The download is idempotent - a warm cache is a no-op - and the model
      # set is read from the shipped configuration so it cannot drift from
      # what the guard then loads. A recipe rather than an inline script,
      # because a step's shell is bash here and PowerShell on Windows.
      - name: Warm the model cache the MPS guard reads
        run: just warm-models

      # This is the support gate for Apple silicon. It runs the configured
      # dense, sparse, and reranker models together on MPS and fails if any
      # operation falls back to CPU or cannot run.
      - name: Run MPS acceptance guard
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "0"
        run: just test-mps

  cuda:
    name: "Test: GPU correctness (Windows)"
    # Generous because this tier is the ~40 minute long pole, but still
    # finite, so a wedged GPU test fails instead of hanging.
    #
    # The integration, quality, performance, robustness, subprocess_gpu, and
    # cuda markers that need a GPU run here. It never runs per push.
    #
    # Contention is guarded by the one pytest coordinator: it borrows through
    # the acknowledged service lease, fails closed on unavailable service,
    # lease, or device evidence, and resumes before release.
    if: inputs.tier == 'gpu' || inputs.tier == 'macos-and-gpu'
    timeout-minutes: 90
    runs-on: [self-hosted, windows, gpu, cuda]
    env:
      # requires-python admits a range, so uv would otherwise pick whichever
      # interpreter it likes here and the CUDA wheel under test would drift
      # between runs. This job exists to exercise ONE known GPU stack, so it
      # pins the floor.
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.target_sha }}
          # The ranking-quality gates read `.vault/` at a pinned historical
          # commit, which a shallow clone does not contain.
          fetch-depth: 0

      - name: Require the exact commit
        shell: pwsh
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: if ((git rev-parse HEAD) -ne $env:TARGET_SHA) { throw 'commit mismatch' }

      # The tier's service keeps its status and vector store in this job's
      # temporary directory, apart from any other installation of the product.
      - name: Keep the tier's service state in the job's temporary directory
        shell: pwsh
        run: |
          "VAULTSPEC_RAG_STATUS_DIR=$(Join-Path $env:RUNNER_TEMP 'vaultspec-rag-status')" >> $env:GITHUB_ENV
          "VAULTSPEC_RAG_QDRANT_STORAGE_DIR=$(Join-Path $env:RUNNER_TEMP 'vaultspec-rag-qdrant')" >> $env:GITHUB_ENV

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: false
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Provision the pinned Qdrant binary the GPU tier requires
        run: uv run --no-sync vaultspec-rag server qdrant install

      # The tier does not own the card, it BORROWS it: the coordinator captures
      # a live, health-verified, version-compatible resident service before
      # pytest isolates its managed paths, and refuses the whole tier when
      # there is none - every test deselected, nothing run. The service loads
      # the configured model stack as it comes up, so it needs a warm cache
      # first, or the daemon dies before it can report ready.
      - name: Warm the model cache the resident service loads
        run: just warm-models

      # Waiting on `running` rather than sleeping a fixed interval is what
      # makes this reliable while the model stack loads: a warming daemon has
      # no health identity for the coordinator to match.
      - name: Start the resident service the GPU tier borrows from
        id: resident
        shell: pwsh
        env:
          VAULTSPEC_RAG_TYPESAFE_API_KEY: ${{ secrets.VAULTSPEC_RAG_TYPESAFE_API_KEY }}
        run: |
          # Another installation of the product may hold the default service
          # and Qdrant ports. The coordinator and the stop step find this daemon
          # through its status file, so it binds whatever loopback ports are
          # free. Qdrant listens for gRPC one port below its HTTP port, so a
          # free gRPC port is reserved first and the port above it is claimed
          # for HTTP. Windows hands out ephemeral ports in sequence, so the
          # port below a fresh probe is usually one already held here, while
          # the port above it is usually free. Every probe stays bound until
          # all three ports are read, so none of them is handed out twice.
          $held = [System.Collections.Generic.List[System.Net.Sockets.TcpListener]]::new()
          try {
            $probe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
            $probe.Start()
            $held.Add($probe)
            $qdrantPort = $null
            for ($attempt = 0; $attempt -lt 20 -and -not $qdrantPort; $attempt++) {
              $grpc = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
              $grpc.Start()
              $held.Add($grpc)
              $candidate = $grpc.LocalEndpoint.Port + 1
              $http = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, $candidate)
              try {
                $http.Start()
                $held.Add($http)
                $qdrantPort = $candidate
              } catch [System.Net.Sockets.SocketException] {
                # The port above is taken; the held gRPC probe makes the next
                # draw a different port.
              }
            }
            if (-not $qdrantPort) { throw 'no free loopback port pair for Qdrant HTTP and gRPC' }
            $env:VAULTSPEC_RAG_PORT = "$($probe.LocalEndpoint.Port)"
            $env:VAULTSPEC_RAG_QDRANT_PORT = "$qdrantPort"
          } finally {
            foreach ($listener in $held) { $listener.Stop() }
          }
          uv run --no-sync vaultspec-rag server start --json
          $startExit = $LASTEXITCODE
          # A dead daemon says only `start_died` on stdout; the reason is in its
          # own log, so surface that here.
          if ($startExit -ne 0) {
            uv run --no-sync vaultspec-rag server logs --limit 80
            throw "server start failed with $startExit"
          }
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            $raw = uv run --no-sync vaultspec-rag server status --json
            # The operator state is nested under `data`; reading it off the
            # envelope root yields $null on every poll and times out silently.
            $status = ($raw | ConvertFrom-Json).data
            $state = $status.state
            Write-Host "service state: $state"
            if ($state -eq 'running') {
              # Every Typesafe state but `off` means the key enrolled; an absent
              # state means the payload moved, which must fail rather than pass.
              if ($status.health.features.typesafe.state -in @($null, 'off')) {
                throw 'The resident service lacks Typesafe enrollment; restart it with the CI secret.'
              }
              exit 0
            }
            Start-Sleep -Seconds 5
          }
          uv run --no-sync vaultspec-rag server logs --limit 80
          throw "the resident service never reported running; the GPU tier cannot borrow"

      - name: Run GPU test tier through guarded coordinator
        env:
          VAULTSPEC_RAG_TYPESAFE_API_KEY: ${{ secrets.VAULTSPEC_RAG_TYPESAFE_API_KEY }}
        run: just test-gpu

      # Always: a tier that failed mid-borrow still leaves this job's daemon
      # holding the GPU.
      - name: Stop the resident service
        if: always()
        shell: pwsh
        env:
          RESIDENT_START_OUTCOME: ${{ steps.resident.outcome }}
        run: |
          if ($env:RESIDENT_START_OUTCOME -notin @('success', 'failure', 'cancelled')) { exit 0 }
          uv run --no-sync vaultspec-rag server stop --json
