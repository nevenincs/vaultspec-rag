name: RAG Merge Gate

# EVERYTHING A CHANGE MUST PASS, AND WHEN IT PAYS FOR IT.
#
# This is the pull request's CI workflow and the only workflow whose verdict
# main requires. The cost follows the pull request's state:
#
# - A draft runs nothing. It is unfinished by declaration and cannot merge.
# - Opening, reopening or marking a pull request ready runs the full gate:
#   every gating dimension, both Linux interpreters, the full Windows suite
#   and the dependency audit.
# - A push to a ready pull request runs the light lint only, and the gate
#   passes on it. The full gate runs again on the commit that lands on main.
# - `ci:full` runs the full gate on demand, on a draft or on a ready head.
# - A push to main runs the full gate on the commit that landed. Release
#   Please refreshes the release proposal only after that run succeeds, so a
#   regression can reach main but never a release.
# - A dispatch runs the full gate unless it asks for `scope: light`, which is
#   how Release Please keeps its regenerated branch mergeable without
#   re-running suites main has already passed. The release cut calls this
#   workflow for the full gate on the exact head it is about to merge.
# - The weekly schedule runs only the dependency audit: main's tree was
#   measured when it landed, but an advisory can be published against an
#   unchanged lock at any time.
#
# WHY ONE REQUIRED CHECK HOLDS. Branch protection requires only
# `Check: Merge gate (Linux)` on the pull request's head commit.
#
# - Any label also starts this workflow, and a job skipped by its `if:` counts
#   as a PASSED required check. So the gate runs on every non-draft event: an
#   unrelated label can only preserve the newest verdict this commit already
#   earned, never mint one.
# - The gate skips on a draft. A draft cannot merge, and marking it ready runs
#   the full gate on the same head before it can.
# - A cancelled run still runs the gate (`always()`), which then fails. A
#   skipped gate there would read as a pass on a commit nothing measured.
#
# Branch protection also requires the branch to be up to date with main, so
# the tree that passed is the tree that merges.
#
# AND IT HOLDS FOR EVERYONE EXCEPT THE PERSON MERGING. The ruleset lists the
# Admin role as a bypass actor, and the only account with write access here
# holds that role, so the merge box offers an override on every one of these
# conditions. This gate is a discipline a maintainer keeps, not a wall that
# keeps them. Remove the bypass actor to make these enforced guarantees.
#
# Pull requests from forks are refused: re-open an outside change from a
# branch in this repository.
#
# ONLY TRUSTED AUTHORS REACH THE FLEET. A pull request runs its jobs on the
# self-hosted fleet only when its author is the owner or a collaborator, or
# once a user - never a bot - has applied `ci:full` to it, which takes triage
# rights. Everyone else, Dependabot included, runs nothing here until a
# collaborator has read the change, and the gate refuses the commit until
# then. A fork's pull request runs the fork's own copy of this file, so for
# forks these conditions only back up the repository's requirement that an
# outside contributor's runs be approved; for every other author they are the
# control itself.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: true
        type: string
      scope:
        description: "full: every gating job. light: the light lint only."
        required: false
        default: full
        type: string
  schedule:
    - cron: '47 5 * * 3'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate (defaults to the dispatched ref)
        required: false
        type: string
      scope:
        description: "full: every gating job. light: the light lint only."
        required: false
        default: full
        type: choice
        options:
          - full
          - light

permissions:
  contents: read

concurrency:
  # A new push supersedes the previous pull-request run. Label events use the
  # label in their group, so an unrelated label cannot cancel a full run.
  # Every run on main - a push, a call, a schedule - is grouped by its own
  # commit and never cancelled.
  group: merge-gate-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ github.event.label.name || github.event_name }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # NO_COLOR alone disables colour. A non-empty FORCE_COLOR (even "0") forces
  # the terminal ON under the force-color spec Rich implements, making
  # console.clear() emit escape codes into the piped CI log; without it
  # is_terminal falls through to isatty()->False as intended.
  NO_COLOR: "1"
  # Job conditions cannot read env, so their literals are checked against the
  # canon. Steps use this one value directly.
  FULL_RUN_LABEL: "ci:full"
  # No job here runs GPU work, so `just init` never installs the local
  # inference stack: torch and its CUDA runtime are several gigabytes that the
  # accelerator-free suite, the audit and the build never import. Tests that
  # need torch as a library carry the `torch` marker and run in the GPU tier.
  VAULTSPEC_INIT_GPU_STACK: "none"

jobs:
  lint:
    name: "Check: Full lint (Linux)"
    # Names the aggregate rather than listing its members: a dimension added
    # to the registry joins this job automatically. `check-all` keeps going
    # after a failure and reports every dimension, and its membership is data
    # in `dev/toolchain.py`, so this job and the gates cannot disagree about
    # what "everything" means.
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead. A call from another workflow
    # carries that workflow's event, a dispatch, and runs the full gate.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.scope != 'light') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' && github.event.label.name == 'ci:full' &&
         github.event.sender.type == 'User') ||
        (github.event.pull_request.draft == false &&
         (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR') &&
         (github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'ready_for_review'))))
    timeout-minutes: 160
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 40
      # The type checkers read torch's and the model libraries' annotations,
      # so this job installs those packages - but not the CUDA runtime, which
      # nothing here imports and which is most of the stack's size.
      VAULTSPEC_INIT_GPU_STACK: "types"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Restore frontend dependencies
        run: just init-monitor

      - name: Every gating dimension
        run: just check-all

  lint-light:
    name: "Check: Light lint (Linux)"
    # The push path of a ready pull request, and Release Please's regenerated
    # branch. It never runs beside the full lint: the two conditions exclude
    # each other, and the full lint's aggregate already contains every
    # dimension this one runs.
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'light') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.action == 'synchronize' &&
       github.event.pull_request.draft == false &&
       (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR'))
    timeout-minutes: 140
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Restore frontend dependencies
        run: just init-monitor

      - name: The light gating dimensions
        run: just check-light

  tests:
    name: "Test: Correctness suite (Linux, ${{ matrix.python-version }})"
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.scope != 'light') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' && github.event.label.name == 'ci:full' &&
         github.event.sender.type == 'User') ||
        (github.event.pull_request.draft == false &&
         (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR') &&
         (github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'ready_for_review'))))
    timeout-minutes: 165
    runs-on: [self-hosted, Linux, X64]
    strategy:
      # Both interpreters run to completion: when only one line breaks, the
      # failure is the whole signal, and cancelling the other hides whether
      # the break is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      CI_EXEC_BUDGET_MINUTES: 45
      # `.python-version` pins the dev interpreter to the floor, and uv reads
      # it in preference to whatever actions/setup-python put on PATH. Without
      # this the 3.14 leg would silently sync and test 3.13 — a green matrix
      # proving nothing.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          # setup-python's Linux 3.13 build depends on LD_LIBRARY_PATH. The
          # product deliberately removes loader variables from untrusted hook
          # children, so those children cannot safely inherit that interpreter.
          # uv's managed distributions remain executable under the same
          # curated environment that production uses.
          python-version: ${{ matrix.python-version }}

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Run tests
        run: just test-python

  # Windows GATES. A test that fails only on Windows is a defect on a
  # supported platform, and a failure reported without consequence ships
  # anyway. The full accelerator-free suite runs here: it already includes the
  # provisioning proofs, and running only their subset would let every other
  # Windows-specific path, lock and process behaviour land untested.
  #
  # uv fetches the interpreter named by UV_PYTHON, which is what the suite
  # runs under.
  tests-windows:
    name: "Test: Full suite (Windows)"
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.scope != 'light') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' && github.event.label.name == 'ci:full' &&
         github.event.sender.type == 'User') ||
        (github.event.pull_request.draft == false &&
         (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR') &&
         (github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'ready_for_review'))))
    timeout-minutes: 136
    runs-on: [self-hosted, Windows, X64]
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      # `init` is idempotent and stamped: the second call must be a sub-second
      # no-op, and `init-check` must agree the worktree is initialized. On
      # Windows that is a real assertion rather than a formality - the stamp
      # hashes paths, and a path comparison is where a Windows no-op most
      # often stops being one.
      - name: Initialization is idempotent
        run: just init

      - name: The worktree reports itself initialized
        run: just init-check

      - name: Run full test suite
        run: just test-python

  dependency-audit:
    name: "Check: Dependency advisories (Linux)"
    # Audits the lock that is about to land. The weekly run, which runs this
    # job alone, catches advisories published against a lock that has not
    # changed.
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.scope != 'light') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' && github.event.label.name == 'ci:full' &&
         github.event.sender.type == 'User') ||
        (github.event.pull_request.draft == false &&
         (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR') &&
         (github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'ready_for_review'))))
    timeout-minutes: 135
    runs-on: [self-hosted, Linux, X64]
    env:
      CI_EXEC_BUDGET_MINUTES: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Python dependency vulnerability audit
        run: just audit-deps

  gate:
    name: "Check: Merge gate (Linux)"
    needs: [lint, lint-light, tests, tests-windows, dependency-audit]
    # `always()`, never `!cancelled()`: see the header on why a skipped gate
    # would pass a commit nothing measured. Only a draft skips it, unless
    # `ci:full` was pressed on it.
    if: >-
      always() &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.draft == true &&
        !(github.event.action == 'labeled' && github.event.label.name == 'ci:full'))
    timeout-minutes: 125
    # Reads results and edits a label; it never checks out the pull request.
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: read
      # The unrelated-label path asks this workflow for its newest completed
      # run against the same commit. That matches how branch
      # protection evaluates the newest required check and cannot revive an
      # older green verdict after a newer red one.
      actions: read
      pull-requests: write
    env:
      CI_RESOURCE_CLASS: verdict
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      DRAFT: ${{ github.event.pull_request.draft }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      ASSOCIATION: ${{ github.event.pull_request.author_association }}
      LINT: ${{ needs.lint.result }}
      LIGHT: ${{ needs.lint-light.result }}
      TESTS: ${{ needs.tests.result }}
      WINDOWS: ${{ needs.tests-windows.result }}
      AUDIT: ${{ needs.dependency-audit.result }}
    steps:
      # Same-repository only: a fork's token cannot edit labels, so a
      # maintainer removes the label by hand there.
      - name: Release the ci:full label
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'ci:full' &&
          github.event.pull_request.head.repo.full_name == github.repository
        # A re-run, or a second gate racing this one, finds the label already
        # gone. That is the state this step exists to reach, so it passes; any
        # other failure leaves the label on and still fails here.
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$FULL_RUN_LABEL" --silent \
            || gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq 'any(.[]; .name == env.FULL_RUN_LABEL) | not' | grep -qx true

      - name: Every full check passed on this commit
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "pull_request" ] && [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            echo "::error::pull requests from forks are refused; re-open the change from a branch in this repository"
            exit 1
          fi
          echo "lint=${LINT} light=${LIGHT} linux=${TESTS} windows=${WINDOWS} audit=${AUDIT} draft=${DRAFT:-n/a}"
          # A measuring job that ran and did not pass fails the gate, whatever
          # path this event took.
          for job in "Check: Full lint (Linux)=${LINT}" \
                     "Check: Light lint (Linux)=${LIGHT}" \
                     "Test: Correctness suite (Linux)=${TESTS}" \
                     "Test: Full suite (Windows)=${WINDOWS}" \
                     "Check: Dependency advisories (Linux)=${AUDIT}"; do
            case "${job##*=}" in success | skipped) ;; *)
              echo "::error::${job%=*} ended '${job##*=}'"
              exit 1 ;;
            esac
          done
          full="${LINT} ${TESTS} ${WINDOWS} ${AUDIT}"
          if [ "${full}" = "success success success success" ]; then
            echo "every full check passed in this run"
            exit 0
          fi
          if [ "${LIGHT}" = "success" ] && [ "${full}" = "skipped skipped skipped skipped" ]; then
            echo "the light lint passed; the full gate runs on this change when it lands on main"
            exit 0
          fi
          if [ "${EVENT}" = "schedule" ] && [ "${AUDIT}" = "success" ]; then
            echo "the scheduled dependency audit passed"
            exit 0
          fi
          if [ "${EVENT}" != "pull_request" ] || [ "${LIGHT} ${full}" != "skipped skipped skipped skipped skipped" ]; then
            echo "::error::the checks this event requires did not all run (lint=${LINT} light=${LIGHT} linux=${TESTS} windows=${WINDOWS} audit=${AUDIT})"
            exit 1
          fi
          # An unrelated label can preserve only the newest completed verdict
          # earned by this exact commit. This run is still in progress, so
          # filtering to completed runs excludes it without comparing ids.
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')
          previous=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed")]
                  | sort_by(.id) | last | .conclusion // "none"')
          if [ "$previous" = "success" ]; then
            echo "the last run on $HEAD_SHA passed"
            exit 0
          fi
          # An untrusted author's commit ran nothing, so no earlier verdict can
          # exist unless a collaborator's full-run label proved it; refuse it
          # by name.
          case "${ASSOCIATION}" in OWNER | COLLABORATOR) ;; *)
            echo "::error::pull requests by ${AUTHOR} (${ASSOCIATION}) run nothing on the self-hosted fleet; a collaborator reviews the change and applies $FULL_RUN_LABEL to run it"
            exit 1 ;;
          esac
          if [ "$previous" = "none" ]; then
            echo "::error::nothing has measured $HEAD_SHA yet; push to it, mark the pull request ready for review, or add $FULL_RUN_LABEL"
          else
            echo "::error::the last run on $HEAD_SHA ended in $previous; push a fix, or add $FULL_RUN_LABEL to run the full gate again"
          fi
          exit 1
