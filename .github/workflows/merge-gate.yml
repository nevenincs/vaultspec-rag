name: RAG Merge Gate

# EVERYTHING A CHANGE MUST PASS BEFORE IT REACHES MAIN, RUN ON REQUEST.
#
# `ci.yml` answers the cheap questions on every push to a pull request. This
# workflow runs every gating dimension, both Linux interpreters, the full
# Windows suite and the dependency audit - but only when a maintainer adds the
# `ci:full` label, never because of a push. The gate job removes the label
# again, so adding it is a button that can be pressed more than once.
#
# WHY ONE REQUIRED CHECK HOLDS. Branch protection requires only
# `Check: Merge gate (Linux)` on the pull request's head commit.
#
# - A push creates a new head commit and does NOT start this workflow, so the
#   new commit has no gate result and the merge stays blocked until the label
#   is added again.
# - Any label starts this workflow, and a job skipped by its `if:` counts as a
#   PASSED required check. So the gate never skips: it always runs, passes a
#   `ci:full` run only when every job it needs succeeded, and passes any other
#   label only when THE LATEST earlier run of this workflow against the same
#   commit passed.
# - A cancelled run still runs the gate (`always()`), which then fails. A
#   skipped gate there would read as a pass on a commit nothing measured.
#
# Branch protection also requires the branch to be up to date with main, so
# the tree that passed is the tree that merges. The tree, and not the
# environment: these runners are persistent and their caches outlive any one
# run, so "measured" is a claim about the source, not about the machine.
#
# AND IT HOLDS FOR EVERYONE EXCEPT THE PERSON MERGING. The ruleset lists the
# Admin role as a bypass actor, and the only account with write access here
# holds that role, so the merge box offers an override on every one of these
# conditions. This gate is a discipline a maintainer keeps, not a wall that
# keeps them. Read every guarantee above with that clause attached; remove
# the bypass actor and they become guarantees.
#
# A push to main triggers nothing: the tree that lands was measured here
# first. The weekly schedule reruns everything on main, which is what catches
# advisories published against an unchanged lock.
#
# THE TRUST QUESTION, AND WHERE ITS ANSWER ACTUALLY LIVES. A `pull_request`
# run from a fork executes the FORK's copy of this file, on this repository's
# runners. Every refusal written below - the same-repo clause on each
# measuring job, the gate's own fork branch - therefore sits in a file the
# fork rewrites before the run starts, and none of them contains a fork.
#
# What contains a fork is a repository setting rather than a file: Actions
# requires approval for workflow runs from ALL external contributors, so
# nothing starts until a maintainer approves it. The clauses below are still
# load-bearing, because they keep THIS repository's copy from drifting into
# running a pull request's head on the fleet, and they are what the guards
# assert - but they are depth behind that setting, not the boundary.
#
# One consequence, stated plainly because it looks like a courtesy: approving
# a fork's run so its author can see their CI also lets that run execute their
# code on the fleet and report under this workflow's check names. Re-open an
# outside change from a branch in this repository instead.
on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: '47 5 * * 3'
  workflow_dispatch:
    inputs:
      cache_mode:
        description: "Runner-local cache namespace"
        type: choice
        default: normal
        options:
          - normal
          - isolated

permissions:
  contents: read

concurrency:
  # The label is in the group so that adding an unrelated label never cancels
  # a full run in flight.
  group: merge-gate-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # NO_COLOR alone disables colour. A non-empty FORCE_COLOR (even "0") forces
  # the terminal ON under the force-color spec Rich implements, making
  # console.clear() emit escape codes into the piped CI log; without it
  # is_terminal falls through to isatty()->False as intended.
  NO_COLOR: "1"
  CI_CACHE_MODE: ${{ inputs.cache_mode || 'normal' }}
  # The button, spelled once for every step that reads it. A job-level `if:`
  # gets no `env` context and Actions honours no YAML anchor, so each measuring
  # job below has to spell the label out again; the guards assert all four
  # agree with this one and with `dev.ci_names.FULL_RUN_LABEL`.
  FULL_RUN_LABEL: "ci:full"

# Every self-hosted runner is persistent, and `contain-writes` points
# `UV_CACHE_DIR` at storage owned by that runner. setup-uv's Actions cache would
# archive that same multi-gigabyte directory after every job and download it
# again before the next one. Each setup therefore keeps Actions caching
# explicitly disabled; uv still reads and populates the runner cache normally.

jobs:
  lint:
    name: "Check: Full lint (Linux)"
    # Names the aggregate rather than listing its members: a dimension added
    # to the registry joins this job automatically. `check-all` keeps going
    # after a failure and reports every dimension, and its membership is data
    # in `dev/toolchain.py`, so this job and the gates cannot disagree about
    # what "everything" means.
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'ci:full' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 40
    runs-on: [self-hosted, Linux, X64, build]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Every gating dimension
        run: just check-all

  tests:
    name: "Test: Correctness suite (Linux, ${{ matrix.python-version }})"
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'ci:full' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 45
    runs-on: [self-hosted, Linux, X64]
    strategy:
      # Both interpreters run to completion: when only one line breaks, the
      # failure is the whole signal, and cancelling the other hides whether
      # the break is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      # `.python-version` pins the dev interpreter to the floor, and uv reads
      # it in preference to whatever actions/setup-python put on PATH. Without
      # this the 3.14 leg would silently sync and test 3.13 — a green matrix
      # proving nothing.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          # setup-python's Linux 3.13 build depends on LD_LIBRARY_PATH. The
          # product deliberately removes loader variables from untrusted hook
          # children, so those children cannot safely inherit that interpreter.
          # uv's managed distributions remain executable under the same
          # curated environment that production uses.
          python-version: ${{ matrix.python-version }}

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Run tests
        run: just test-python

  # Windows GATES. A test that fails only on Windows is a defect on a
  # supported platform, and a failure reported without consequence ships
  # anyway. The full accelerator-free suite runs here: it already includes the
  # provisioning proofs, and running only their subset would let every other
  # Windows-specific path, lock and process behaviour land untested.
  #
  # No actions/setup-python: its MSI registry cleanup fails under a runner
  # service account. uv fetches the interpreter named by UV_PYTHON instead,
  # which is what the suite runs under anyway.
  tests-windows:
    name: "Test: Full suite (Windows)"
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'ci:full' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 60
    runs-on: [self-hosted, Windows, X64]
    env:
      UV_PYTHON: "3.13"
      # This runner's agent is a Windows service, so its account is SYSTEM and
      # every user-scoped path resolves inside
      # C:\WINDOWS\system32\config\systemprofile - the operating system's own
      # directory. Left alone, the suite's temp roots, the model cache, and the
      # managed service state are all written into the OS install by a process
      # holding administrative rights. Each one is pinned to runner-owned
      # storage instead. TMP and TEMP cover Python's tempfile, which is where
      # the pytest session roots are created.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      # Same pinned, checksum-verified download the GPU tier in ci.yml uses: this
      # runner's service account has no bash on PATH, so the marketplace
      # action's shell is unavailable.
      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      # `init` is idempotent and stamped: the second call must be a sub-second
      # no-op, and `init-check` must agree the worktree is initialized. On
      # Windows that is a real assertion rather than a formality - the stamp
      # hashes paths, and a path comparison is where a Windows no-op most
      # often stops being one.
      #
      # These two used to be a job of their own, alongside this one, on the
      # single Windows machine the whole account queues behind. A second job
      # buys parallelism on a hosted fleet; here it bought a second place in
      # that queue, a second checkout and a second `init` - for two assertions
      # that cost seconds once the worktree this job already builds exists.
      - name: Initialization is idempotent
        run: just init

      - name: The worktree reports itself initialized
        run: just init-check

      - name: Run full test suite
        run: just test-python

  dependency-audit:
    name: "Check: Dependency advisories (Linux)"
    # Audits the lock that is about to land. The weekly run catches
    # advisories published against a lock that has not changed.
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'ci:full' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 15
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Python dependency vulnerability audit
        run: just audit-deps

  gate:
    name: "Check: Merge gate (Linux)"
    needs: [lint, tests, tests-windows, dependency-audit]
    # `always()`, never `!cancelled()`: see the header on why a skipped gate
    # would pass a commit nothing measured.
    if: always()
    timeout-minutes: 10
    # Reads results and edits a label, and never runs the pull request's
    # code, so a hosted runner serves every pull request.
    runs-on: ubuntu-24.04
    permissions:
      # `actions: read` is what lets the verdict below ask this workflow for
      # its own earlier runs against the same commit, which is how it answers
      # without naming a check by string.
      actions: read
      pull-requests: write
    steps:
      # Same-repository only: a fork's token cannot edit labels, so a
      # maintainer removes the label by hand there.
      - name: Release the full-run label
        if: >-
          github.event.label.name == 'ci:full' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # A re-run, or a second gate racing this one, finds the label already
        # gone. That is the state this step exists to reach, so it passes; any
        # other failure leaves the label on and still fails here.
        #
        # The label reaches both calls from the workflow's `env`: as a path
        # segment, where a literal colon is a legal `pchar` and needs no
        # encoding, and as `env` inside the filter, so its name is never
        # interpolated into a jq program.
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$FULL_RUN_LABEL" --silent \
            || gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq 'any(.[]; .name == env.FULL_RUN_LABEL) | not' | grep -qx true

      - name: Every full check passed on this commit
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${FORK}" = "true" ]; then
            echo "::error::pull requests from forks are refused; re-open the change from a branch in this repository"
            exit 1
          fi
          ran=$(jq '[.[] | select(.result != "skipped")] | length' <<<"$RESULTS")
          if [ "$ran" -gt 0 ]; then
            failed=$(jq -r 'to_entries | map(select(.value.result != "success") | "\(.key)=\(.value.result)") | join(", ")' <<<"$RESULTS")
            if [ -n "$failed" ]; then
              echo "::error::full checks did not pass: $failed"
              exit 1
            fi
            echo "every full check passed in this run"
            exit 0
          fi
          # Nothing ran, so a label other than the button started this run, and
          # it may pass only on the strength of an earlier run against the same
          # tree. That question is asked of THE LATEST earlier run, never of
          # "any earlier success". Branch protection reads the newest check of
          # a name, so a run that measured this commit and failed is what the
          # merge box is showing; counting any success ever would let any
          # label at all turn that red back into green.
          #
          # Asked of this workflow's own runs rather than of a check by name,
          # so the gate's name is written once, in `name:` above, and renaming
          # it cannot leave a query hunting for a check nobody reports.
          #
          # `completed` is also what excludes THIS run: the run a job is
          # running in cannot have completed, so no run id has to be compared
          # and no value is interpolated into the filter.
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')
          previous=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.status == "completed")]
                  | sort_by(.id) | last | .conclusion // "none"')
          if [ "$previous" = "success" ]; then
            echo "the last full run on $SHA passed"
            exit 0
          fi
          if [ "$previous" = "none" ]; then
            echo "::error::no full run has measured $SHA; add the $FULL_RUN_LABEL label"
          else
            echo "::error::the last full run on $SHA was a $previous; add the $FULL_RUN_LABEL label to measure it again"
          fi
          exit 1
