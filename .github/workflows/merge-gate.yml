name: RAG Merge Gate

# Trusted ready PRs run every measuring job on each head. Drafts run nothing
# unless their trusted author requests ci:full. A label never admits an
# external author or a fork. The withheld job has a different name because
# GitHub treats a skipped required check as successful.
# Main pushes, reusable calls and dispatches require full proof; the weekly
# audit checks newly published advisories against the unchanged lock.
# The aggregate also requires the canonical Dev Server verdict on the same SHA.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to validate
        required: true
        type: string
  schedule:
    - cron: "47 5 * * 3"
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA to validate (defaults to the dispatched commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A new push supersedes the previous pull-request run. Label events use the
  # label in their group, so an unrelated label cannot cancel a full run.
  # Every run on main - a push, a call, a schedule - is grouped by its own
  # commit and never cancelled.
  group: merge-gate-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ github.event.label.name || github.event_name }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # NO_COLOR alone disables colour. A non-empty FORCE_COLOR (even "0") forces
  # the terminal ON under the force-color spec Rich implements, making
  # console.clear() emit escape codes into the piped CI log; without it
  # is_terminal falls through to isatty()->False as intended.
  NO_COLOR: "1"
  # Job conditions cannot read env, so their literals are checked against the
  # canon. Steps use this one value directly.
  FULL_RUN_LABEL: "ci:full"
  # No job here runs GPU work, so `just init` never installs the local
  # inference stack: torch and its CUDA runtime are several gigabytes that the
  # accelerator-free suite, the audit and the build never import. Tests that
  # need torch as a library carry the `torch` marker and run in the GPU tier.
  VAULTSPEC_INIT_GPU_STACK: "none"

jobs:
  lint:
    name: "Check: Full lint (Linux)"
    # Names the aggregate rather than listing its members: a dimension added
    # to the registry joins this job automatically. `check-all` keeps going
    # after a failure and reports every dimension, and its membership is data
    # in `dev/toolchain.py`, so this job and the gates cannot disagree about
    # what "everything" means.
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead. A call from another workflow
    # carries that workflow's event, a dispatch, and runs the full gate.
    if: &full_gate >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR') &&
       ((github.event.action == 'labeled' && github.event.label.name == 'ci:full' &&
         github.event.sender.type == 'User') ||
        (github.event.pull_request.draft == false &&
         (github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'synchronize' ||
          github.event.action == 'ready_for_review'))))
    timeout-minutes: 160
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 40
      # The type checkers read torch's and the model libraries' annotations,
      # so this job installs those packages - but not the CUDA runtime, which
      # nothing here imports and which is most of the stack's size.
      VAULTSPEC_INIT_GPU_STACK: "types"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: false
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Restore frontend dependencies
        run: npm ci

      - name: Every gating dimension
        run: just check-all

  tests:
    name: "Test: Correctness suite (Linux, ${{ matrix.python-version }})"
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead.
    if: *full_gate
    timeout-minutes: 165
    runs-on: [self-hosted, Linux, X64]
    strategy:
      # Both interpreters run to completion: when only one line breaks, the
      # failure is the whole signal, and cancelling the other hides whether
      # the break is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      CI_EXEC_BUDGET_MINUTES: 45
      # `.python-version` pins the dev interpreter to the floor, and uv reads
      # it in preference to whatever actions/setup-python put on PATH. Without
      # this the 3.14 leg would silently sync and test 3.13 — a green matrix
      # proving nothing.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: false
          enable-cache: false
          # setup-python's Linux 3.13 build depends on LD_LIBRARY_PATH. The
          # product deliberately removes loader variables from untrusted hook
          # children, so those children cannot safely inherit that interpreter.
          # uv's managed distributions remain executable under the same
          # curated environment that production uses.
          python-version: ${{ matrix.python-version }}

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Set up Node for local monitor route tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Restore monitor dependencies for installed-browser checks
        run: npm ci

      - name: Build and install the monitor the lifecycle tests run
        run: just build-monitor

      # Four workers. The store-heavy tests carry deadlines of
      # their own, and on the slower Linux runner, with one worker per core,
      # several of them ran at or past those deadlines and a different one
      # failed from run to run. Measured there, this bound takes a third to a
      # half off all of them but the slowest, which it leaves where it was,
      # and adds about six minutes to the job.
      #
      # Set HERE, on the step. The runner's admission hook exports its own
      # value for this variable, one worker per CPU it admitted, after the
      # job's `env:` is read, and that export wins over a job-level value.
      - name: Run tests
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
        run: just test-python

  # Windows GATES. A test that fails only on Windows is a defect on a
  # supported platform, and a failure reported without consequence ships
  # anyway. The full accelerator-free suite runs here: it already includes the
  # provisioning proofs, and running only their subset would let every other
  # Windows-specific path, lock and process behaviour land untested.
  # Each correctness job gets a fresh VM and its own TCP port pool. Sharing
  # the developer workstation lets unrelated applications exhaust the pool
  # while browser tests are using loopback, even with CPU headroom reserved.
  #
  # uv fetches the interpreter named by UV_PYTHON, which is what the suite
  # runs under.
  tests-windows:
    name: "Test: Full suite (Windows)"
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead.
    if: *full_gate
    timeout-minutes: 136
    runs-on: windows-2025
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: false
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      # `init` is idempotent and stamped: the second call must be a sub-second
      # no-op, and `init-check` must agree the worktree is initialized. On
      # Windows that is a real assertion rather than a formality - the stamp
      # hashes paths, and a path comparison is where a Windows no-op most
      # often stops being one.
      - name: Initialization is idempotent
        run: just init

      - name: The worktree reports itself initialized
        run: just init-check

      - name: Set up Node for local monitor route tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          package-manager-cache: false
          node-version-file: .nvmrc

      - name: Restore monitor dependencies for installed-browser checks
        run: npm ci

      - name: Build and install the monitor the lifecycle tests run
        run: just build-monitor

      # Two workers on the four-CPU VM leave scheduling capacity for native
      # monitors, browsers and owner-witness children alongside pytest.
      - name: Run full test suite
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: just test-python

  dependency-audit:
    name: "Check: Dependency advisories (Linux)"
    # Audits the lock that is about to land. The weekly run, which runs this
    # job alone, catches advisories published against a lock that has not
    # changed.
    # A fork's pull request never runs here: the workflow it would run is the
    # fork's own. The gate refuses it instead.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR') &&
       ((github.event.action == 'labeled' && github.event.label.name == 'ci:full' &&
         github.event.sender.type == 'User') ||
        (github.event.pull_request.draft == false &&
         (github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'synchronize' ||
          github.event.action == 'ready_for_review'))))
    timeout-minutes: 135
    runs-on: [self-hosted, Linux, X64]
    env:
      CI_EXEC_BUDGET_MINUTES: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: false
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Python dependency vulnerability audit
        run: just audit-deps

  code-scanning:
    name: "Check: Code scanning (Linux, ${{ matrix.language }})"
    if: *full_gate
    runs-on: [self-hosted, Linux, X64, build]
    timeout-minutes: 150
    env:
      CI_EXEC_BUDGET_MINUTES: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Initialize code scanning
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze code
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:${{ matrix.language }}

  gate:
    # A skipped untrusted job must never report the required merge context.
    name: >-
      ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || (github.event.pull_request.author_association != 'OWNER' && github.event.pull_request.author_association != 'COLLABORATOR')) && 'Admission withheld (Linux)' || 'Check: Merge gate (Linux)' }}
    needs: [lint, tests, tests-windows, dependency-audit, code-scanning]
    # `always()`, never `!cancelled()`: see the header on why a skipped gate
    # would pass a commit nothing measured. Only a draft skips it, unless
    # `ci:full` was pressed on it.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'COLLABORATOR'))) &&
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.draft == true &&
        !(github.event.action == 'labeled' && github.event.label.name == 'ci:full'))
    timeout-minutes: 125
    # Reads results and edits a label; it never checks out the pull request.
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: read
      # The unrelated-label path asks this workflow for its newest completed
      # run against the same commit. That matches how branch
      # protection evaluates the newest required check and cannot revive an
      # older green verdict after a newer red one.
      actions: write
      pull-requests: write
      # Records a dispatched or called verdict on the commit it measured.
      statuses: write
    env:
      CI_RESOURCE_CLASS: verdict
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      DRAFT: ${{ github.event.pull_request.draft }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      LINT: ${{ needs.lint.result }}
      TESTS: ${{ needs.tests.result }}
      WINDOWS: ${{ needs.tests-windows.result }}
      AUDIT: ${{ needs.dependency-audit.result }}
      SCANNING: ${{ needs.code-scanning.result }}
    steps:
      # Same-repository only: a fork's token cannot edit labels, so a
      # maintainer removes the label by hand there.
      - name: Release the ci:full label
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'ci:full' &&
          github.event.pull_request.head.repo.full_name == github.repository
        # A re-run, or a second gate racing this one, finds the label already
        # gone. That is the state this step exists to reach, so it passes; any
        # other failure leaves the label on and still fails here.
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$FULL_RUN_LABEL" --silent \
            || gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq 'any(.[]; .name == env.FULL_RUN_LABEL) | not' | grep -qx true

      - name: Require the release dev server proof on this exact commit
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          PROOF_SHA: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}
          PROOF_EVENT: ${{ github.event_name == 'push' && 'push' || github.event_name == 'pull_request' && 'pull_request' || 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # Every measuring job checks out inputs.ref. A branch or tag name can
          # move between those checkouts and this query, so only a commit SHA
          # ties the proof to the code that was measured.
          if ! [[ "$PROOF_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref '$PROOF_SHA' is not a full commit SHA; dispatch the gate with the exact commit to prove"
            exit 1
          fi
          # The check runs separately on the canonical workflow's runner.
          # Poll only its newest run on this SHA, and never reuse an older green.
          for _ in $(seq 1 180); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/devserver.yml/runs?event=$PROOF_EVENT&head_sha=$PROOF_SHA&per_page=100" \
              --jq '.workflow_runs | sort_by(.id) | last | "\(.status // "missing") \(.conclusion // "none")"')
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "::error::Dev Server for $PROOF_SHA ended $state"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Dev Server did not prove $PROOF_SHA within thirty minutes"
          exit 1

      - name: Every full check passed on this commit
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "pull_request" ] && [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            echo "::error::pull requests from forks are refused; re-open the change from a branch in this repository"
            exit 1
          fi
          echo "lint=${LINT} linux=${TESTS} windows=${WINDOWS} audit=${AUDIT} scanning=${SCANNING} draft=${DRAFT:-n/a}"
          # A measuring job that ran and did not pass fails the gate, whatever
          # path this event took.
          for job in "Check: Full lint (Linux)=${LINT}" \
                     "Test: Correctness suite (Linux)=${TESTS}" \
                     "Test: Full suite (Windows)=${WINDOWS}" \
                     "Check: Dependency advisories (Linux)=${AUDIT}" \
                     "Check: Code scanning (Linux)=${SCANNING}"; do
            case "${job##*=}" in success | skipped) ;; *)
              echo "::error::${job%=*} ended '${job##*=}'"
              exit 1 ;;
            esac
          done
          require_full_run() {
            local jobs
            jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$1/jobs?filter=all&per_page=100" \
              --jq '.jobs[] | select(.name == "Check: Full lint (Linux)" or .name == "Test: Correctness suite (Linux, 3.13)" or .name == "Test: Correctness suite (Linux, 3.14)" or .name == "Test: Full suite (Windows)" or .name == "Check: Dependency advisories (Linux)" or .name == "Check: Code scanning (Linux, actions)" or .name == "Check: Code scanning (Linux, javascript-typescript)" or .name == "Check: Code scanning (Linux, python)") | [.name, .run_attempt, .id, .conclusion] | @tsv') || return 1
            # Combine every page, with the newest attempt first for each name.
            printf '%s\n' "$jobs" | sort -t $'\t' -k1,1 -k2,2nr -k3,3nr | \
              awk -F '\t' '!seen[$1]++ { count++; if ($4 != "skipped") measured=1; if ($4 != "success") failed=1 } END { if (count && !measured) exit 2; exit(failed || count != 8) }'
          }
          full="${LINT} ${TESTS} ${WINDOWS} ${AUDIT} ${SCANNING}"
          if [ "${full}" = "success success success success success" ]; then
            echo "every full check passed in this run"
            exit 0
          fi
          if [ "${EVENT}" = "schedule" ] && [ "${AUDIT}" = "success" ]; then
            echo "the scheduled dependency audit passed"
            exit 0
          fi
          if [ "${EVENT}" != "pull_request" ] || [ "${full}" != "skipped skipped skipped skipped skipped" ]; then
            echo "::error::the checks this event requires did not all run (lint=${LINT} linux=${TESTS} windows=${WINDOWS} audit=${AUDIT} scanning=${SCANNING})"
            exit 1
          fi
          # An unrelated label can preserve only the newest completed verdict
          # earned by this exact commit. This run is still in progress, so
          # filtering to completed runs excludes it without comparing ids.
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')
          previous_runs=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$HEAD_SHA&status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.id, .conclusion] | @tsv')
          # Preservation-only successes carry the earlier proof forward. Stop
          # at any intervening failure, cancellation or invalid measured run.
          while IFS=$'\t' read -r run previous; do
            [ -n "$run" ] || continue
            if [ "$previous" != "success" ]; then
              echo "::error::the last proof chain on $HEAD_SHA ended in $previous; run the full gate again"
              exit 1
            fi
            if require_full_run "$run"; then
              echo "the last full run on $HEAD_SHA passed"
              exit 0
            else
              proof=$?
            fi
            if [ "$proof" -ne 2 ]; then
              echo "::error::run $run lacks complete measured proof on $HEAD_SHA"
              exit 1
            fi
          done < <(printf '%s\n' "$previous_runs" | sort -t $'\t' -k1,1nr)
          echo "::error::nothing has fully measured $HEAD_SHA; push to it, mark it ready, or add $FULL_RUN_LABEL"
          exit 1

      # GitHub attaches a dispatched or called run's checks to no pull request,
      # so a pull request whose own events measure nothing - the release
      # proposal Release Please opens with the workflow token - would wait on
      # the required context forever. The verdict this run reached on the
      # commit it measured is also recorded as a commit status under that
      # context, which every pull request whose head is this commit reads. A
      # failed or cancelled run records a failure, never a pass.
      - name: Record the verdict on the measured commit
        if: always() && (github.event_name == 'workflow_dispatch' || inputs.ref != '')
        env:
          PROOF_SHA: ${{ inputs.ref || github.sha }}
          VERDICT: ${{ job.status }}
          # The required context; a guard holds it equal to this job's name.
          REQUIRED_CONTEXT: "Check: Merge gate (Linux)"
        run: |
          set -euo pipefail
          if ! [[ "$PROOF_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref '$PROOF_SHA' is not a full commit SHA; no verdict is recorded"
            exit 1
          fi
          state=failure
          if [ "$VERDICT" = "success" ]; then
            state=success
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PROOF_SHA" \
            -f state="$state" \
            -f context="$REQUIRED_CONTEXT" \
            -f description="Full merge gate ${state} on this commit" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
          echo "recorded ${state} for $PROOF_SHA"
