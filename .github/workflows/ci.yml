name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # NO_COLOR alone disables colour. A non-empty FORCE_COLOR (even "0") forces
  # the terminal ON under the force-color spec Rich implements, making
  # console.clear() emit escape codes into the piped CI log; without it
  # is_terminal falls through to isatty()->False as intended.
  NO_COLOR: "1"

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  lint-and-type:
    name: Lint, Type, Config, Link, and Markdown Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just dev deps sync

      - name: Ruff
        run: just dev lint python

      - name: Ty
        run: just dev lint type

      - name: Taplo
        run: just dev lint toml

      - name: Lychee
        run: just dev lint links

      - name: Markdown
        run: just dev lint markdown

      - name: Docs version guard
        run: just dev lint docs-version

      # Gating: fails CI if tracked source cites a development record (plan/Step
      # coordinate, dated vault stem) in a comment or docstring, or hardcodes a
      # workstation-identity path (worktree root, user home). Generic absolute
      # paths are reported as smells but do not fail.
      - name: Citations
        run: just dev lint citations

      # Baseline-calibrated gate: thresholds sit at today's worst offender
      # (cognitive<=20, xenon absolute/modules<=C, average<=A) so this stays
      # green until the remediation campaign ratchets them down.
      - name: Complexity gate
        run: just dev lint complexity

      # Report-only signal (always exit 0): module LOC is baseline data for a
      # future ratchet, not a gate.
      - name: Module length (report-only)
        run: just dev lint module-length

      # Gating: basedpyright strict reached zero on 2026-06-10, so this now
      # fails CI on any new strict-type error.
      - name: Strict types
        run: just dev lint type-strict

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just dev deps sync

      - name: Run tests
        run: just dev test python

  gpu-tests:
    name: GPU Tests
    # The complement of the hosted "Tests" job: the integration, quality,
    # performance, robustness, subprocess_gpu, and cuda markers that a
    # GPU-less hosted runner cannot execute. This is where the real GPU tier
    # actually runs instead of being deselected.
    #
    # SECURITY (public repo, self-hosted runner on a real workstation): fork
    # pull requests must never execute here — arbitrary PR code on a
    # self-hosted runner is remote code execution on the host and can
    # exfiltrate the secrets this job needs. The guard admits only trusted
    # events: pushes to a branch and manual dispatch (both require write
    # access), plus same-repo (non-fork) pull requests. A fork PR carries a
    # head repository different from the base and is refused here; it still
    # runs every hosted tier above, with no secrets. Pair this with the repo
    # setting "Require approval for all outside collaborators" so a fork PR
    # cannot even start a workflow run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, gpu, cuda]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Pin 3.13 to match the rest of CI: requires-python admits newer
      # interpreters, and letting uv auto-select grabs 3.14, whose native
      # extension wheels crash this GPU stack on import.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Install `just` without the bash-based marketplace action: this runner's
      # service account has no `bash` on PATH, so a pinned, SHA256-verified
      # download driven by PowerShell is the portable path.
      - name: Install just
        shell: pwsh
        run: |
          $ver = "1.57.0"
          $sha = "4c7391d17cb1d17b758b52004ee6411372b8a13ff37c3c9b9031625cb6026e09"
          $zip = "$env:RUNNER_TEMP\just-$ver.zip"
          $dest = "$env:RUNNER_TEMP\just-$ver"
          $url = "https://github.com/casey/just/releases/download/$ver/just-$ver-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha) { throw "just checksum mismatch: got $actual" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dest

      - name: Install dependencies
        run: just dev deps sync

      - name: Verify CUDA is visible to the runner
        run: uv run --no-sync python -c "import torch; assert torch.cuda.is_available(), 'CUDA unavailable on GPU runner'; print(torch.cuda.get_device_name(0))"

      - name: Provision Qdrant server binary
        run: uv run --no-sync vaultspec-rag server qdrant install

      - name: Run GPU test tier
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: just dev test gpu

  vault-audit:
    name: Vault Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just dev deps sync

      - name: Verify vault structure and links
        run: uv run vaultspec-core vault check all

  dependency-audit:
    name: Dependency Audit (uv audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just dev deps sync

      - name: Python dependency vulnerability audit
        run: just dev audit deps
