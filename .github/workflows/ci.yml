name: CI

# THE CHEAP LANE AND THE HARDWARE TIERS. Nothing here gates a merge.
#
# - `pull_request`: style and types only, on every push to a branch under
#   review. It answers the cheap questions fast and nothing else.
# - `schedule` / `workflow_dispatch`: the hardware tiers that cannot gate a
#   merge (macOS, CUDA).
#
# Everything a change must pass before it lands - every gating dimension, the
# full Linux matrix, the full Windows suite and the dependency audit - lives
# in `merge-gate.yml` and runs when a maintainer asks for it. A push to main
# triggers nothing here: that tree was measured before it merged.
#
# CONCURRENCY, AND WHY THE COMMIT IS IN THE GROUP ON MAIN. `cancel-in-progress:
# false` governs runs that have STARTED. GitHub separately cancels a
# previously PENDING run in the same group, and offers no switch for it. On a
# saturated serial fleet a run sits pending for a long time, so a scheduled
# run and a dispatch against main would otherwise cancel each other and
# report `cancelled` rather than `failed`. Putting the commit in the group, on
# main only, gives every main commit its own group; pull requests keep
# superseding their own earlier runs.
#
# The rule and its guards live in `dev/guards/`:
# `test_ci_no_repeated_work.py` expands every recipe to the commands it
# finally runs and fails when one appears in two jobs of the same run;
# `test_ci_jobs_reach_a_verdict.py` holds the ceilings and the groups above.
#
# THE TRUST QUESTION. This repository is PUBLIC, and a `pull_request` from a
# fork runs code the author of the pull request controls. Admitting that code
# to the self-hosted fleet hands a stranger execution on this hardware, so a
# fork's pull request runs on GitHub-hosted isolation instead. The hardware
# tiers are unreachable from any pull request.
on:
  pull_request:
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:
    inputs:
      # The two tiers that cannot simply run on a schedule: the GPU tier is
      # expensive and contends for the single card with a live service, and
      # the macOS tier targets a laptop that is deliberately out of the fleet
      # on battery. Both are opt-in per dispatch, so exercising one never
      # forces the other - before this, any manual run paid for the GPU tier
      # whether or not that was the point of the run.
      tier:
        description: "Tier to run"
        type: choice
        default: macos
        options:
          - macos
          - gpu
          - macos-and-gpu
      cache_mode:
        description: "Runner-local cache namespace"
        type: choice
        default: normal
        options:
          - normal
          - isolated

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # NO_COLOR alone disables colour. A non-empty FORCE_COLOR (even "0") forces
  # the terminal ON under the force-color spec Rich implements, making
  # console.clear() emit escape codes into the piped CI log; without it
  # is_terminal falls through to isatty()->False as intended.
  NO_COLOR: "1"
  CI_CACHE_MODE: ${{ inputs.cache_mode || 'normal' }}

# Every runner in this workflow is persistent, and `contain-writes` points
# `UV_CACHE_DIR` at storage owned by that runner. setup-uv's Actions cache would
# archive that same multi-gigabyte directory after every job and download it
# again before the next one, making the remote cache slower than the warm local
# cache it duplicates. Each setup therefore keeps Actions caching explicitly
# disabled; uv still reads and populates the persistent runner cache normally.

jobs:
  lint:
    name: "Lint: Static Validation (Linux)"
    # Only the two cheapest dimensions, on purpose: every push pays for this
    # job. `merge-gate.yml` runs the aggregate, which contains both.
    #
    # release-please updates pyproject.toml before its own follow-up commit
    # refreshes uv.lock on the release branch. That one-commit head is
    # transient, and running `just init` there only proves the repair has not
    # landed yet. Wait for the second commit, then run the usual gates.
    if: >-
      github.event_name == 'pull_request' &&
      (!startsWith(github.head_ref, 'release-please--') ||
       github.event.pull_request.commits > 1)
    timeout-minutes: 40
    # Same-repository work uses the persistent fleet. A fork runs on
    # GitHub-hosted isolation where its workflow cannot reach fleet state or
    # credentials.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","build"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Style
        run: just check-python

      - name: Types
        run: just check-type

  # macOS is ADVISORY, through `continue-on-error` on its test step. It has
  # never been fully triaged, and it runs only on schedule and dispatch, so it
  # is never a pull request's verdict. It flips to gating by deleting that
  # flag once its failure count reaches zero. Ratchet down, never up.
  #
  # THAT STATUS IS NOT IN THE NAME, and the omission is deliberate. A job name
  # says what is COVERED; whether a row can fail a merge is a property of the
  # merge rules, not of the coverage.
  tests-macos:
    name: "Test: Full Suite and Accelerator Backend (macOS)"
    # Scheduled diagnostics and explicit dispatches only. Exact-release-SHA
    # validation lives in release-hardware.yml; pull requests from this public repo
    # never execute their code on a self-hosted workstation. The macOS runner is a laptop under
    # an AC-power policy: on battery it is deliberately booted out of the
    # fleet, so it is absent for long stretches by design.
    #
    # `timeout-minutes` does not help here. It bounds how long a job may RUN;
    # it does not bound time spent queued waiting for a runner. A job
    # scheduled while the machine is on battery would therefore sit pending up
    # to GitHub's 24h limit and then report `cancelled` - the exact signature
    # of the label-with-no-runner bug this workflow was just cleaned of, and
    # equally invisible.
    #
    # Release integration is deliberate. The machine must be plugged in before
    # publish.yml is allowed to advertise MPS support for the selected SHA.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.tier == 'macos' || inputs.tier == 'macos-and-gpu'))
    timeout-minutes: 60
    concurrency:
      group: ci-tests-macos-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: [self-hosted, macOS, ARM64]
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      # The runner's environment does not necessarily carry Homebrew's prefix:
      # a non-login shell omits /opt/homebrew/bin, which is where uv lives, and
      # pwsh sits under ~/.local/bin. Without this every recipe fails with
      # "uv: command not found" on a machine where an interactive shell finds
      # it perfectly well. `just` needs pwsh on POSIX too - the justfile's
      # `windows-shell` is the override, not the rule.
      - name: Put Homebrew and user binaries on PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Run tests
        continue-on-error: true
        run: just test-python

      # The guard below reads the machine's model cache with the Hub switched
      # off, deliberately, so that a missing snapshot fails as a runner problem
      # instead of quietly downloading gigabytes mid-gate. That contract needs
      # the cache to exist, and nothing was populating it: the gate failed as
      # "outgoing traffic has been disabled", which reads like a network
      # outage and is really the offline read finding an empty cache.
      #
      # Warming it here keeps the guard's offline discipline intact and makes
      # the precondition self-provisioning rather than a manual step somebody
      # has to remember on a long-lived machine. The download is idempotent -
      # a warm cache is a no-op - and the model set is read from the shipped
      # configuration so it cannot drift from what the guard then loads.
      - name: Warm the model cache the MPS guard reads
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --no-sync python - <<'PY'
          from huggingface_hub import snapshot_download

          from vaultspec_rag.config._settings import get_config

          config = get_config()
          for model in (
              config.embedding_model,
              config.sparse_model,
              config.reranker_model,
          ):
              print(f"warming {model}", flush=True)
              snapshot_download(model)
          PY

      # This is the support gate for Apple silicon. It is deliberately
      # separate from the advisory cross-platform unit result: selecting it
      # runs the configured dense, sparse, and reranker models together on
      # MPS and fails if any operation falls back to CPU or cannot run.
      - name: Run MPS acceptance guard
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "0"
        run: just test-mps

  gpu-tests:
    name: "Test: GPU Correctness (CUDA)"
    # Generous relative to the other jobs because this tier is the ~40 minute
    # long pole, but still finite: a wedged GPU test holds the only machine
    # carrying the cuda label, so an unbounded hang blocks every future GPU
    # run rather than just its own.
    timeout-minutes: 90
    # Never cancel an in-progress GPU run: it is the long pole (~40 min) on a
    # single self-hosted GPU runner, so a superseding push already queues
    # behind it naturally (the runner label has exactly one machine). Scoping
    # this job's own concurrency group means a rapid-fire push still cancels
    # the fast lint/type/test jobs for dedup, but the GPU verdict always runs
    # to completion once started.
    concurrency:
      group: ci-gpu-tests-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # The complement of the hosted "Tests" job: the integration, quality,
    # performance, robustness, subprocess_gpu, and cuda markers that a
    # GPU-less hosted runner cannot execute. This is where the real GPU tier
    # actually runs instead of being deselected.
    #
    # Schedule and dispatch only, never push or pull_request. On a
    # single self-hosted GPU runner shared with the live service, auto-running
    # it on every push wedged the runner (one hung test blocks all other CI on
    # the one machine) and the shared-GPU contention made results
    # non-deterministic. Correctness is instead verified by isolated
    # single-test runs; trigger a full tier run on demand with
    # `gh workflow run CI` / the Actions "Run workflow" button.
    #
    # Contention is guarded by the one pytest coordinator: it borrows through
    # the acknowledged service lease, fails closed on unavailable service,
    # lease, or device evidence, and resumes before release. The self-hosted
    # runner image also supplies the pinned, manifest-verified Qdrant binary
    # used only by test-owned isolated children; the coordinator verifies it
    # read-only and
    # refuses the tier if it is absent. This prevents the job from piling onto
    # existing load without provisioning a binary or starting a service.
    #
    # SECURITY (public repo, self-hosted runner on a real workstation): running
    # arbitrary code here is RCE on the host. workflow_dispatch requires write
    # access, so a fork PR can never start this job; the other self-hosted
    # tiers carry the same-repo guard above and are unreachable from one too.
    # Opt-in per dispatch. Previously ANY manual run started this tier, so a
    # dispatch aimed at something else silently paid ~40 minutes on the one
    # machine carrying the cuda label - and blocked every other GPU run while
    # it did. Still dispatch-only, so a fork pull request can never reach it.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.tier == 'gpu' || inputs.tier == 'macos-and-gpu'))
    runs-on: [self-hosted, windows, gpu, cuda]
    permissions:
      contents: read
    env:
      # requires-python admits a range, so uv would otherwise pick whichever
      # interpreter it likes here and the CUDA wheel under test would drift
      # between runs. This job exists to exercise ONE known GPU stack, so it
      # pins the floor; the CPU `tests` matrix is what covers the range.
      # Pinning here also avoids actions/setup-python, whose MSI registry
      # cleanup fails under the runner's service account (no HKLM write).
      UV_PYTHON: "3.13"
      # Same containment as the Windows unit job, and it matters more here:
      # this lane provisions a Qdrant binary, warms a multi-gigabyte model
      # cache, and starts a resident daemon. Under the SYSTEM account all
      # three land in C:\WINDOWS\system32\config\systemprofile - gigabytes of
      # machine-learning weights and a running service written into the
      # operating system's own directory with administrative rights. Every
      # path is pinned to runner-owned storage; nothing this job creates is
      # allowed inside the Windows install.
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      # Install `just` without the bash-based marketplace action: this runner's
      # service account has no `bash` on PATH, so a pinned, SHA256-verified
      # download driven by PowerShell is the portable path.
      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Provision the pinned Qdrant binary the GPU tier requires
        run: uv run --no-sync vaultspec-rag server qdrant install

      # The tier does not own the card, it BORROWS it: the coordinator captures
      # a live, health-verified, version-compatible resident service before
      # pytest isolates its managed paths, and refuses the whole tier when
      # there is none - every test deselected, nothing run. That capture has to
      # see a service that is fully ready, not merely started, because a
      # warming daemon has no health identity to match yet.
      #
      # Waiting on `running` rather than sleeping a fixed interval is what
      # makes this reliable on a machine that loads its model stack at start.
      # The service loads the configured model stack as it comes up, so it
      # needs the same warm cache the MPS gate needs. This runner executes as
      # SYSTEM, whose profile carries its own Hugging Face cache, and nothing
      # was populating it - the daemon spawned and died (`start_died`) before
      # it could report ready.
      - name: Warm the model cache the resident service loads
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --no-sync python - <<'PY'
          from huggingface_hub import snapshot_download

          from vaultspec_rag.config._settings import get_config

          config = get_config()
          for model in (
              config.embedding_model,
              config.sparse_model,
              config.reranker_model,
          ):
              print(f"warming {model}", flush=True)
              snapshot_download(model)
          PY

      - name: Start the resident service the GPU tier borrows from
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --no-sync vaultspec-rag server start --json
          # A dead daemon says only `start_died` on stdout; the reason is in its
          # own log, so surface that here rather than leaving the next reader to
          # go and find a file on a machine they may not have.
          if ($LASTEXITCODE -ne 0) {
            uv run --no-sync vaultspec-rag server logs --limit 80
            throw "server start failed with $LASTEXITCODE"
          }
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            $raw = uv run --no-sync vaultspec-rag server status --json
            # The operator state is nested under `data`; reading it off the
            # envelope root yields $null on every poll and times out silently.
            $state = ($raw | ConvertFrom-Json).data.state
            Write-Host "service state: $state"
            if ($state -eq 'running') { exit 0 }
            Start-Sleep -Seconds 5
          }
          uv run --no-sync vaultspec-rag server logs --limit 80
          throw "the resident service never reported running; the GPU tier cannot borrow"

      - name: Run GPU test tier through guarded coordinator
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: just test-gpu

      # Always: a tier that failed mid-borrow still leaves a daemon holding the
      # card, and the next run's capture would then contend with a service this
      # one was supposed to own the lifetime of.
      - name: Stop the resident service
        if: always()
        shell: pwsh
        run: uv run --no-sync vaultspec-rag server stop --json
