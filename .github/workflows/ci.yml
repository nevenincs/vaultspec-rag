name: CI

# TWO TIERS, split by trust and by cost.
#
#   pull_request  -> `pr-gate` only. Minimal, and on a GitHub-HOSTED runner.
#   push to main,
#   release,
#   workflow_dispatch -> the full tier below, on the self-hosted fleet.
#
# The split is not only about speed. This repository is PUBLIC, and a
# `pull_request` from a fork runs code the author of the pull request
# controls. Scheduling that onto a self-hosted runner is arbitrary code
# execution on a real workstation that also hosts a live service and other
# work. Every trigger that reaches the self-hosted fleet below therefore
# requires write access to this repository; the one trigger that does not is
# the one that stays on hosted infrastructure.
on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # The two tiers that cannot simply run on a schedule: the GPU tier is
      # expensive and contends for the single card with a live service, and
      # the macOS tier targets a laptop that is deliberately out of the fleet
      # on battery. Both are opt-in per dispatch, so exercising one never
      # forces the other - before this, any manual run paid for the GPU tier
      # whether or not that was the point of the run.
      tier:
        description: "Optional tier to include in this run"
        type: choice
        default: none
        options:
          - none
          - macos
          - gpu
          - macos-and-gpu

permissions:
  contents: read

env:
  # NO_COLOR alone disables colour. A non-empty FORCE_COLOR (even "0") forces
  # the terminal ON under the force-color spec Rich implements, making
  # console.clear() emit escape codes into the piped CI log; without it
  # is_terminal falls through to isatty()->False as intended.
  NO_COLOR: "1"

jobs:
  workflow-lint:
    name: Workflow Lint
    # Every job carries an explicit ceiling. Without one the default is six
    # hours, and a job that never gets a runner sits pending until GitHub's
    # 24h queue timeout retires it as `cancelled` - a word that reads as
    # "somebody stopped this" rather than "the fleet is down", so an outage
    # stays invisible. A tight ceiling converts that silence into a failure.
    timeout-minutes: 10
    concurrency:
      # github.job is empty in the concurrency context, so interpolating it
      # collapses every job onto one shared group and they cancel each other.
      # Each job carries its own literal group instead.
      group: ci-workflow-lint-${{ github.ref }}
      cancel-in-progress: false
    # Hosted: this runs on pull_request too, so it must not reach the fleet.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  pr-gate:
    name: PR Gate (ruff, ty, tests)
    # THE MERGE GATE. Deliberately the smallest set that still catches the
    # things a reviewer cannot: a syntax or lint regression, a type error, and
    # a broken test. Everything slower - link checking, markdown, citations,
    # complexity, strict types, the audits, the second interpreter - runs on
    # the comprehensive tier, because paying for it on every push to every
    # branch buys latency, not signal.
    #
    # Hosted, and that is load-bearing rather than incidental: see the trust
    # note on the triggers above. A fork pull request runs here, so "here"
    # must not be a workstation.
    if: github.event_name == 'pull_request'
    timeout-minutes: 25
    concurrency:
      # Unlike the main-push jobs, superseding a pull request's own earlier
      # run is what you want - only the tip of the branch is being reviewed.
      group: ci-pr-gate-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      # Each gate carries `if: '!cancelled()'` so one failure does not hide
      # the others: a contributor should get every finding from one run
      # rather than discovering them one push at a time.
      - name: Ruff
        if: '!cancelled()'
        run: just lint python

      - name: Ty
        if: '!cancelled()'
        run: just lint type

      - name: Tests
        if: '!cancelled()'
        run: just test python

  lint-and-type:
    name: Lint, Type, Config, Link, and Markdown Checks
    # Comprehensive tier: everything except the merge gate above. Skipped on
    # pull_request, where `pr-gate` stands in for it.
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    concurrency:
      group: ci-lint-and-type-${{ github.ref }}
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      # This runner is long-lived and mutable, so its interpreter can move
      # between jobs with no workflow change - an OS upgrade once took the
      # system Python from 3.12 to 3.14 and invalidated every venv under the
      # work tree in place. The matrix legs compare at minor granularity
      # because a matrix value IS a minor; this one compares the whole pin,
      # because a 3.13.0 host answering a 3.13.14 pin is the drift that
      # otherwise surfaces later as an unrelated-looking failure.
      - name: Verify the venv interpreter matches the pin
        run: |
          uv run --no-sync python -c "
          import pathlib, sys
          want = pathlib.Path('.python-version').read_text().strip()
          got = '.'.join(map(str, sys.version_info[:3]))
          assert got == want, f'.python-version pins {want}, venv runs {got}'
          print(f'venv interpreter matches the pin: {got}')
          "

      # Every gate below carries `if: '!cancelled()'` so the job runs all of
      # them and reports each one, instead of stopping at the first red. The
      # job still fails if any gate fails - this changes what a failing run
      # TELLS you, not whether it fails.
      #
      # This is not a style preference. Fail-fast masked a cyclomatic-
      # complexity regression on the default branch for an unknown period: the
      # markdown step failed earlier in this same job and aborted it, so the
      # complexity step never executed. One red gate hid another.
      - name: Ruff
        if: '!cancelled()'
        run: just lint python

      - name: Ty
        if: '!cancelled()'
        run: just lint type

      - name: Taplo
        if: '!cancelled()'
        run: just lint toml

      - name: Lychee
        if: '!cancelled()'
        run: just lint links

      - name: Markdown
        if: '!cancelled()'
        run: just lint markdown

      - name: Docs version guard
        if: '!cancelled()'
        run: just lint docs-version

      # ADVISORY (continue-on-error) — see the block above the ratchet gates
      # below. Previously absent from CI entirely: the recipe existed and ran
      # only from `just lint all` on a workstation. Red today on seven test
      # modules that import the package absolutely.
      - name: Absolute imports (advisory)
        if: '!cancelled()'
        continue-on-error: true
        run: just lint absolute-imports

      # Gating: fails CI if tracked source cites a development record (plan/Step
      # coordinate, dated vault stem) in a comment or docstring, or hardcodes a
      # workstation-identity path (worktree root, user home). Generic absolute
      # paths are reported as smells but do not fail.
      - name: Citations
        if: '!cancelled()'
        run: just lint citations

      # ─────────────────────────────────────────────────────────────────────
      # ADVISORY RATCHETS — these RUN and REPORT on every PR, and none of them
      # can fail it. They carry `continue-on-error: true` deliberately.
      #
      # The rationale is that a pull request should be blocked by a defect it
      # INTRODUCED, not by standing debt it merely failed to pay off. These
      # dimensions each still carry a burndown backlog, so gating them would
      # block unrelated work on debt its author did not create.
      #
      # They still run on every PR, and a regression shows as a step warning
      # on the run. `just lint <target>` reproduces any of them locally
      # and DOES exit non-zero — the local recipe is the strict one.
      #
      # Promote a step out of this block by deleting its `continue-on-error`
      # once its backlog reaches zero and it can hold that line.
      # ─────────────────────────────────────────────────────────────────────

      # Cognitive (complexipy, production only) and cyclomatic (xenon).
      # Thresholds sit at today's worst offender and ratchet DOWN only.
      - name: Complexity (advisory)
        if: '!cancelled()'
        continue-on-error: true
        run: just lint complexity

      # ruff's nesting-depth rule is preview-only, so it runs scoped here
      # rather than from the main ruff config, where global preview mode
      # would change stable-rule behavior.
      - name: Nesting depth (advisory)
        if: '!cancelled()'
        continue-on-error: true
        run: just lint nesting

      # Module length (pylint C0302) and the class-shape limits ruff has no
      # rule for. This replaced a bespoke script whose CI step claimed to be
      # report-only while the recipe it ran actually gated.
      - name: Module and class size (advisory)
        if: '!cancelled()'
        continue-on-error: true
        run: just lint size

      # Gating: basedpyright strict reached zero on 2026-06-10, so this now
      # fails CI on any new strict-type error.
      - name: Strict types
        if: '!cancelled()'
        run: just lint type-strict

  tests:
    name: Tests (py${{ matrix.python-version }})
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    concurrency:
      # The matrix leg is part of the group, so the two interpreters queue
      # independently. Without it both legs share one group and serialise.
      group: ci-tests-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64]
    strategy:
      # Both interpreters run to completion: when only one line breaks, the
      # failure is the whole signal, and cancelling the other hides whether
      # the break is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      # `.python-version` pins the dev interpreter to the floor, and uv reads
      # it in preference to whatever actions/setup-python put on PATH. Without
      # this the 3.14 leg would silently sync and test 3.13 — a green matrix
      # proving nothing.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      # Guards the env pin above: if UV_PYTHON stopped taking effect, the leg
      # would test the floor twice and still report green.
      - name: Verify the interpreter under test
        run: |
          uv run --no-sync python -c "
          import sys
          want = '${{ matrix.python-version }}'
          got = f'{sys.version_info[0]}.{sys.version_info[1]}'
          assert got == want, f'expected Python {want}, got {got}'
          print(f'testing under Python {sys.version.split()[0]}')
          "

      - name: Run tests
        run: just test python

  # WINDOWS AND macOS UNIT TIERS.
  #
  # Both are ADVISORY (`continue-on-error`) and that is a deliberate, temporary
  # state rather than a permanent exemption. Neither platform is green: the
  # Linux tier passes, Windows fails a handful of source-scanning guards, and
  # macOS fails on the order of a hundred tests that have never been triaged.
  # Landing them as blocking would turn every release red on day one and the
  # pressure would be to delete the jobs rather than fix the platform.
  #
  # So they report instead. The failures become visible and attributable, and
  # each platform flips to blocking - by deleting its `continue-on-error` -
  # once its count reaches zero. Ratchet down, never up; an advisory job that
  # nobody ever promotes is just an expensive way to ignore a platform.
  #
  # Neither uses actions/setup-python. The GPU job below documents why: its
  # MSI registry cleanup fails under a runner service account. uv fetches the
  # interpreter named by UV_PYTHON instead, which is what the suite runs under
  # anyway.
  tests-windows:
    name: Tests (Windows, advisory)
    if: github.event_name != 'pull_request'
    continue-on-error: true
    timeout-minutes: 60
    concurrency:
      group: ci-tests-windows-${{ github.ref }}
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64]
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Same pinned, checksum-verified download the GPU job uses: this
      # runner's service account has no bash on PATH, so the marketplace
      # action's shell is unavailable.
      - name: Install just
        shell: pwsh
        run: |
          $ver = "1.57.0"
          $sha = "4c7391d17cb1d17b758b52004ee6411372b8a13ff37c3c9b9031625cb6026e09"
          $zip = "$env:RUNNER_TEMP\just-$ver.zip"
          $dest = "$env:RUNNER_TEMP\just-$ver"
          $url = "https://github.com/casey/just/releases/download/$ver/just-$ver-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha) { throw "just checksum mismatch: got $actual" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dest

      - name: Install dependencies
        run: just deps sync

      - name: Run tests
        run: just test python

  tests-macos:
    name: Tests (macOS units advisory, MPS required)
    # Main pushes, releases, and explicit dispatches only. The main-push result
    # is the pre-publication support gate; pull requests from this public repo
    # never execute their code on a self-hosted workstation. The macOS runner is a laptop under
    # an AC-power policy: on battery it is deliberately booted out of the
    # fleet, so it is absent for long stretches by design.
    #
    # `timeout-minutes` does not help here. It bounds how long a job may RUN;
    # it does not bound time spent queued waiting for a runner. A job
    # scheduled while the machine is on battery would therefore sit pending up
    # to GitHub's 24h limit and then report `cancelled` - the exact signature
    # of the label-with-no-runner bug this workflow was just cleaned of, and
    # equally invisible.
    #
    # Main integration and a release are deliberate acts. The machine must be
    # plugged in before either is allowed to advertise MPS support.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.tier == 'macos' || inputs.tier == 'macos-and-gpu'))
    timeout-minutes: 60
    concurrency:
      group: ci-tests-macos-${{ github.ref }}
      cancel-in-progress: false
    runs-on: [self-hosted, macOS, ARM64]
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # The runner's environment does not necessarily carry Homebrew's prefix:
      # a non-login shell omits /opt/homebrew/bin, which is where uv lives, and
      # pwsh sits under ~/.local/bin. Without this every recipe fails with
      # "uv: command not found" on a machine where an interactive shell finds
      # it perfectly well. `just` needs pwsh on POSIX too - the justfile's
      # `windows-shell` is the override, not the rule.
      - name: Put Homebrew and user binaries on PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Run tests
        continue-on-error: true
        run: just test python

      # This is the support gate for Apple silicon. It is deliberately
      # separate from the advisory cross-platform unit result: selecting it
      # runs the configured dense, sparse, and reranker models together on
      # MPS and fails if any operation falls back to CPU or cannot run.
      - name: Run MPS acceptance guard
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "0"
        run: just test mps

  gpu-tests:
    name: GPU Tests
    # Generous relative to the other jobs because this tier is the ~40 minute
    # long pole, but still finite: a wedged GPU test holds the only machine
    # carrying the cuda label, so an unbounded hang blocks every future GPU
    # run rather than just its own.
    timeout-minutes: 90
    # Never cancel an in-progress GPU run: it is the long pole (~40 min) on a
    # single self-hosted GPU runner, so a superseding push already queues
    # behind it naturally (the runner label has exactly one machine). Scoping
    # this job's own concurrency group means a rapid-fire push still cancels
    # the fast lint/type/test jobs for dedup, but the GPU verdict always runs
    # to completion once started.
    concurrency:
      group: ci-${{ github.workflow }}-gpu-tests-${{ github.ref }}
      cancel-in-progress: false
    # The complement of the hosted "Tests" job: the integration, quality,
    # performance, robustness, subprocess_gpu, and cuda markers that a
    # GPU-less hosted runner cannot execute. This is where the real GPU tier
    # actually runs instead of being deselected.
    #
    # Dispatch-only: this tier does NOT run on push or pull_request. On a
    # single self-hosted GPU runner shared with the live service, auto-running
    # it on every push wedged the runner (one hung test blocks all other CI on
    # the one machine) and the shared-GPU contention made results
    # non-deterministic. Correctness is instead verified by isolated
    # single-test runs; trigger a full tier run on demand with
    # `gh workflow run CI` / the Actions "Run workflow" button.
    #
    # Contention is guarded by the one pytest coordinator: it borrows through
    # the acknowledged service lease, fails closed on unavailable service,
    # lease, or device evidence, and resumes before release. The self-hosted
    # runner image also supplies the pinned, manifest-verified Qdrant binary
    # used only by test-owned isolated children; the coordinator verifies it
    # read-only and
    # refuses the tier if it is absent. This prevents the job from piling onto
    # existing load without provisioning a binary or starting a service.
    #
    # SECURITY (public repo, self-hosted runner on a real workstation): running
    # arbitrary code here is RCE on the host. workflow_dispatch requires write
    # access, so a fork PR can never start this job; the hosted tiers above run
    # on every PR with no secrets.
    # Opt-in per dispatch. Previously ANY manual run started this tier, so a
    # dispatch aimed at something else silently paid ~40 minutes on the one
    # machine carrying the cuda label - and blocked every other GPU run while
    # it did. Still dispatch-only, so a fork pull request can never reach it.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.tier == 'gpu' || inputs.tier == 'macos-and-gpu')
    runs-on: [self-hosted, windows, gpu, cuda]
    permissions:
      contents: read
    env:
      # requires-python admits a range, so uv would otherwise pick whichever
      # interpreter it likes here and the CUDA wheel under test would drift
      # between runs. This job exists to exercise ONE known GPU stack, so it
      # pins the floor; the CPU `tests` matrix is what covers the range.
      # Pinning here also avoids actions/setup-python, whose MSI registry
      # cleanup fails under the runner's service account (no HKLM write).
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Install `just` without the bash-based marketplace action: this runner's
      # service account has no `bash` on PATH, so a pinned, SHA256-verified
      # download driven by PowerShell is the portable path.
      - name: Install just
        shell: pwsh
        run: |
          $ver = "1.57.0"
          $sha = "4c7391d17cb1d17b758b52004ee6411372b8a13ff37c3c9b9031625cb6026e09"
          $zip = "$env:RUNNER_TEMP\just-$ver.zip"
          $dest = "$env:RUNNER_TEMP\just-$ver"
          $url = "https://github.com/casey/just/releases/download/$ver/just-$ver-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha) { throw "just checksum mismatch: got $actual" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Add-Content -Path $env:GITHUB_PATH -Value $dest

      - name: Install dependencies
        run: just deps sync

      # Prerequisite: the self-hosted GPU runner image contains the pinned,
      # manifest-verified Qdrant binary. The pytest coordinator verifies it
      # read-only and refuses this tier if it is absent; CI never installs it.
      - name: Run GPU test tier through guarded coordinator
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: just test gpu

  vault-audit:
    name: Vault Audit
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    concurrency:
      group: ci-vault-audit-${{ github.ref }}
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Verify vault structure and links
        run: uv run vaultspec-core vault check all

  dependency-audit:
    name: Dependency Audit (uv audit)
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    concurrency:
      group: ci-dependency-audit-${{ github.ref }}
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Python dependency vulnerability audit
        run: just audit deps

  # Advisory only — this job reports and can never fail the run. It is the CI
  # face of `just audit`: dead code, undeclared (transitively-resolved)
  # imports, and the security scan. Each yields a lead to confirm rather than a
  # verdict, so none of them belongs in a blocking gate.
  #
  # Read it on a PR the way you would read a code review comment: the findings
  # are advice, and the burndown they feed is tracked separately.
  code-audit:
    name: Code Audit (advisory)
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    concurrency:
      group: ci-code-audit-${{ github.ref }}
      cancel-in-progress: false
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install dependencies
        run: just deps sync

      - name: Dead code (vulture)
        if: '!cancelled()'
        continue-on-error: true
        run: just audit dead-code

      - name: Undeclared dependencies (deptry)
        if: '!cancelled()'
        continue-on-error: true
        run: just audit dependencies

