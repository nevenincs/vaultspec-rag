name: RAG CI

# Scheduled and manually dispatched accelerator coverage. Pull requests have
# one CI owner, `merge-gate.yml`, so every required result comes from one
# workflow and no static check is repeated in a second run.
#
# CONCURRENCY, AND WHY THE COMMIT IS IN THE GROUP ON MAIN. `cancel-in-progress:
# false` governs runs that have STARTED. GitHub separately cancels a
# previously PENDING run in the same group, and offers no switch for it, so a
# scheduled run and a dispatch against main would otherwise cancel each other
# and report `cancelled` rather than `failed`. Putting the commit in the
# group, on main only, gives every main commit its own group.
#
# The rule and its guards live in `dev/guards/`:
# `test_ci_no_repeated_work.py` expands every recipe to the commands it
# finally runs and fails when one appears in two jobs of the same run;
# `test_ci_jobs_reach_a_verdict.py` holds the ceilings and the groups above.
#
# The hardware tiers are unreachable from pull requests.
on:
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:
    inputs:
      # Each tier is opt-in per dispatch, so exercising one never forces the
      # other.
      tier:
        description: "Tier to run"
        type: choice
        default: macos
        options:
          - macos
          - gpu
          - macos-and-gpu

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # NO_COLOR alone disables colour. A non-empty FORCE_COLOR (even "0") forces
  # the terminal ON under the force-color spec Rich implements, making
  # console.clear() emit escape codes into the piped CI log; without it
  # is_terminal falls through to isatty()->False as intended.
  NO_COLOR: "1"

jobs:
  # The accelerator tiers are defined once, in `hardware.yml`, and shared
  # with the release.
  hardware:
    name: "Test: Accelerator tiers"
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/hardware.yml
    with:
      target_sha: ${{ github.sha }}
      tier: ${{ inputs.tier || 'macos-and-gpu' }}
      macos_full_suite: true
    secrets:
      VAULTSPEC_RAG_TYPESAFE_API_KEY: ${{ secrets.VAULTSPEC_RAG_TYPESAFE_API_KEY }}
