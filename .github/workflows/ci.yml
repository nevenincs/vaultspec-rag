name: CI

# ONE TIER. Every event runs the same jobs, and a job that runs at all runs
# everywhere.
#
# The split this replaced ran a small `pr-gate` on pull requests and a larger
# comprehensive tier on pushes to main, which is the right shape on a hosted
# fleet and the wrong one here: this account has ONE Linux runner and ONE
# Windows runner, shared across every repository, and every job on them is
# serial. Splitting work across more jobs buys parallelism where runners are
# elastic; here it buys only latency, and a check the pull request never ran
# is a check that first fails on main - after the merge, with nobody watching.
#
# CONCURRENCY, AND WHY THE COMMIT IS IN THE GROUP ON MAIN. `cancel-in-progress:
# false` governs runs that have STARTED. GitHub separately cancels a
# previously PENDING run in the same group, and offers no switch for it. On a
# saturated serial fleet a main run sits pending for a long time. The last
# merge before this change is the evidence: it ran for 2h23m, and four of its
# jobs - the workflow lint, the lint tier, the vault check and the dependency
# audit - were cancelled after sitting 12 to 30 minutes each without ever
# being assigned a runner. So each push to main was killing the verdict on the
# push before it, and reporting `cancelled` rather than `failed` while it did.
#
# Putting the commit in the group, on main only, gives every main commit its
# own group; pull requests keep superseding their own earlier runs, which is
# what you want when only the tip of a branch is under review.
#
# The rule and its two guards live in `dev/guards/`:
# `test_ci_no_repeated_work.py` expands every recipe to the commands it
# finally runs and fails when one appears in two jobs of the same run;
# `test_ci_jobs_reach_a_verdict.py` holds the ceilings and the groups above.
#
# THE TRUST QUESTION. This repository is PUBLIC, and a `pull_request` from a
# fork runs code the author of the pull request controls. That code runs on
# the fleet like everything else, so the protection comes from the
# repository's own fork-approval setting for workflow runs rather than from
# where the job lands.
on:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # The two tiers that cannot simply run on a schedule: the GPU tier is
      # expensive and contends for the single card with a live service, and
      # the macOS tier targets a laptop that is deliberately out of the fleet
      # on battery. Both are opt-in per dispatch, so exercising one never
      # forces the other - before this, any manual run paid for the GPU tier
      # whether or not that was the point of the run.
      tier:
        description: "Optional tier to include in this run"
        type: choice
        default: none
        options:
          - none
          - macos
          - gpu
          - macos-and-gpu

permissions:
  contents: read

env:
  # NO_COLOR alone disables colour. A non-empty FORCE_COLOR (even "0") forces
  # the terminal ON under the force-color spec Rich implements, making
  # console.clear() emit escape codes into the piped CI log; without it
  # is_terminal falls through to isatty()->False as intended.
  NO_COLOR: "1"

jobs:
  lint:
    name: "Lint: Source, Documents and Workflows (Linux)"
    # ONE STEP, and that is the point. This job used to hand-list every
    # dimension of `just check-all` except one, with that one running as a
    # separate job of its own - which is the exact drift `dev/ci_contract.py`
    # exists to catch, reproduced by a job that listed an aggregate's members
    # instead of naming the aggregate. Three jobs are folded in here: the
    # workflow lint that ran the missing dimension, the pull-request gate that
    # ran two of these dimensions and no others, and the vault check, which
    # became `just check-vault` and joined the aggregate rather than staying a
    # raw command in a job. A dimension added to the registry now joins this
    # job automatically; before, it joined nothing.
    #
    # `check-all` keeps going after a failure and reports every dimension, so
    # a contributor gets all the findings from one run rather than one per
    # push. Its membership is data in `dev/toolchain.py`, so this job and the
    # gates cannot disagree about what "everything" means.
    timeout-minutes: 40
    concurrency:
      group: ci-lint-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Native binaries, so they cannot be pinned in the lockfile. The recipes
      # fall back to the pinned container image when either is absent; these
      # steps mean the fallback is not the normal path on the fleet.
      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - name: Install taplo
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Every gating dimension
        run: just check-all

  tests:
    name: "Test: Full Suite py${{ matrix.python-version }} (Linux)"
    timeout-minutes: 45
    concurrency:
      # The matrix leg is part of the group, so the two interpreters queue
      # independently. Without it both legs share one group and serialise.
      group: ci-tests-${{ github.ref }}-${{ matrix.python-version }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64]
    strategy:
      # Both interpreters run to completion: when only one line breaks, the
      # failure is the whole signal, and cancelling the other hides whether
      # the break is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      # `.python-version` pins the dev interpreter to the floor, and uv reads
      # it in preference to whatever actions/setup-python put on PATH. Without
      # this the 3.14 leg would silently sync and test 3.13 — a green matrix
      # proving nothing.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Run tests
        run: just test-python

  # THE WINDOWS AND macOS JOBS.
  #
  # Both are ADVISORY (`continue-on-error`) and that is a deliberate, temporary
  # state rather than a permanent exemption. Neither platform is green: the
  # Linux legs pass, Windows fails a handful of source-scanning guards, and
  # macOS fails on the order of a hundred tests that have never been triaged.
  # Landing them as blocking would turn every release red on day one and the
  # pressure would be to delete the jobs rather than fix the platform.
  #
  # So they report instead. The failures become visible and attributable, and
  # each platform flips to blocking - by deleting its `continue-on-error` -
  # once its count reaches zero. Ratchet down, never up; an advisory job that
  # nobody ever promotes is just an expensive way to ignore a platform.
  #
  # THAT STATUS IS NOT IN THE NAME, and the omission is deliberate. A job name
  # says what is COVERED, so that a reviewer can find the row that covers the
  # file they changed; whether a row can fail the merge is a property of the
  # merge rules, not of the coverage. Read it here and in
  # `continue-on-error` above each job.
  #
  # THIS JOB ABSORBED THE WINDOWS RECIPE GATE. That was a separate job proving
  # `just` recipes execute under `cmd.exe` at all - init, init again, and one
  # real gate. Its assertions are steps here now: the recipe-execution claim is
  # proved by this job running recipes, the idempotence claim by calling `init`
  # twice, and the gate it ran was `check-python`, which reads only committed
  # files and so was re-answering on Windows what the Linux job had already
  # answered.
  #
  # Neither job uses actions/setup-python. The GPU job below documents why: its
  # MSI registry cleanup fails under a runner service account. uv fetches the
  # interpreter named by UV_PYTHON instead, which is what the suite runs under
  # anyway.
  tests-windows:
    name: "Test: Full Suite (Windows)"
    continue-on-error: true
    timeout-minutes: 60
    concurrency:
      group: ci-tests-windows-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: [self-hosted, Windows, X64]
    env:
      UV_PYTHON: "3.13"
      # This runner's agent is a Windows service, so its account is SYSTEM and
      # every user-scoped path resolves inside
      # C:\WINDOWS\system32\config\systemprofile - the operating system's own
      # directory. Left alone, the suite's temp roots, the model cache, and the
      # managed service state are all written into the OS install by a process
      # holding administrative rights. Each one is pinned to runner-owned
      # storage instead. TMP and TEMP cover Python's tempfile, which is where
      # the pytest session roots are created.
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Same pinned, checksum-verified download the GPU job uses: this
      # runner's service account has no bash on PATH, so the marketplace
      # action's shell is unavailable.
      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      # `init` is idempotent and stamped: the second call must be a sub-second
      # no-op, and `init-check` must agree the worktree is initialized. On
      # Windows that is a real assertion rather than a formality - the stamp
      # hashes paths, and a path comparison is where a Windows no-op most
      # often stops being one.
      #
      # These two used to be a job of their own, alongside this one, on the
      # single Windows machine the whole account queues behind. A second job
      # buys parallelism on a hosted fleet; here it bought a second place in
      # that queue, a second checkout and a second `init` - for two assertions
      # that cost seconds once the worktree this job already builds exists.
      - name: Initialization is idempotent
        run: just init

      - name: The worktree reports itself initialized
        run: just init-check

      # The provisioning proofs drive real uv against real environments, and
      # the failure they exist to catch - a forced reinstall removing an
      # environment's contents and then dying on a file something else holds -
      # is a Windows file-locking behaviour the Linux legs cannot reproduce.
      # They are a SELECTION WITHIN the full suite below, so a pull request
      # pays for the five files that can only fail here rather than for the
      # whole suite on the machine with the least headroom.
      - name: Provisioning proofs
        if: github.event_name == 'pull_request'
        run: just test-provisioning

      - name: Run tests
        if: github.event_name != 'pull_request'
        run: just test-python

  tests-macos:
    name: "Test: Full Suite and Accelerator Backend (macOS)"
    # Main pushes, releases, and explicit dispatches only. The main-push result
    # is the pre-publication support gate; pull requests from this public repo
    # never execute their code on a self-hosted workstation. The macOS runner is a laptop under
    # an AC-power policy: on battery it is deliberately booted out of the
    # fleet, so it is absent for long stretches by design.
    #
    # `timeout-minutes` does not help here. It bounds how long a job may RUN;
    # it does not bound time spent queued waiting for a runner. A job
    # scheduled while the machine is on battery would therefore sit pending up
    # to GitHub's 24h limit and then report `cancelled` - the exact signature
    # of the label-with-no-runner bug this workflow was just cleaned of, and
    # equally invisible.
    #
    # Main integration and a release are deliberate acts. The machine must be
    # plugged in before either is allowed to advertise MPS support.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.tier == 'macos' || inputs.tier == 'macos-and-gpu'))
    timeout-minutes: 60
    concurrency:
      group: ci-tests-macos-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: [self-hosted, macOS, ARM64]
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      # The runner's environment does not necessarily carry Homebrew's prefix:
      # a non-login shell omits /opt/homebrew/bin, which is where uv lives, and
      # pwsh sits under ~/.local/bin. Without this every recipe fails with
      # "uv: command not found" on a machine where an interactive shell finds
      # it perfectly well. `just` needs pwsh on POSIX too - the justfile's
      # `windows-shell` is the override, not the rule.
      - name: Put Homebrew and user binaries on PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Run tests
        continue-on-error: true
        run: just test-python

      # The guard below reads the machine's model cache with the Hub switched
      # off, deliberately, so that a missing snapshot fails as a runner problem
      # instead of quietly downloading gigabytes mid-gate. That contract needs
      # the cache to exist, and nothing was populating it: the gate failed as
      # "outgoing traffic has been disabled", which reads like a network
      # outage and is really the offline read finding an empty cache.
      #
      # Warming it here keeps the guard's offline discipline intact and makes
      # the precondition self-provisioning rather than a manual step somebody
      # has to remember on a long-lived machine. The download is idempotent -
      # a warm cache is a no-op - and the model set is read from the shipped
      # configuration so it cannot drift from what the guard then loads.
      - name: Warm the model cache the MPS guard reads
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --no-sync python - <<'PY'
          from huggingface_hub import snapshot_download

          from vaultspec_rag.config._settings import get_config

          config = get_config()
          for model in (
              config.embedding_model,
              config.sparse_model,
              config.reranker_model,
          ):
              print(f"warming {model}", flush=True)
              snapshot_download(model)
          PY

      # This is the support gate for Apple silicon. It is deliberately
      # separate from the advisory cross-platform unit result: selecting it
      # runs the configured dense, sparse, and reranker models together on
      # MPS and fails if any operation falls back to CPU or cannot run.
      - name: Run MPS acceptance guard
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: "0"
        run: just test-mps

  gpu-tests:
    name: "Test: GPU Correctness (CUDA)"
    # Generous relative to the other jobs because this tier is the ~40 minute
    # long pole, but still finite: a wedged GPU test holds the only machine
    # carrying the cuda label, so an unbounded hang blocks every future GPU
    # run rather than just its own.
    timeout-minutes: 90
    # Never cancel an in-progress GPU run: it is the long pole (~40 min) on a
    # single self-hosted GPU runner, so a superseding push already queues
    # behind it naturally (the runner label has exactly one machine). Scoping
    # this job's own concurrency group means a rapid-fire push still cancels
    # the fast lint/type/test jobs for dedup, but the GPU verdict always runs
    # to completion once started.
    concurrency:
      group: ci-gpu-tests-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # The complement of the hosted "Tests" job: the integration, quality,
    # performance, robustness, subprocess_gpu, and cuda markers that a
    # GPU-less hosted runner cannot execute. This is where the real GPU tier
    # actually runs instead of being deselected.
    #
    # Dispatch-only: this tier does NOT run on push or pull_request. On a
    # single self-hosted GPU runner shared with the live service, auto-running
    # it on every push wedged the runner (one hung test blocks all other CI on
    # the one machine) and the shared-GPU contention made results
    # non-deterministic. Correctness is instead verified by isolated
    # single-test runs; trigger a full tier run on demand with
    # `gh workflow run CI` / the Actions "Run workflow" button.
    #
    # Contention is guarded by the one pytest coordinator: it borrows through
    # the acknowledged service lease, fails closed on unavailable service,
    # lease, or device evidence, and resumes before release. The self-hosted
    # runner image also supplies the pinned, manifest-verified Qdrant binary
    # used only by test-owned isolated children; the coordinator verifies it
    # read-only and
    # refuses the tier if it is absent. This prevents the job from piling onto
    # existing load without provisioning a binary or starting a service.
    #
    # SECURITY (public repo, self-hosted runner on a real workstation): running
    # arbitrary code here is RCE on the host. workflow_dispatch requires write
    # access, so a fork PR can never start this job; the hosted tiers above run
    # on every PR with no secrets.
    # Opt-in per dispatch. Previously ANY manual run started this tier, so a
    # dispatch aimed at something else silently paid ~40 minutes on the one
    # machine carrying the cuda label - and blocked every other GPU run while
    # it did. Still dispatch-only, so a fork pull request can never reach it.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.tier == 'gpu' || inputs.tier == 'macos-and-gpu')
    runs-on: [self-hosted, windows, gpu, cuda]
    permissions:
      contents: read
    env:
      # requires-python admits a range, so uv would otherwise pick whichever
      # interpreter it likes here and the CUDA wheel under test would drift
      # between runs. This job exists to exercise ONE known GPU stack, so it
      # pins the floor; the CPU `tests` matrix is what covers the range.
      # Pinning here also avoids actions/setup-python, whose MSI registry
      # cleanup fails under the runner's service account (no HKLM write).
      UV_PYTHON: "3.13"
      # Same containment as the Windows unit job, and it matters more here:
      # this lane provisions a Qdrant binary, warms a multi-gigabyte model
      # cache, and starts a resident daemon. Under the SYSTEM account all
      # three land in C:\WINDOWS\system32\config\systemprofile - gigabytes of
      # machine-learning weights and a running service written into the
      # operating system's own directory with administrative rights. Every
      # path is pinned to runner-owned storage; nothing this job creates is
      # allowed inside the Windows install.
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Install `just` without the bash-based marketplace action: this runner's
      # service account has no `bash` on PATH, so a pinned, SHA256-verified
      # download driven by PowerShell is the portable path.
      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Provision the pinned Qdrant binary the GPU tier requires
        run: uv run --no-sync vaultspec-rag server qdrant install

      # The tier does not own the card, it BORROWS it: the coordinator captures
      # a live, health-verified, version-compatible resident service before
      # pytest isolates its managed paths, and refuses the whole tier when
      # there is none - every test deselected, nothing run. That capture has to
      # see a service that is fully ready, not merely started, because a
      # warming daemon has no health identity to match yet.
      #
      # Waiting on `running` rather than sleeping a fixed interval is what
      # makes this reliable on a machine that loads its model stack at start.
      # The service loads the configured model stack as it comes up, so it
      # needs the same warm cache the MPS gate needs. This runner executes as
      # SYSTEM, whose profile carries its own Hugging Face cache, and nothing
      # was populating it - the daemon spawned and died (`start_died`) before
      # it could report ready.
      - name: Warm the model cache the resident service loads
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --no-sync python - <<'PY'
          from huggingface_hub import snapshot_download

          from vaultspec_rag.config._settings import get_config

          config = get_config()
          for model in (
              config.embedding_model,
              config.sparse_model,
              config.reranker_model,
          ):
              print(f"warming {model}", flush=True)
              snapshot_download(model)
          PY

      - name: Start the resident service the GPU tier borrows from
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --no-sync vaultspec-rag server start --json
          # A dead daemon says only `start_died` on stdout; the reason is in its
          # own log, so surface that here rather than leaving the next reader to
          # go and find a file on a machine they may not have.
          if ($LASTEXITCODE -ne 0) {
            uv run --no-sync vaultspec-rag server logs --limit 80
            throw "server start failed with $LASTEXITCODE"
          }
          $deadline = (Get-Date).AddMinutes(10)
          while ((Get-Date) -lt $deadline) {
            $raw = uv run --no-sync vaultspec-rag server status --json
            # The operator state is nested under `data`; reading it off the
            # envelope root yields $null on every poll and times out silently.
            $state = ($raw | ConvertFrom-Json).data.state
            Write-Host "service state: $state"
            if ($state -eq 'running') { exit 0 }
            Start-Sleep -Seconds 5
          }
          uv run --no-sync vaultspec-rag server logs --limit 80
          throw "the resident service never reported running; the GPU tier cannot borrow"

      - name: Run GPU test tier through guarded coordinator
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: just test-gpu

      # Always: a tier that failed mid-borrow still leaves a daemon holding the
      # card, and the next run's capture would then contend with a service this
      # one was supposed to own the lifetime of.
      - name: Stop the resident service
        if: always()
        shell: pwsh
        run: uv run --no-sync vaultspec-rag server stop --json

  dependency-audit:
    name: "Audit: Dependency Advisories (Linux)"
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    concurrency:
      group: ci-dependency-audit-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # Every job, every platform: a build never addresses a system
      # location. Pins the writable paths and refuses to continue if any
      # still resolves inside one.
      - uses: ./.github/actions/contain-writes

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Derived from the pin, never repeated: a literal here drifts the
          # first time the pin is bumped alone.
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up just
        uses: taiki-e/install-action@d56249f532886d210664917b882ad7e152e17d68 # v2
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Python dependency vulnerability audit
        run: just audit-deps
