name: RAG Channels

# The package-manager pointers, published AFTER the release they point at.
#
# A Scoop manifest and a Homebrew formula address assets by release download
# URL, so they are an advertisement for a release rather than a part of it.
# They used to be generated and pushed by the binaries lane, which was correct
# only while the release was already visible when the binaries were attached.
# It is not any more: the release is created as a draft and published at the
# end of the publication lane, and a pointer pushed before that flip sends
# `scoop update` and `brew upgrade` at a URL the draft does not serve.
#
# So this is its own lane, dispatched by the publication lane once the release
# is public. The rule it obeys is the one the acquisition check obeys too:
# nothing that advertises a release runs before the release exists.
#
# IT HOLDS THE DEPLOY KEY AND NOTHING ELSE. The obvious alternative was to
# append these steps to the publication lane, but the job that uploads to the
# index carries `id-token: write` for trusted publishing, and that grant is
# not scoped to one audience - any step in a job holding it can mint an OIDC
# token for whatever audience it names. The channel deploy key has no business
# beside it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to point the channels at (e.g. vaultspec-rag-v0.5.4)"
        required: true
        type: string
      dry_run:
        description: "Generate and validate pointers without publishing them."
        type: boolean
        default: false

permissions:
  contents: read

# Keyed by tag, like every other release lane here. Two releases publishing
# close together must not have their pointer pushes cancel one another: the
# push itself rebases, but a cancelled run reports `cancelled` and nothing
# reacts to that.
concurrency:
  group: channels-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  channels:
    name: "Build: Release channel pointers (Linux)"
    timeout-minutes: 150
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 30
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
    permissions:
      # Read only. The push does not go through the automatic token at all - it
      # goes to another repository over SSH with the deploy key below - so this
      # job never needs write access to anything here.
      contents: read
    steps:
      # This repo, for the generator. `main` rather than the tag: the pointer
      # format and its validator are current policy, while the release the
      # pointers name is whatever tag was dispatched. No credentials
      # persisted - nothing is pushed here.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.dry_run && github.sha || 'main' }}

      # The ORG-WIDE distribution repository. Scoop manifests and Homebrew
      # formulae belong to the account rather than to each product, so a user
      # taps or bucket-adds ONCE, ever - not once per product. The products
      # under the account share this branch, which is what makes the
      # per-product staging below load-bearing rather than tidy.
      - name: Checkout the distribution repository
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2  # zizmor: ignore[artipacked] -- this job pushes the channel pointers with it
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ref: main
          path: channels
          ssh-key: ${{ secrets.CHANNEL_ROOT_DEPLOY_KEY }}

      - name: Checkout public channel pointers for validation
        if: inputs.dry_run
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ref: main
          path: channels
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install 3.13

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      # REFUSE A DRAFT. This lane exists because a pointer must not precede the
      # publication, so it checks that rather than trusting its caller: a
      # dispatch aimed at an unpublished release is the one mistake that
      # reintroduces the defect this file was written to remove.
      - name: Refuse to point at an unpublished release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
            echo "::error::${TAG} is still a draft. Its download URLs serve nothing, so a channel pointer published now would send every package manager at a 404."
            exit 1
          fi
          echo "${TAG} is published; its assets are downloadable"

      # FROM THE RELEASE, not from a build directory. The binaries lane used
      # its own `dist-bundles/SHA256SUMS`, which is the same bytes it had just
      # uploaded - but "the same bytes" was an assumption about the upload
      # rather than a fact about the release. Read back from the published
      # release, the pointers describe what a user will actually download, and
      # a release missing its checksum manifest fails here instead of
      # producing a manifest for assets nobody can verify.
      - name: Download the published checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published
          mkdir -p published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir published
          if [ ! -s published/SHA256SUMS ]; then
            echo "::error::${TAG} carries no SHA256SUMS; refusing to generate channel pointers for a release with nothing to verify against"
            exit 1
          fi

      # Generated whole by the packaging tools rather than edited in place: the
      # generator raises on a missing digest, refuses a backward bump, and
      # omits an unbuilt platform instead of inventing one.
      #
      # Generate AND validate, in one recipe, because they are one act: a
      # pointer that is generated but not validated is an uninstallable
      # release nobody has looked at. Between generating the pointers and
      # committing them is the only point where a bad pointer can still be
      # STOPPED rather than reported after it has shipped. vaultspec-core
      # published a manifest with the right version, the right URLs and empty
      # hashes out of a run that was green end to end.
      - name: Generate and validate the release channel pointers
        shell: bash
        run: just release-channels "$TAG" channels published/SHA256SUMS

      - name: Commit the Scoop manifest and Homebrew formula
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          cd channels
          # Stage BEFORE asking whether anything changed. `git diff` reports
          # only tracked paths, so on the first release for a channel - when
          # the generator has just created bucket/*.json and Formula/*.rb and
          # nothing tracks them yet - it reports no change, and the step
          # announces "nothing to commit" and exits zero having published no
          # pointer at all. That is exactly what happened on v0.4.8: both
          # files were written, neither was committed, and the job went green.
          # Comparing the index against HEAD sees an added path as a change.
          #
          # Only THIS product's two files. The distribution repo serves every
          # product under the account, so a repo-wide `git add` would sweep up a
          # sibling's pointer if two releases raced and publish it under this
          # tag's message.
          git add -- bucket/vaultspec-rag.json Formula/vaultspec-rag.rb
          if git diff --cached --quiet -- bucket Formula; then
            echo "channels already at ${TAG}; nothing to commit"
            exit 0
          fi
          # The identity is passed to this one commit rather than written
          # with `git config`, so the bot identity never outlives this commit.
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(release): point scoop and homebrew at ${TAG}"
          # This branch is shared by every product under the account, so the
          # racing commit is a sibling product publishing its own pointer.
          # Per-product staging above means such a rebase never carries someone
          # else's file, and the generator's backward-bump refusal still stops a
          # stale re-run from clobbering a newer pointer.
          attempt=1
          max_attempts=3
          until git push origin main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::channel pointer push failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "push rejected (attempt ${attempt}/${max_attempts}); rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
          done

      - name: Show validated channel pointer changes
        if: inputs.dry_run
        shell: bash
        run: |
          set -euo pipefail
          cat channels/bucket/vaultspec-rag.json
          cat channels/Formula/vaultspec-rag.rb
          git -C channels diff -- bucket/vaultspec-rag.json Formula/vaultspec-rag.rb
