name: Publish

on:
  push:
    tags:
      - "vaultspec-rag-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. vaultspec-rag-v0.1.4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # Release artifacts build on GitHub-HOSTED runners, deliberately: a
    # published wheel must not be built on a workstation that also runs agent
    # sessions and a live service. CI's lint/test jobs are the ones on the
    # self-hosted fleet.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  smoke-test:
    name: Smoke Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_check.py

      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_check.py

  publish-pypi:
    name: Publish to PyPI
    needs: smoke-test
    # OIDC trusted publishing works from self-hosted runners: the id-token
    # comes from GitHub's OIDC provider, not from the runner host.
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  github-release:
    name: Attach Release Assets
    needs: smoke-test
    # Hosted, like every other job in this workflow: `gh` and `sha256sum` both
    # ship on the hosted image, and the whole release path stays off the
    # self-hosted fleet.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS

      - name: Ensure the GitHub Release exists
        # release-please normally creates the Release before dispatching this
        # workflow, but the manual tag-push trigger can fire against a tag
        # with no Release yet. --verify-tag refuses to create one for a tag
        # that isn't pushed; `|| true` is safe because the only failure mode
        # once the tag is verified is "already exists", which is the case we
        # want to no-op through.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag || github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes || true

      - name: Attach wheel, sdist, and checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag || github.ref_name }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
