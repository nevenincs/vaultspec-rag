name: RAG Publish

# WHAT STARTS THIS WORKFLOW: the release cut in `release-please.yml`, after it
# has proven the release commit with the full merge gate and both accelerator
# tiers and tagged it; Binaries, for the package-index stage; and a maintainer
# repairing a release. Dispatch only: a tag trigger would start a second run
# for every tag a person pushes, racing the cut's own dispatch.
#
# The release chain, one hop each:
#   cut (tag + draft) -> Publish (build, smoke, attach to the draft) ->
#   Binaries (build, attach, prove the draft) -> Publish (package index: PyPI,
#   then publish the draft, then the channel pointers and the acquisition
#   check)
#
# Everything above the publication runs against a DRAFT, which is invisible to
# `latest` by construction. A release that exists is therefore a release that
# is complete, and a failure anywhere leaves a draft nobody has been sent to.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. vaultspec-rag-v0.1.4)"
        required: true
        type: string
      stage:
        description: "release: build, attach and hand to Binaries. package-index: upload a proven draft's packages to PyPI and publish it."
        required: false
        default: release
        type: choice
        options:
          - release
          - package-index

permissions:
  contents: read

concurrency:
  # SHARED WITH binaries.yml AND KEYED BY TAG. Both workflows merge and rewrite
  # the same SHA256SUMS release asset, so separate per-workflow locks would
  # still permit a lost update when they run for one tag at the same time.
  # `cancel-in-progress: false` keeps a repair run queued rather than replacing
  # the only run that can attach the missing artifact.
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-target:
    name: "Check: Release commit (Linux)"
    timeout-minutes: 130
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 10
    # The step below creates the draft release when one is missing.
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - name: Resolve exact release SHA
        id: commit
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if ! [[ "${tag}" =~ ^vaultspec-rag-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: ${tag}"
            exit 1
          fi
          refs=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "${tag}")
          sha=$(awk -v ref="refs/tags/${tag}" '$2 == ref "^{}" { print $1; exit }' <<<"${refs}")
          [ -n "${sha}" ] || sha=$(awk -v ref="refs/tags/${tag}" '$2 == ref { print $1; exit }' <<<"${refs}")
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release tag ${tag} does not exist"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "${tag} resolves to ${sha}"

      # The cut creates the draft before it dispatches this workflow, so this
      # is the idempotent guard for a release a maintainer tagged by hand and
      # for a repair dispatch: "already exists" is the no-op we want, and
      # `--verify-tag` refuses to invent a release for an unpushed tag.
      #
      # `--draft`, so a release recreated here starts in the state the cut
      # would have left it in. Publication is the last act of the package-index
      # stage and nothing else in the chain flips it, so a non-draft recreation
      # would advertise an empty release the moment it was made.
      #
      # It never edits an existing release's flags. A release this chain has
      # already published must not be pushed back into a draft, and an
      # incomplete draft needs no holding: a draft is invisible to `latest` by
      # construction.
      - name: Ensure a draft release exists for the tag
        if: ${{ inputs.stage != 'package-index' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.commit.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --generate-notes || true

  build:
    name: "Build: Python package (Linux)"
    timeout-minutes: 210
    needs: resolve-target
    # Every release-stage job descends from this one, so the package-index
    # stage skips the whole build chain by skipping it.
    if: ${{ inputs.stage != 'package-index' }}
    outputs:
      sha: ${{ needs.resolve-target.outputs.sha }}
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 90
      # Building the sdist and wheel imports nothing from the local inference
      # stack, so `just init` leaves torch and its CUDA runtime out.
      VAULTSPEC_INIT_GPU_STACK: "none"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: false
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Build package
        run: just build-python

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ needs.resolve-target.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 5

  smoke-test:
    name: "Test: Package smoke (Linux, ${{ matrix.python-version }})"
    timeout-minutes: 140
    needs: build
    outputs:
      sha: ${{ needs.build.outputs.sha }}
    runs-on: [self-hosted, Linux, X64, build]
    strategy:
      # One artifact, every supported interpreter. A leg that fails is the
      # signal; cancelling the others hides whether the break is version-specific.
      fail-fast: false
      matrix:
        # Must cover the whole `requires-python` range. This job installs the
        # built artifact into a clean env and runs it, so it is the gate that
        # catches "the wheel resolves but refuses to start on this interpreter"
        # — the exact failure a single-version smoke test ships green.
        python-version: ["3.13", "3.14"]
    env:
      CI_EXEC_BUDGET_MINUTES: 20
      # `--isolated` does not stop uv reading `.python-version` from the
      # checkout, which pins the floor. Without this the 3.14 leg would
      # silently smoke-test 3.13 and report success for a version it never ran.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ needs.build.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: false
          enable-cache: false

      - name: Install Python
        run: uv python install "${UV_PYTHON}"

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.build.outputs.sha }}
          path: dist/

      # The check is the pipeline's and the artifact is the tag's. The smoke
      # installs the wheel beside whatever its dependencies have published
      # since, so what it must expect can change after a tag exists; a release
      # commit's own copy of the check cannot follow that, and a tag is never
      # moved to make it.
      - name: Check out the pipeline's smoke check
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: pipeline
          sparse-checkout: tests/smoke_check.py
          sparse-checkout-cone-mode: false

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl pipeline/tests/smoke_check.py

      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz pipeline/tests/smoke_check.py

  github-release:
    name: "Build: Release assets (Linux)"
    timeout-minutes: 135
    needs: [resolve-target, smoke-test]
    outputs:
      sha: ${{ needs.smoke-test.outputs.sha }}
    # Needs `gh` and `sha256sum`.
    runs-on: [self-hosted, Linux, X64, build]
    env:
      CI_EXEC_BUDGET_MINUTES: 15
    # Attaches the packages, then dispatches Binaries.
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.smoke-test.outputs.sha }}
          path: dist/

      - name: Generate checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-target.outputs.tag }}
        run: |
          set -euo pipefail
          # Bare names, never `./*`: each manifest name must equal its release
          # asset name exactly, or the binaries workflow's final gate refuses to
          # hand the draft on. `--` keeps a leading dash from reading as a flag.
          sha256sum -- * > SHA256SUMS
          # MERGE into whatever the release already carries rather than
          # replacing it. binaries.yml and publish.yml both publish a file named
          # SHA256SUMS to the same release with --clobber, and neither knows
          # which ran first. On v0.4.11 the binaries run landed last and the
          # published manifest ended up describing only the six binaries - the
          # wheel and the sdist were attached with no digest anyone could check
          # them against, which is precisely the verifiability the manifest
          # exists to provide.
          #
          # Entries for the files THIS run is publishing are dropped from the
          # inherited copy before appending, so a re-run replaces its own lines
          # instead of duplicating them.
          if gh release download "${TAG}" --repo "$GITHUB_REPOSITORY"                --pattern SHA256SUMS --output inherited.txt 2>/dev/null; then
            # A manifest written before names were bare lists `./name`. Read
            # every inherited name bare, or a re-run keeps the stale spelling
            # and the exact-coverage gate refuses an otherwise complete release.
            sed -i -E 's#^([0-9a-f]{64})  \./#\1  #' inherited.txt
            while read -r _digest name; do
              [ -n "${name}" ] || continue
              grep -v -- "  ${name}$" inherited.txt > inherited.tmp || true
              mv inherited.tmp inherited.txt
            done < SHA256SUMS
            cat inherited.txt >> SHA256SUMS
            rm -f inherited.txt
            LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          fi

      - name: Attach wheel, sdist, and checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-target.outputs.tag }}
        run: |
          gh release upload "${TAG}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # Publication is deliberately sequenced. Binaries judges the draft
      # complete and hands it on, so it must not start until the wheel and
      # sdist are attached to that draft. PyPI is not written here: see
      # publish-pypi.
      - name: Trigger Binaries workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-target.outputs.tag }}
          TARGET_SHA: ${{ needs.smoke-test.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run binaries.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${TAG}" \
            --field tag="${TAG}" \
            --field target_sha="${TARGET_SHA}"
          echo "Dispatched Binaries for ${TAG} at ${TARGET_SHA}" >> "$GITHUB_STEP_SUMMARY"

  # The package index is written LAST, and only for a draft the Binaries gate
  # has proven complete. An upload can never be withdrawn, while a draft can
  # simply be left unpublished. v0.4.35 is why the order matters at all: it
  # reached PyPI from this workflow, then failed the final archive gate, so pip
  # and the GitHub release disagreed on the latest version.
  #
  # Binaries dispatches this stage from the gate that judged the draft. It
  # queues behind that run on the shared per-tag lock without holding a
  # runner, and a maintainer may re-dispatch it to retry a failed upload. It
  # uploads the release's own wheel and sdist, checked against the release's
  # SHA256SUMS, so PyPI receives exactly the bytes the gate verified. Staying
  # in this workflow keeps the trusted publisher (publish.yml, environment
  # pypi) unchanged.
  publish-pypi:
    name: "Build: Package index release (Linux)"
    timeout-minutes: 135
    needs: resolve-target
    if: ${{ inputs.stage == 'package-index' }}
    runs-on: [self-hosted, Linux, X64, build]
    # Carried forward so the publication job below never re-resolves the tag:
    # the release it publishes must be the one this job uploaded from.
    outputs:
      tag: ${{ needs.resolve-target.outputs.tag }}
      sha: ${{ needs.resolve-target.outputs.sha }}
    environment:
      name: pypi
    permissions:
      # `id-token: write` is for PyPI trusted publishing, and it lives in this
      # job alone: the grant is not scoped to Sigstore, so any step in a job
      # holding it can mint an OIDC token for any audience it names. The
      # publication job below flips the release without it, and the channel
      # deploy key sits in its own lane.
      id-token: write
      contents: read
    env:
      CI_EXEC_BUDGET_MINUTES: 15
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve-target.outputs.tag }}
      TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
    steps:
      - name: Checkout the reviewed release authority
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: main
      # A DRAFT is what this stage expects, because the release is published
      # by the job below and by nothing else. An already-published release is
      # accepted so a failed upload can be retried for the same tag: PyPI
      # skips the files it already holds, so the retry is a no-op for anything
      # that landed.
      #
      # The distribution must be on the release before anything is uploaded
      # from it. Together those two conditions are what "complete draft" means
      # here; the declared binary targets are the Binaries gate's judgment,
      # and that gate is what dispatched this stage.
      - name: Require a draft release carrying its distribution
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#vaultspec-rag-v}"
          state=$(gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets --jq '"\(.isDraft) \(.assets | map(.name) | join(","))"')
          draft="${state%% *}"
          names="${state#* }"
          if [ "${draft}" != "true" ]; then
            echo "::notice::${TAG} is already published; retrying the upload, which skips files the index holds"
          fi
          missing=()
          for asset in "vaultspec_rag-${version}-py3-none-any.whl" \
                       "vaultspec_rag-${version}.tar.gz" SHA256SUMS; do
            printf '%s\n' "${names}" | tr ',' '\n' | grep -Fxq "${asset}" || missing+=("${asset}")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::${TAG} carries no ${missing[*]}; the release stage attaches them before Binaries hands the draft on. Dispatch the release stage for this tag first."
            exit 1
          fi
          echo "${TAG} carries its distribution (draft=${draft})"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: false
          enable-cache: false

      - name: Publish the release's verified packages to PyPI
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#vaultspec-rag-v}"
          wheel="vaultspec_rag-${version}-py3-none-any.whl"
          sdist="vaultspec_rag-${version}.tar.gz"
          # RUNNER_TEMP is emptied per job; the workspace is not.
          work="${RUNNER_TEMP}/package-index"
          mkdir -p "${work}/dist"
          gh release download "${TAG}" --repo "$GITHUB_REPOSITORY" \
            --dir "${work}" --pattern SHA256SUMS
          gh release download "${TAG}" --repo "$GITHUB_REPOSITORY" \
            --dir "${work}/dist" --pattern "${wheel}" --pattern "${sdist}"
          # Exactly these two lines: a manifest missing either would otherwise
          # pass by checking nothing.
          awk -v wheel="${wheel}" -v sdist="${sdist}" '$2 == wheel || $2 == sdist' \
            "${work}/SHA256SUMS" > "${work}/packages.sha256"
          if [ "$(wc -l < "${work}/packages.sha256")" -ne 2 ] ||
             [ "$(awk -v name="${wheel}" '$2 == name { count++ } END { print count+0 }' "${work}/packages.sha256")" -ne 1 ] ||
             [ "$(awk -v name="${sdist}" '$2 == name { count++ } END { print count+0 }' "${work}/packages.sha256")" -ne 1 ]; then
            echo "::error::SHA256SUMS on ${TAG} does not list exactly ${wheel} and ${sdist}"
            exit 1
          fi
          (cd "${work}/dist" && sha256sum -c ../packages.sha256)
          mkdir -p "${work}/bundles"
          gh release download "${TAG}" --repo "$GITHUB_REPOSITORY" \
            --dir "${work}/bundles" --pattern 'vaultspec-rag-v*.zip' --pattern 'vaultspec-rag-v*.tar.gz'
          uv run --no-project --python 3.13 -- python -m tools.monitor.pins validate \
            --tag "$TAG" --source-revision "$TARGET_SHA" --directory "${work}/bundles"
          uv publish --check-url https://pypi.org/simple/ "${work}/dist/${wheel}" "${work}/dist/${sdist}"

  # THE PUBLICATION, and the last act of the chain. Everything before it ran
  # against a draft: the release stage attached the wheel and sdist, Binaries
  # attached every declared target archive and proved the set, and the job
  # above uploaded the release's own checksum-verified packages to the index.
  # The release becomes visible here and nowhere else, so a release that exists
  # is a release that is complete.
  #
  # AFTER PyPI deliberately. Both acts are one-way and they fail differently:
  # an index that rejects the upload leaves an unpublished draft and nothing
  # advertised, which a re-dispatch repairs, while a release published before
  # PyPI would advertise a version the index does not carry. The draft is the
  # safe state, so it is the one held longest.
  #
  # ITS OWN JOB, holding no `id-token`. The upload job needs that grant for
  # trusted publishing; nothing here does, and the two dispatches below reach
  # lanes that carry credentials of their own.
  publish-release:
    name: "Build: Release publication (Linux)"
    timeout-minutes: 130
    needs: publish-pypi
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      # Flipping the draft is a write to the release; the dispatches below are
      # writes to the Actions API.
      contents: write
      actions: write
    env:
      CI_EXEC_BUDGET_MINUTES: 10
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.publish-pypi.outputs.tag }}
    steps:
      # The tag name decides the publication flag, and it is a flag at the
      # moment of publication rather than a hold: nothing promotes a release
      # after this step, so a release meant to be a prerelease must be
      # published as one here or never be marked at all.
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          case "${TAG}" in
            *-rc*|*-alpha*|*-beta*|*-dev*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          gh release edit "${TAG}" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="${prerelease}"
          echo "::notice::published ${TAG} (prerelease=${prerelease})"

      # The package-manager pointers, now that there is something for them to
      # point at. A Scoop manifest and a Homebrew formula address assets by
      # release download URL, so they advertise the release rather than form
      # part of it, and the binaries lane used to push them while the release
      # was still held - sending `scoop update` and `brew upgrade` at a URL
      # that served nothing until the step above ran.
      #
      # A failure there does not retract the release. It is published and
      # verified by this point; the pointers lag by one dispatch, and
      # re-dispatching the channels lane for the same tag repairs them.
      - name: Point the release channels at this release
        shell: bash
        run: |
          set -euo pipefail
          if gh workflow run channels.yml --repo "$GITHUB_REPOSITORY" \
               --ref main -f tag="$TAG"; then
            echo "dispatched the channel pointers for ${TAG}"
          else
            echo "::warning::could not dispatch the channel pointers for ${TAG}; re-dispatch RAG Channels for this tag"
          fi

      # The acquisition check downloads the way a user does - unauthenticated
      # `curl` against the release download URL - so it cannot see a draft and
      # has to be asked after the publication above, not before it.
      #
      # It must be ASKED at all because a release published with the default
      # token raises no workflow events, so no `release: published` trigger
      # would fire for anything this lane produces. A dispatch is explicitly
      # exempt from that rule.
      #
      # A failure to dispatch does not fail the release: it is published and
      # verified by this point, and the weekly run still covers it.
      - name: Ask the acquisition check to try this release
        shell: bash
        env:
          TARGET_SHA: ${{ needs.publish-pypi.outputs.sha }}
        run: |
          set -euo pipefail
          if gh workflow run acquisition.yml --repo "$GITHUB_REPOSITORY" \
               --ref main -f tag="$TAG" -f target_sha="$TARGET_SHA"; then
            echo "dispatched the acquisition check for ${TAG}"
          else
            echo "::warning::could not dispatch the acquisition check for ${TAG}; its weekly run still covers this release"
          fi
