name: Publish

on:
  push:
    tags:
      - "vaultspec-rag-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. vaultspec-rag-v0.1.4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build
    timeout-minutes: 20
    # Release artifacts build on GitHub-HOSTED runners, deliberately: a
    # published wheel must not be built on a workstation that also runs agent
    # sessions and a live service. CI's lint/test jobs are the ones on the
    # self-hosted fleet.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  smoke-test:
    name: Smoke Test (py${{ matrix.python-version }})
    timeout-minutes: 20
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # One artifact, every supported interpreter. A leg that fails is the
      # signal; cancelling the others hides whether the break is version-specific.
      fail-fast: false
      matrix:
        # Must cover the whole `requires-python` range. This job installs the
        # built artifact into a clean env and runs it, so it is the gate that
        # catches "the wheel resolves but refuses to start on this interpreter"
        # — the exact failure a single-version smoke test ships green.
        python-version: ["3.13", "3.14"]
    env:
      # `--isolated` does not stop uv reading `.python-version` from the
      # checkout, which pins the floor. Without this the 3.14 leg would
      # silently smoke-test 3.13 and report success for a version it never ran.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      # Guards the env pin above: without it a mis-set UV_PYTHON would test
      # the floor twice and still go green.
      - name: Verify the interpreter under test
        run: |
          uv run --isolated --no-project python -c "
          import sys
          want = '${{ matrix.python-version }}'
          got = f'{sys.version_info[0]}.{sys.version_info[1]}'
          assert got == want, f'expected Python {want}, got {got}'
          print(f'smoke-testing under Python {sys.version.split()[0]}')
          "

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_check.py

      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_check.py

  publish-pypi:
    name: Publish to PyPI
    timeout-minutes: 15
    needs: smoke-test
    # OIDC trusted publishing works from self-hosted runners: the id-token
    # comes from GitHub's OIDC provider, not from the runner host.
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  github-release:
    name: Attach Release Assets
    timeout-minutes: 15
    needs: smoke-test
    # Hosted, like every other job in this workflow: `gh` and `sha256sum` both
    # ship on the hosted image, and the whole release path stays off the
    # self-hosted fleet.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum ./* > SHA256SUMS
          # MERGE into whatever the release already carries rather than
          # replacing it. binaries.yml and publish.yml both publish a file named
          # SHA256SUMS to the same release with --clobber, and neither knows
          # which ran first. On v0.4.11 the binaries run landed last and the
          # published manifest ended up describing only the six binaries - the
          # wheel and the sdist were attached with no digest anyone could check
          # them against, which is precisely the verifiability the manifest
          # exists to provide.
          #
          # Entries for the files THIS run is publishing are dropped from the
          # inherited copy before appending, so a re-run replaces its own lines
          # instead of duplicating them.
          if gh release download "${TAG}" --repo "$GITHUB_REPOSITORY"                --pattern SHA256SUMS --output inherited.txt 2>/dev/null; then
            while read -r _digest name; do
              [ -n "${name}" ] || continue
              grep -v -- "  ${name}$" inherited.txt > inherited.tmp || true
              mv inherited.tmp inherited.txt
            done < SHA256SUMS
            cat inherited.txt >> SHA256SUMS
            rm -f inherited.txt
            LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          fi

      - name: Ensure the GitHub Release exists
        # release-please normally creates the Release before dispatching this
        # workflow, but the manual tag-push trigger can fire against a tag
        # with no Release yet. --verify-tag refuses to create one for a tag
        # that isn't pushed; `|| true` is safe because the only failure mode
        # once the tag is verified is "already exists", which is the case we
        # want to no-op through.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag || github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes || true

      - name: Attach wheel, sdist, and checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag || github.ref_name }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
