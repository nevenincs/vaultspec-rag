name: RAG Publish

on:
  push:
    tags:
      - "vaultspec-rag-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. vaultspec-rag-v0.1.4)"
        required: true
        type: string
      stage:
        description: "release: build, attach and hand to Binaries. package-index: upload a promoted release's packages to PyPI."
        required: false
        default: release
        type: choice
        options:
          - release
          - package-index

permissions:
  contents: read

concurrency:
  # SHARED WITH binaries.yml AND KEYED BY TAG. Both workflows merge and rewrite
  # the same SHA256SUMS release asset, so separate per-workflow locks would
  # still permit a lost update when they run for one tag at the same time.
  # `cancel-in-progress: false` keeps a repair run queued rather than replacing
  # the only run that can attach the missing artifact.
  group: release-artifacts-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The dispatch input is free text from anyone who can run a workflow, and
  # every later job runs on the self-hosted fleet. So the tag is validated and
  # resolved to its commit HERE, on a hosted runner, and only that validated
  # pair reaches the fleet. The public remote is read without a checkout, so
  # nothing from the requested ref executes before it is proven a release tag.
  resolve-target:
    name: "Check: Release commit (Linux)"
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - name: Resolve exact release SHA
        id: commit
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            case "${REF}" in
              refs/tags/*) tag="${REF#refs/tags/}" ;;
              *) echo "::error::publication needs a tag ref, got ${REF}"; exit 1 ;;
            esac
          fi
          if ! [[ "${tag}" =~ ^vaultspec-rag-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: ${tag}"
            exit 1
          fi
          refs=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "${tag}")
          sha=$(awk -v ref="refs/tags/${tag}" '$2 == ref "^{}" { print $1; exit }' <<<"${refs}")
          [ -n "${sha}" ] || sha=$(awk -v ref="refs/tags/${tag}" '$2 == ref { print $1; exit }' <<<"${refs}")
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release tag ${tag} does not exist"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "${tag} resolves to ${sha}"

  # Every release-stage job descends from this one, so the package-index stage
  # skips the whole build chain by skipping it.
  hardware-validation:
    name: "Test: Release hardware"
    needs: resolve-target
    if: ${{ inputs.stage != 'package-index' }}
    uses: ./.github/workflows/hardware.yml
    with:
      target_sha: ${{ needs.resolve-target.outputs.sha }}
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      VAULTSPEC_RAG_TYPESAFE_API_KEY: ${{ secrets.VAULTSPEC_RAG_TYPESAFE_API_KEY }}

  hold-release:
    name: "Build: Prerelease hold (Linux)"
    needs: [resolve-target, hardware-validation]
    outputs:
      sha: ${{ needs.resolve-target.outputs.sha }}
    timeout-minutes: 10
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: write
    steps:
      - name: Hold the release as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-target.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "$GITHUB_REPOSITORY" --prerelease
          else
            gh release create "${TAG}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --prerelease
          fi

  build:
    name: "Build: Python package (Linux)"
    timeout-minutes: 20
    needs: hold-release
    outputs:
      sha: ${{ needs.hold-release.outputs.sha }}
    # Release artifacts build on the self-hosted fleet, on the same runners
    # CI's lint and test jobs use. The wheel is therefore built on a machine
    # that also runs agent sessions and a live service; the build's own
    # isolation is what keeps that honest, not the choice of runner.
    runs-on: [self-hosted, Linux, X64, build]
    env:
      # Building the sdist and wheel imports nothing from the local inference
      # stack, so `just init` leaves torch and its CUDA runtime out.
      VAULTSPEC_INIT_GPU_STACK: "none"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.hold-release.outputs.sha }}

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ needs.hold-release.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Set up just
        uses: taiki-e/install-action@6012bba2f8e3e666a2b212f8823c06831704ce92 # just
        with:
          tool: just@1.38.0

      - name: Initialize the worktree
        run: just init

      - name: Build package
        run: just build-python

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ needs.hold-release.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 5

  smoke-test:
    name: "Test: Package smoke (Linux, ${{ matrix.python-version }})"
    timeout-minutes: 20
    needs: build
    outputs:
      sha: ${{ needs.build.outputs.sha }}
    runs-on: [self-hosted, Linux, X64, build]
    strategy:
      # One artifact, every supported interpreter. A leg that fails is the
      # signal; cancelling the others hides whether the break is version-specific.
      fail-fast: false
      matrix:
        # Must cover the whole `requires-python` range. This job installs the
        # built artifact into a clean env and runs it, so it is the gate that
        # catches "the wheel resolves but refuses to start on this interpreter"
        # — the exact failure a single-version smoke test ships green.
        python-version: ["3.13", "3.14"]
    env:
      # `--isolated` does not stop uv reading `.python-version` from the
      # checkout, which pins the floor. Without this the 3.14 leg would
      # silently smoke-test 3.13 and report success for a version it never ran.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}

      - name: Require the exact release commit
        shell: bash
        env:
          TARGET_SHA: ${{ needs.build.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install "${UV_PYTHON}"

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.build.outputs.sha }}
          path: dist/

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_check.py

      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_check.py

  github-release:
    name: "Build: Release assets (Linux)"
    timeout-minutes: 15
    needs: [resolve-target, smoke-test]
    outputs:
      sha: ${{ needs.smoke-test.outputs.sha }}
    # On the fleet, like every other job in this workflow. It needs `gh` and
    # `sha256sum`, both of which the Linux build runners provide.
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      contents: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.smoke-test.outputs.sha }}
          path: dist/

      - name: Generate checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-target.outputs.tag }}
        run: |
          set -euo pipefail
          # Bare names, never `./*`: each manifest name must equal its release
          # asset name exactly, or the binaries workflow's final gate refuses to
          # promote the release. `--` keeps a leading dash from reading as a flag.
          sha256sum -- * > SHA256SUMS
          # MERGE into whatever the release already carries rather than
          # replacing it. binaries.yml and publish.yml both publish a file named
          # SHA256SUMS to the same release with --clobber, and neither knows
          # which ran first. On v0.4.11 the binaries run landed last and the
          # published manifest ended up describing only the six binaries - the
          # wheel and the sdist were attached with no digest anyone could check
          # them against, which is precisely the verifiability the manifest
          # exists to provide.
          #
          # Entries for the files THIS run is publishing are dropped from the
          # inherited copy before appending, so a re-run replaces its own lines
          # instead of duplicating them.
          if gh release download "${TAG}" --repo "$GITHUB_REPOSITORY"                --pattern SHA256SUMS --output inherited.txt 2>/dev/null; then
            # A manifest written before names were bare lists `./name`. Read
            # every inherited name bare, or a re-run keeps the stale spelling
            # and the exact-coverage gate refuses an otherwise complete release.
            sed -i -E 's#^([0-9a-f]{64})  \./#\1  #' inherited.txt
            while read -r _digest name; do
              [ -n "${name}" ] || continue
              grep -v -- "  ${name}$" inherited.txt > inherited.tmp || true
              mv inherited.tmp inherited.txt
            done < SHA256SUMS
            cat inherited.txt >> SHA256SUMS
            rm -f inherited.txt
            LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          fi

      - name: Attach wheel, sdist, and checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-target.outputs.tag }}
        run: |
          gh release upload "${TAG}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  dispatch-binaries:
    name: "Build: Binary dispatch (Linux)"
    timeout-minutes: 10
    needs: [resolve-target, github-release]
    runs-on: [self-hosted, Linux, X64, build]
    permissions:
      actions: write
      contents: read
    steps:
      # Publication is deliberately sequenced. Binaries is the sole finalizer
      # that may promote the release, so it must not start until the GitHub
      # wheel/sdist publication has succeeded. PyPI is not written here: see
      # publish-pypi.
      - name: Trigger Binaries workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-target.outputs.tag }}
          TARGET_SHA: ${{ needs.github-release.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run binaries.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field tag="${TAG}" \
            --field target_sha="${TARGET_SHA}"
          echo "Dispatched Binaries for ${TAG} at ${TARGET_SHA}" >> "$GITHUB_STEP_SUMMARY"

  # The package index is written LAST, and only for a release the Binaries
  # finalizer has proven complete and promoted. An upload can never be
  # withdrawn, while promotion is a flag. v0.4.35 is why: it reached PyPI from
  # this workflow, then failed the final archive gate and was demoted, so pip
  # and the GitHub release disagreed on the latest version.
  #
  # Binaries dispatches this stage after promotion. It queues behind that run
  # on the shared per-tag lock, and a maintainer may re-dispatch it to retry a
  # failed upload. It uploads the release's own wheel and sdist, checked
  # against the release's SHA256SUMS, so PyPI receives exactly the bytes the
  # final gate verified. Staying in this workflow keeps the trusted publisher
  # (publish.yml, environment pypi) unchanged.
  publish-pypi:
    name: "Build: Package index release (Linux)"
    timeout-minutes: 15
    needs: resolve-target
    if: ${{ inputs.stage == 'package-index' }}
    # OIDC trusted publishing works from self-hosted runners: the id-token
    # comes from GitHub's OIDC provider, not from the runner host.
    runs-on: [self-hosted, Linux, X64, build]
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve-target.outputs.tag }}
    steps:
      - name: Require a promoted release
        shell: bash
        run: >-
          gh release view "${TAG}" --repo "$GITHUB_REPOSITORY"
          --json isDraft,isPrerelease
          --jq 'if .isDraft or .isPrerelease then error("not a full release
          (draft=\(.isDraft) prerelease=\(.isPrerelease)); PyPI follows
          promotion, so dispatch RAG Binaries for this tag first") else
          "full release" end'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Publish the release's verified packages to PyPI
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#vaultspec-rag-v}"
          wheel="vaultspec_rag-${version}-py3-none-any.whl"
          sdist="vaultspec_rag-${version}.tar.gz"
          # RUNNER_TEMP is emptied per job; a reused fleet workspace is not.
          work="${RUNNER_TEMP}/package-index"
          mkdir -p "${work}/dist"
          gh release download "${TAG}" --repo "$GITHUB_REPOSITORY" \
            --dir "${work}" --pattern SHA256SUMS
          gh release download "${TAG}" --repo "$GITHUB_REPOSITORY" \
            --dir "${work}/dist" --pattern "${wheel}" --pattern "${sdist}"
          # Exactly these two lines: a manifest missing either would otherwise
          # pass by checking nothing.
          awk -v wheel="${wheel}" -v sdist="${sdist}" '$2 == wheel || $2 == sdist' \
            "${work}/SHA256SUMS" > "${work}/packages.sha256"
          if [ "$(wc -l < "${work}/packages.sha256")" -ne 2 ]; then
            echo "::error::SHA256SUMS on ${TAG} does not list exactly ${wheel} and ${sdist}"
            exit 1
          fi
          (cd "${work}/dist" && sha256sum -c ../packages.sha256)
          uv publish --check-url https://pypi.org/simple/ "${work}/dist/${wheel}" "${work}/dist/${sdist}"
