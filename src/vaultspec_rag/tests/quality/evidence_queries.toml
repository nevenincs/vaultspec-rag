# Evidence-labelled query set for the vault evidence quality gate.
#
# Authored blind from the frozen reference vault, without viewing any search
# output, MCP search tool result, or ranker source. Each case names the
# governing record, the nearest heading above the chosen span, and a verbatim
# evidence span copied from that record. The gate checks whether a search
# result's snippet contains the evidence span after whitespace and
# inline-markup normalisation (backticks and bold markers stripped, runs of
# whitespace collapsed, case folded). "kind" is "paraphrase" when the query
# avoids the evidence's distinctive wording, or "direct" when the query must
# name a specific identifier the evidence itself names. "gold" lists every
# record that independently answers the query; almost every case has exactly
# one.

[[case]]
id = "e01"
query = "Can the new indexing pipeline run without a graphics card or on Apple hardware?"
kind = "paraphrase"
note = "Only this ADR states the new stack cannot run without CUDA or on macOS."
  [[case.gold]]
  doc_id = "adr/2026-03-06-gpu-only-rag-stack-adr"
  section = "Negative"
  evidence = "Requires CUDA-capable GPU with ~3 GB VRAM. Cannot run on CPU-only machines or macOS without CUDA."
  body_offset = 5269

