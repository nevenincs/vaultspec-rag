[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{ name = "Gergely Wootsch", email = "hello@gergely-wootsch.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Indexing",
  "Typing :: Typed",
]
dependencies = [
  "sentence-transformers>=5.0",
  "torch>=2.4",
  "transformers>=4.51",
  "huggingface-hub>=1.24.0",
  "numpy>=2.5.1",
  "qdrant-client>=1.16.0",
  "pydantic>=2.12.5",
  "rich>=14.3.2",
  "vaultspec-core>=0.1.45",
  "typer>=0.26.7",
  "click>=8.1.7",
  "python-dotenv>=1.0.0",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.10,<1.6.2",
  "pathspec>=0.12",
  "watchfiles>=1.0.0",
  "psutil>=6.0.0",
  "tomlkit>=0.13",
  "packaging>=24.0",
  "anyio>=4.14.2",
  "starlette>=1.3.1",
  "uvicorn>=0.51.0",
  "textual>=8.2.8",
]
description = "GPU-accelerated semantic search for your docs and source code: hybrid dense + sparse RAG on a local Qdrant backend, served to Claude Code and other MCP clients."
keywords = [
  "claude-code",
  "code-search",
  "cuda",
  "embeddings",
  "gpu",
  "hybrid-search",
  "mcp",
  "qdrant",
  "rag",
  "reranking",
  "retrieval-augmented-generation",
  "semantic-search",
  "sentence-transformers",
  "splade",
  "vaultspec",
  "vector-search",
]
license = { file = "LICENSE" }
name = "vaultspec-rag"
readme = "README.md"
requires-python = ">=3.13,<3.15"
version = "0.4.1"

  [project.scripts]
  vaultspec-rag = "vaultspec_rag.__main__:main"
  vaultspec-search-mcp = "vaultspec_rag.server:main"

  [project.urls]
  "Bug Tracker" = "https://github.com/nevenincs/vaultspec-rag/issues"
  Changelog = "https://github.com/nevenincs/vaultspec-rag/blob/main/CHANGELOG.md"
  Documentation = "https://github.com/nevenincs/vaultspec-rag/tree/main/docs"
  Homepage = "https://github.com/nevenincs/vaultspec-rag"
  Repository = "https://github.com/nevenincs/vaultspec-rag"

  [project.optional-dependencies]
  # There is deliberately no `dev` extra here. The development toolchain lives
  # in `[dependency-groups].dev` below, which is what `uv sync --group dev` and
  # every CI job install. A `dev` extra existed alongside it and was installed
  # by nothing; it had drifted into a stale subset, missing the type checker
  # and every complexity, dead-code, dependency and security tool, so anyone
  # who did install it got a toolchain that silently could not run the gates.
  #
  # The agent-facing MCP server is an opt-in extra: the CLI and the HTTP search
  # daemon never import `mcp`, so a base install must not drag it (and, on
  # Windows, its `pywin32` transitive). Install `vaultspec-rag[mcp]` to run the
  # MCP server.
  mcp = ["mcp>=2,<3"]

[dependency-groups]
dev = [
  # The test suite imports `mcp` (it tests the optional MCP server surface), so
  # the dev environment provides it even though it is not a core dependency.
  "mcp>=2,<3",
  "bandit>=1.9.4",
  "basedpyright>=1.39",
  # Cognitive complexity. Implements the Sonar cognitive-complexity
  # specification and is configured from `[tool.complexipy]` below, which
  # replaced a flake8 plugin driven by command-line flags from a wrapper
  # script. It also scores markedly stricter than the plugin did: the tree's
  # worst function measured 20 under the plugin and 44 under this.
  "complexipy>=6.2",
  "deptry>=0.25.1",
  "identify>=2.0.0",
  "mdformat>=1.0.0",
  "mdformat-frontmatter>=2.0.10",
  "mdformat-gfm>=1.0.0",
  "pymarkdownlnt>=0.9.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-durations>=1.0.0",
  "pytest-reportlog>=0.4.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  # Module length and the class-shape design limits ruff has no rule for
  # (C0302, R0902, R0904, R0916). Everything else pylint would report is
  # already covered by ruff and stays disabled.
  "pylint>=4.0",
  "radon>=6.0.1",
  "ruff>=0.15.2",
  "ty>=0.0.15",
  "vulture>=2.16",
  "xenon>=0.9.3",
]

[tool.uv]
# Pin transitive deps up to non-vulnerable versions. `uv audit` flags
# python-multipart<0.0.26 (CVE-2026-40347) via `mcp`. constraint-dependencies
# forces the resolver to pick a fixed release without us taking a direct dep.
constraint-dependencies = ["python-multipart>=0.0.26"]

  [tool.uv.sources]
  torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  ]

  [[tool.uv.index]]
  explicit = true
  name = "pytorch-cu130"
  url = "https://download.pytorch.org/whl/cu130"

[tool.hatch.build.targets.wheel]
packages = ["src/vaultspec_rag"]
# The suite lives inside the package, so `packages` swept it into the wheel:
# 263 of 456 files shipped were tests, importable in a user environment as
# `vaultspec_rag.tests.*`. That was incidental rather than intended, and the
# evidence is that nothing could have used it - no runtime module imports the
# tests package, no verb runs it, and 352 of its files import pytest at module
# scope while pytest is not a runtime dependency. Every one of them raised on
# import in the environment they were shipped to.
#
# The sdist deliberately keeps them: a source distribution is the artifact a
# downstream packager runs the suite from, and there pytest is available.
# Excluding here changes no gate - `just test python` and `just test gpu` both
# run pytest against the checkout, never the installed copy.
exclude = ["src/vaultspec_rag/tests"]

# The companion-owned builtins (the rule and MCP definition) ship as
# committed package data under ``src/vaultspec_rag/builtins/``, mirroring
# how ``vaultspec_core.builtins`` bundles core's own content. They reach
# both the sdist and the wheel through ``packages`` above, so no
# force-include indirection is needed. Only the standalone assets, which
# live outside the package, still need an explicit sdist include.
[tool.hatch.build.targets.sdist.force-include]
"assets/logo.png" = "assets/logo.png"
"assets/logo.svg" = "assets/logo.svg"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# GPU test runs materialize real Qdrant stores under the pytest temp
# root; retaining every run's directories once filled a system drive
# (50k+ leftover dirs). Keep temp only for failing tests and only for
# the most recent run.
log_cli = true
log_cli_date_format = "%H:%M:%S"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_level = "INFO"
log_file = "test-debug.log"
log_file_level = "DEBUG"
markers = [
  "unit: fast tests with no external dependencies",
  "integration: requires CLI tools and network",
  "cuda: requires serialized access to a real CUDA device",
  "subprocess_gpu: CLI subprocess tests that load their own GPU models (run separately from integration)",
  "performance: benchmarking tests for throughput and latency",
  "quality: precision/recall and document coverage tests",
  "robustness: edge case and error handling tests",
  "timeout: timeout in seconds for individual tests",
]
testpaths = ["src/vaultspec_rag/tests"]
timeout = 300
timeout_func_only = true
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 88
target-version = "py313"

  [tool.ruff.lint]
  # NOTE: preview is deliberately OFF here — enabling it globally changes the
  # behavior of stable rules (e.g. F401 submodule tracking) and surfaces
  # findings in src/ owned by the remediation campaign. The preview-only
  # nesting-depth rule (PLR1702) is gated separately by `just lint
  # nesting`, which runs a scoped `--select PLR1702 --preview` instead.
  ignore = ["TID252"]
  select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "ARG",     # flake8-unused-arguments
    "SIM",     # flake8-simplify
    "TCH",     # flake8-type-checking
    "RUF",     # ruff-specific rules
    "N",       # pep8-naming
    "TID",     # flake8-tidy-imports
    "C90",     # mccabe complexity
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
  ]
  unfixable = ["B"]

    [tool.ruff.lint.mccabe]
    max-complexity = 15

    # ``http.server.BaseHTTPRequestHandler`` dispatches an incoming request to
    # ``do_<VERB>``, so a handler MUST spell these names exactly - they are the
    # stdlib's protocol, not a style choice. Ruff waives N802 for them only when
    # that stdlib class is the DIRECT base; the test suite's handlers derive from
    # one shared quiet base instead, which hides the ancestry from the check, so
    # the waiver is stated here. Scoped to the verbs the suite actually serves.
    [tool.ruff.lint.pep8-naming]
    extend-ignore-names = ["do_GET", "do_HEAD", "do_POST"]

    [tool.ruff.lint.isort]
    known-first-party = ["vaultspec_rag"]

    [tool.ruff.lint.flake8-type-checking]
    runtime-evaluated-decorators = ["app.command", "service_app.command"]
    # Pydantic resolves a model's annotations when the class is created, so a
    # type used only in a field annotation is still needed at RUNTIME. Without
    # this, TC001 tells you to defer an import that the model then cannot
    # resolve, and the suggestion is only safe when the type happens to be used
    # somewhere else at runtime too.
    runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ty.environment]
python-version = "3.13"
# "all" makes no platform assumptions, so the win32-only sandbox/job-object
# modules and the posix-only signal paths both resolve on every checking
# host - CI's Linux ty otherwise rejects ctypes.WinDLL and a win32 host
# would reject signal.SIGKILL.
python-platform = "all"
root = [".", "src"]

# Strict-mode type checking — now GATING (the burndown reached zero on
# 2026-06-10). `ty` remains the fast gate to run by hand; basedpyright gates in CI
# and `just lint all`. Run via `just lint type-strict` or `just health`.
[tool.basedpyright]
include = ["src/vaultspec_rag"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

  # Tests legitimately reach into the private internals of the modules they
  # exercise, so reportPrivateUsage is a trust-boundary false positive inside
  # the test tree (fixing it by making internals public would damage the
  # design). Every other strict rule stays ON for tests.
  [[tool.basedpyright.executionEnvironments]]
  reportPrivateUsage = false
  root = "src/vaultspec_rag/tests"

# Cognitive complexity — how much state a reader must hold to follow a
# function, as distinct from the number of paths through it that `xenon`
# measures. Nesting compounds the score here, so a deeply-indented function
# ranks far worse than a flat one with the same branch count.
#
# BASELINE-CALIBRATED (captured 2026-07-27): 20 is the current worst
# production function. Ratchet DOWN as hotspots are paid off; never raise.
# Long-term target: 15, the tool's own default.
#
# Ratcheted 25 -> 20 once the seven functions above 20 were paid down by
# extraction. The remaining distance, measured at the same time:
#
#     over 19:   7 functions
#     over 18:  16
#     over 17:  24
#     over 16:  39
#     over 15:  57      <- the target
#
# Production only. The tree's worst score overall is 44, in a test that walks
# the AST of every module to prove a structural invariant; that shape is
# inherent to the guard, not debt to pay down. Tests are measured by
# `just audit complexity` instead, which reports without failing.
[tool.complexipy]
exclude = ["**/tests/**"]
max-complexity-allowed = 20

# pylint runs with every check off except the four that ruff has no rule for.
# It is not a second general-purpose linter here — enabling more would produce
# findings ruff already reports, under a different code, with no new signal.
[tool.pylint.main]
# Tests are not excluded. They were, and their length was invisible while
# the gate held production: the longest test module reached 3196 lines
# against a ceiling nothing measured it by. A suite grows the same way a
# module does, and gets just as hard to read.
jobs = 0

[tool.pylint."messages control"]
disable = ["all"]
# C0302 too-many-lines            — module length; ruff has no rule for it
# R0902 too-many-instance-attributes — class state a reader must track
# R0904 too-many-public-methods   — class surface area
# R0916 too-many-boolean-expressions — condition legibility
enable = ["C0302", "R0902", "R0904", "R0916"]

# Module length. This replaced a bespoke script that reimplemented the same
# count; the ceiling is a ratchet, not a target — lower it whenever an
# extraction lands, and never raise it.
#
# The census counts every module the gate measures, which is now the whole
# tree. An earlier census counted the tree while the gate excluded tests,
# setting the ceiling against a module it could never see. Count what the
# gate counts, and gate what the census counts.
#
# Census (2026-08-14, 671 modules, tests included):
#
#     over 1500:   0
#     over 1200:  35
#     over 1000:  50
#     over  500: 182        <- where modules should settle
#
# Longest module: vaultspec_rag/tests/test_config.py at 1488 lines.
#
# `just health` ranks the whole tree on the other dimensions.
[tool.pylint.format]
max-module-lines = 1500

# BASELINE-CALIBRATED (captured 2026-07-27): each sits at the current worst
# offender, so the gate is green today and can only be ratcheted DOWN.
# pylint defaults: max-attributes=7, max-public-methods=20, max-bool-expr=5.
[tool.pylint.design]
max-attributes = 28     # baseline worst: 28 (58 classes exceed the default 7)
max-bool-expr = 9       # baseline worst: 9  (8 conditions exceed the default 5)
max-public-methods = 39 # baseline worst: 39 (4 classes exceed the default 20)

# Dead code. Advisory, not gating: vulture infers reachability and cannot see
# dynamic dispatch, so a finding is a lead to confirm rather than a verdict.
# Confidence 80 drops the guess-heavy tier that reports decorated and
# lazily-bound callables as unused.
[tool.vulture]
exclude = ["*/tests/*", "*test_*.py"]
ignore_decorators = [
  "@app.command",
  "@app.callback",
  "@service_app.command",
  "@click.command",
  "@click.group",
  "@pytest.fixture",
  "@field_validator",
  "@model_validator",
  "@property",
]
# Every name here is fixed by a protocol this code implements, or is reachable
# only through a string the scanner cannot follow. None is dead. Each was
# confirmed by reading the site before being listed - the list is not a way to
# quiet a finding that has not been read.
#
# - exc_type/exc_val/exc_tb: `__exit__` fixes the names of its three trailing
#   parameters, so a context manager that ignores them reports each as unused.
# - SupportedLanguage: imported under TYPE_CHECKING and referenced only from
#   the string form `cast("SupportedLanguage", ...)`, which vulture does not
#   resolve. Deleting the import breaks type checking.
#
# Two further names were listed here and have been REMOVED, because listing
# them was the mistake this comment exists to prevent. They were the parameters
# of a Protocol that typed a Windows call which had already moved to another
# module: the Protocol had no remaining user and was dead. Reading the site
# showed the names were fixed by a signature, which is true and irrelevant -
# the question the scanner was actually asking is whether anything still uses
# the thing they belong to. Follow a finding up to its owner before listing it.
ignore_names = ["exc_type", "exc_val", "exc_tb", "SupportedLanguage"]
min_confidence = 80
paths = ["src/vaultspec_rag"]

# Security. Advisory: this project spawns subprocesses (the vector-store
# binary, the managed daemon) and builds store filter expressions by
# construction, so the subprocess and SQL families report the design rather
# than a defect. They stay ENABLED and are read per finding — suppressing a
# family wholesale would also hide the first real one.
#
# The test tree is excluded by the `-x` flag in the `just audit security`
# recipe, NOT by an `exclude_dirs` key here. bandit reads `skips` from this
# table but silently ignores `exclude_dirs` from it: configured here the scan
# returns 320 findings, 280 of them inside the tree this was meant to exclude.
# A suppression that does not suppress is worse than none, so the exclusion
# lives where it demonstrably takes effect.
[tool.bandit]
# B101: `assert` is pytest's contract, and the excluded test tree is where it
# is load-bearing. Production invariants that must survive `-O` raise instead.
skips = ["B101"]

# Dependency drift. Reports imports that resolve only transitively — a
# transitive bump can withdraw one without any change here.
#
# The test tree is excluded because it ships INSIDE the package, at
# `src/vaultspec_rag/tests/`. deptry classifies by path, not by marker, so it
# reads every `import pytest` there as production code reaching for a dev
# dependency and reports the whole tree under DEP004. The exclusion is a
# limitation of that classification, not a decision to stop checking tests.
[tool.deptry]
extend_exclude = [".*[\\/]tests[\\/].*"]
known_first_party = ["vaultspec_rag"]

  # Each entry is a deliberate declaration the scanner cannot infer, not a
  # finding waved through. Nothing else is suppressed.
  [tool.deptry.per_rule_ignores]
  # DEP002 is "declared but never imported". Both of these are version FLOORS
  # on packages reached through another dependency, pinned here on purpose:
  # `transformers` is what sentence-transformers loads models through, and
  # `tree-sitter` is the runtime `tree-sitter-language-pack` parses with. The
  # only direct reference to `tree_sitter` is a typing-time import of `Node`.
  # Dropping either pin would leave the floor to whatever the intermediate
  # package happens to require.
  DEP002 = ["transformers", "tree-sitter"]
  # DEP003 is "imported but only transitive". `tqdm` arrives with the hub and
  # is imported lazily behind ImportError, which the code treats as survivable
  # by falling back to a plain download with no progress bar. Declaring it
  # would make a genuinely optional import look mandatory.
  DEP003 = ["tqdm"]
